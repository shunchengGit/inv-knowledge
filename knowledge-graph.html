profit-trend, 2026-Q1; 共同关键词(12): yoy, beat, 2026, pdf\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(8): yoy, 2026, pdf, 00\n- [福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform](entries/福耀玻璃BNP-1Q26-运营和利润率保持稳健-重申Outperform.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(7): yoy, 2026, pdf, 00\n- [腾讯控股UBS 1Q26：符合预期，低估值的期权价值](entries/腾讯控股UBS-1Q26-符合预期-低估值的期权价值.md) — 共享标签: profit-trend, valuation, 2026-Q1; 共同关键词(14): read, ub, 2026, 1q26", "n171": "## 摘要\n\n安克创新（A股300866，H股00668）于2026年6月23-26日公开招股，全球发售46,632,800股H股，最高发售价HK$99.32，入场费约HK$1万。集资净额约HK$45.23亿，对应总市值~HK$720亿。基石阵容豪华，Schroders、Aspex、Principal、高瓴、Jane Street等11家合计认购2.95亿美元，锁定49.9%发售股份。AH折价21-27%属A+H蓝筹正常偏低区间，首日孖展0.39x反映散户情绪平淡。2025年经营现金流骤降至4.81亿（2024年为27.45亿）为最突出财务红旗。\n\n## 关键要点\n\n\n- **募资与估值**：全球发售46.6M股H股，超配15%，集资净额~HK$45.23亿。H股市值~HK$46.3亿，总市值~HK$720亿。PE~24.56x（A股），非历史高位，AH折价21-27%处合理区间。\n- **营收与增长**：收入从2023年175亿增至2025年305亿（CAGR~32%），增速从+41%放缓至+24%，属高基数正常回落。净利润从16.15亿增至25.45亿（CAGR~26%），净利率从9.2%微降至8.3%。\n- **⚠️ 经营现金流红旗**：2025年经营现金流仅4.81亿，较2024年的27.45亿骤降82%。现金虽增至30.68亿，但经营现金流恶化需密切关注——可能反映应收账款累积或渠道库存压力。\n- **品牌矩阵**：Anker充电（50.5%收入）、eufy智能家居（27.1%）、soundcore影音（22.4%）、Anker SOLIX储能（新兴）。亚马逊渠道依赖从57%降至52%，渠道多元化有效推进中。\n- **基石阵容**：11家机构合计2.95亿美元，覆盖49.9%发售股份。Schroders（$70M）为最大股东，Aspex（$50M）、Principal（$40M）紧随其后，高瓴HHLR（$20M）、Jane Street（$15M）在列，信号积极。\n- **研发投入**：R&D占比从8.1%（2023）升至9.5%（2025），绝对值从14.2亿增至29亿，积极信号。\n- **2026Q1信号**：净利润4.72亿，同比-4.87%，增长放缓确认。孖展首日0.39x、次日0.99x反映散户兴趣有限。\n- **保荐人与风险**：中金/高盛/摩根大通联合保荐。主要风险：亚马逊依赖（仍占52%）、经营现金流恶化、增长放缓、AH溢价收窄预期。\n\n\n## 关联\n\n- [JPMorgan中国AI应用调研：从模型竞赛到应用落地的转折点](entries/JPMorgan中国AI应用调研-从模型竞赛到应用落地的转折点.md) — 同主题：中国消费电子/AI应用\n- [Broadcom FY26Q2多投行研报汇总：AI需求爆发但预期过高，后端供应成新瓶颈](entries/broadcom-AVGO-FY26Q2-multi-bank-analysis.md) — 同主题：半导体/硬件供应链\n- [德银中国NEV周度新订单监控（2026年6月第3周）](entries/db-china-nev-weekly-orders-2026-06.md) — 同主题：中国消费电子与新能源", "n172": "# 工业富联AI服务器持续驱动增长\n\n## 摘要\n工业富联凭借AI基础设施需求爆发实现强劲增长，Morgan Stanley三篇报告均维持Overweight评级，目标价82.80元。1Q26营收2510亿元(+57% YoY)，营业利润beat MS/consensus分别7%/14%，主因AI服务器机架出货量大幅增长(GPU+3.8x YoY, ASIC+3.2x YoY)。毛利率持续改善至7.9%，营业利润率6.2%。2Q26管理层指引收入增长>15% YoY，AI服务器为主要驱动力，GB300仍占多数出货。\n\n## 关键要点\n\n- 1Q26云设备收入同比翻倍，AI GPU机架出货+3.8x YoY，AI ASIC服务器+3.2x YoY\n- 毛利率7.9%、营业利润率6.2%持续上升，体现规模效应与内部元器件采购优化\n- Vera Rubin NVL72机架量产目标3Q26末，产能准备中，4Q26开始放量\n- CPO交换机已进入量产准备阶段，预计3Q26量产；折叠手机机械部件同步推进\n- MS预测FY26/27/28 EPS分别为3.08/4.04/4.97元，AI收入占比持续提升\n\n## 关联\n- [汇川技术综合分析](entries/汇川技术多投行综合分析.md)\n- [澜起科技内存接口AI受益](entries/澜起科技AI互联分析.md)", "n173": "# 希音国际2026年港股招股书：418亿美元收入与关税压力下的全球时尚平台\n\n## 摘要\n希音国际于2026年8月24日披露港股正式招股书，拟发行约2.80亿股B类股份，最高发售价49.50港元，股份代码00625；按发行完成且未计超额配股权测算，发售股份约占总股本6.59%。公司以按需测试与追单模式（LATR）连接全球消费者和供应链：新品首批通常仅生产约100至200件，最快5天追单，2025年拥有2.73亿活跃客户、10.78亿笔订单和超过7,500家合同制造商。\n\n财务上，收入从2023年的321.03亿美元增至2025年的418.47亿美元，两年复合增速14.2%，但2025年增速已放缓至8.0%；同期经营利润由13.76亿美元增至17.07亿美元，经营利润率4.1%。2025年净利润20.64亿美元、净利率4.9%，低于2024年的33.65亿美元和8.7%，主要受可转换可赎回优先股公允价值变动减少影响，不能仅凭净利润同比判断主营恶化。2026年第一季度收入90.52亿美元，同比仅增1.1%，经营利润2.58亿美元、利润率2.9%，账面净亏损0.99亿美元，其中优先股公允价值亏损3.28亿美元是重要非经营性扰动。\n\n公司最大的结构性风险已从单纯增长竞争转向跨境税务与监管成本。美国自2025年5月取消中国低值包裹免税后，美国收入占比由2024年的27.0%降至2025年的24.1%，2026Q1进一步降至22.5%；欧洲2025年贡献35.4%收入，欧盟低值包裹关税政策变化可能造成与美国相当甚至更大的冲击。公司采取提价、本地备货与履约、正式报关及强化贸易合规等措施，但2026Q1单均履约费用已由上年同期17.7美元升至17.9美元，营销费用率也由12.2%升至15.8%，利润率仍面临验证压力。\n\n## 关键要点\n- **发行安排**：全球发售约2.80亿股B类股份，其中香港公开发售约2,800万股；最高发售价49.50港元，股份代码00625，发售股份约占发行后股本6.59%。\n- **规模与增速**：2023—2025年收入分别为321.03亿、387.48亿、418.47亿美元，同比增速依次为41.1%、20.7%、8.0%，高增长明显降档。\n- **利润质量**：2025年经营利润17.07亿美元、经营利润率4.1%，较2024年的2.5%回升；净利润受优先股公允价值变动显著影响，分析经营质量应优先看经营利润而非账面净利润。\n- **2026Q1压力**：收入90.52亿美元，同比增1.1%；经营利润2.58亿美元，同比下降约26%，经营利润率由3.9%降至2.9%；净亏损0.99亿美元主要包含3.28亿美元优先股公允价值亏损。\n- **客户与订单**：活跃客户由2023年的1.86亿增至2025年的2.73亿，订单由7.15亿增至10.78亿；年均下单频次维持约4次，增长主要来自客户扩张而非频次提升。\n- **收入结构**：服务收入占比由2023年的2.7%升至2025年的11.3%，2026Q1达14.3%；服装收入占比由68.8%降至61.4%，平台化及品类扩张正在推进。\n- **区域迁移**：美国收入占比从2023年的29.4%降至2026Q1的22.5%，欧洲2025年占35.4%，其余地区2026Q1占45.4%，区域多元化部分缓冲美国压力。\n- **供应链壁垒**：LATR以100至200件小批量测试、最快5天追单，依靠智能分单及全球履约网络降低库存和滞销；2025年合作合同制造商超过7,500家。\n- **核心风险**：美国低值免税取消、欧盟低值包裹关税调整、多司法辖区监管调查、税务海关合规、知识产权与供应链治理，均可能抬升履约和合规成本。\n- **治理结构**：A类股每股10票、B类股每股1票；发行后创始人许仰天预计持股约30.3%但控制约49.9%投票权，外部股东需承担同股不同权治理风险。\n- **股东回报**：公司上市后目标年度股息不低于扣除重大资本开支后的年度净利润50%，但实际分红仍取决于董事会授权、利润质量与资本开支。\n- **跟踪指标**：重点观察美国及欧洲收入增速、单均履约费用、营销费用率、服务收入占比、经营利润率，以及关税冲击后的提价与本地履约能否恢复增长。\n\n## 关联\n- [野村证券中国互联网2026年6月月度流量与App跟踪报告](entries/野村证券中国互联网2026年6月月度流量与App跟踪报告.md) — 以第三方App数据验证Shein全球MAU同比增速由14%放缓至5%，并补充欧洲政策压力。\n- [美国银行5月App数据跟踪：中国电商与在线媒体格局分析](entries/BofA-5月App数据跟踪-中国电商与在线媒体格局分析.md) — 提供跨境电商与互联网平台流量变化的外部对照。\n\n## 引用\n- [希音国际控股有限公司2026年港股招股书](res/希音/2026-08-24-SHEIN-希音国际-港股招股书.pdf)\n- [港交所正式招股书原文](https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082400019.pdf)", "n174": "# 微软FQ4’26财报后分析：Azure预测上修与利润率韧性构成制胜公式\n\n## 摘要\n微软FQ4’26营收900亿美元、固定汇率增长17%，Azure增长43%，分别超过UBS对总收入889亿美元和市场对Azure约41%的预期。新增1吉瓦算力更快上线、GitHub Copilot改为用量定价，以及核心企业云需求稳健，共同推动Azure季度净增收入达到创纪录的37亿美元。与此同时，微软维持会计调整前CY26资本开支1900亿美元，FY27营业利润率降幅指引小于100基点，说明管理层仍能在AI扩张与盈利纪律之间保持平衡。UBS据此把FY27每股收益上调2%至19.68美元、目标价升至525美元，判断当前20倍CY27 GAAP市盈率仍属合理，但长期租赁义务与OpenAI收入集中度仍需监控。\n\n## 关键要点\n- **Azure进入更高增速平台**：FQ4’26 Azure固定汇率增长43%，FQ1’27指引45%；UBS进一步把FQ2’27即2026年12月季度预测从42%-43%上调至46%，核心依据是算力上线节奏与需求可见度同时改善。\n- **收入增量比百分比更有信息量**：FQ4 Azure季度环比收入净增37亿美元，远高于FQ3的21亿美元并创历史纪录；FQ1’27指引隐含净增约30亿美元，说明即使在更大基数上，绝对增量仍处高位。\n- **GitHub Copilot改价形成可量化贡献**：GitHub Copilot季度收入增长60%，显著高于UBS原估的27%；仅一个月改价影响就额外贡献约1亿美元、相当于FQ4 Azure收入约50个基点，完整季度对FQ1增速的拉动可能超过1个百分点。\n- **算力供给瓶颈正在边际缓解**：微软连续三个季度每季新增约1吉瓦容量，九个月合计3吉瓦，UBS估算对应超过300亿美元潜在增量收入能力；更快完成数据中心投产，是45%增长指引可信度的重要基础。\n- **需求并非只依赖前沿模型公司**：剔除OpenAI后新增商业订单仍增长18%，商业剩余履约义务环比增加510亿美元且全部来自前沿实验室之外客户，表明传统企业CPU与AI云需求同样稳健。\n- **OpenAI收入规模首次透明化**：微软披露FY26与OpenAI商业安排产生240亿美元收入，约占集团收入7%；它强化AI货币化证据，也意味着评估Azure时必须对单一客户采购、融资能力及收入确认方式给予折价。\n- **资本开支“未再上调”是关键利好**：FQ4同口径总资本开支约410亿美元，公司重申会计调整前CY26资本开支1900亿美元；新口径1750亿美元少出的150亿美元主要来自租赁分类变化，并非需求或投资计划收缩。\n- **FY27资本开支下调多为会计重分类**：UBS将FY27资本开支预测由2610亿美元降至2130亿美元，480亿美元差额大部分由融资租赁转经营租赁造成；若按旧口径观察，投资者仍可能以约2500亿美元作为FY27起始估算。\n- **M365商业化将于FY27逐季增强**：FQ4 M365 Commercial Cloud增长14%，席位增长6%，Copilot席位由上季2000万升至3000万；管理层预计FQ1增长15%、调整后16%，此后随Cowork、E7和提价逐季加速。\n- **利润率控制抵消折旧压力**：FQ4毛利率67%、营业利润率45%，后者同比仍增加20基点；FQ1指引隐含营业利润率48.5%，高于UBS原估47.8%，FY27全年降幅小于100基点，体现裁员、定价和运营效率的对冲作用。\n- **盈利与估值形成正向组合**：UBS将FY27 EPS由19.26美元升至19.68美元、FY28由22.12美元升至23.17美元，目标价由480美元升至525美元；报告时股价425.01美元，对应24.5%含股息预期回报。\n- **主要反证指标清晰**：若FQ2 Azure不能维持45%左右、M365未随3000万Copilot席位加速，或FY27现金资本开支迫近经营现金流上限，AI收入质量与估值溢价都需重新审视；租赁义务大增也暗示FY28以后投资强度未必下降。\n\n## 关联\n- [微软4Q/FY26财报前瞻：Azure增长强劲、Capex预期上修与M365加速](entries/msft-4qfy26-azure-capex-m365-ubs-update.md) — 对照UBS财报前将FY27资本开支上调至2610亿美元的谨慎预期，理解本次“资本开支未再上调”为何构成正面意外。\n- [MSFT FQ3’26深度分析：Capex飙升、Azure加速与定价模式转型](entries/MSFT-FQ3-26-深度分析-Capex飙升-Azure加速与定价模式转型-UBS.md) — 提供上一季度Azure、资本开支和消费定价转型的基准。\n- [微软4QFY26业绩前瞻与Copilot商业化NYC NDR反馈](entries/microsoft-4qfy26-preview-and-copilot-nyc-ndr-feedback.md) — 验证财报前对Copilot席位与资本开支的市场争议，并比较实际3000万席位表现。\n\n## 引用\n- [UBS：Winning Formula，Azure Estimates Up，Capex Reaffirmed](res/微软/2026-07-30-MSFT.OQ-UBS Equities-Microsoft Corp. _Winning Formula – Azure Estimates Up, Capex...-123488392.pdf)\n- 报告日期：2026年7月30日；评级：Buy；目标价：525美元；本文数字主要取自报告第1至8页。", "n175": "# 微软FQ4’26财报后分析：Azure超预期与资本开支上限逐步清晰\n\n## 摘要\n微软FQ4’26交出营收900.07亿美元、同比增长18%的强劲成绩，Azure按固定汇率增长43%，不仅高于公司39%-40%的指引，也超过买方约41%的预期。更重要的是，公司给出FQ1’27 Azure增长45%的指引，同时表示FY27仍将保持自由现金流为正，使市场第一次能够用经营现金流为AI资本开支划出可观察的上限。BNP Paribas认为，GitHub Copilot转向按用量收费后季度收入增长超过60%，证明AI需求正从席位扩张走向用量变现。结论是微软已接近“收入增速最终跑赢资本开支增速”的平衡点，但OpenAI贡献FY26收入241亿美元，也暴露出客户集中度与应收账款风险。\n\n## 关键要点\n- **Azure增长明显超预期**：FQ4’26 Azure固定汇率增速为43%，较指引中点高3.5个百分点；FQ1’27指引为45%，较当时市场一致预期约41%高4个百分点，显示新增算力上线后需求能够快速吸收。\n- **集团收入与利润质量同步改善**：季度营收900.07亿美元，同比增长18%；GAAP营业利润406.03亿美元，营业利润率45.1%，分别较市场预期高约4.0%和0.6个百分点，并非单纯以牺牲利润换增长。\n- **GitHub Copilot验证用量定价**：管理层披露GitHub Copilot收入环比增长60%以上，BNP判断其是Azure超预期的重要贡献者；按消费量收费把高频Agent任务转化为持续收入，比固定席位费更能分享Token用量增长。\n- **M365第二增长曲线开始接棒**：Copilot付费席位已超过3000万，管理层预计M365 Commercial Cloud在FY27由当前14%逐步加速至高十位数区间；Cowork等产品复制用量收费后，ARPU提升空间可能比席位数增长更重要。\n- **自由现金流指引构成隐性开支约束**：公司承诺FY27自由现金流为正，BNP估算同期经营现金流可达2200亿美元以上，因此现金资本开支在现实中存在接近该水平的天花板，削弱了市场对投入无限上修的最坏情景担忧。\n- **会计调整不等于真实削减投入**：数据中心建筑使用年限从15年延长至25年，使部分融资租赁转为经营租赁；CY26报告口径资本开支由1900亿美元降至1750亿美元，但底层投资计划未变，不能把150亿美元差额误读为降本。\n- **FY27利润率仍有韧性**：管理层指引FY27营业利润率同比下降不足1个百分点；在AI折旧和模型训练费用继续上升的情况下，这意味着核心业务增长、定价及费用纪律足以吸收大部分压力。\n- **OpenAI既是增长引擎也是集中风险**：微软首次披露OpenAI在FY26贡献241亿美元收入，BNP估算约占Azure收入23%；财年末相关应收账款达60亿美元，若OpenAI融资、回款或需求节奏变化，Azure增速和现金转换率都可能受到影响。\n- **估值结论偏积极但需跟踪现金回报**：BNP维持跑赢大市评级与549美元目标价，较报告时390.5美元股价有41%上行空间；支撑逻辑是Azure维持40%以上、M365加速且资本纪律改善，而非仅靠估值倍数扩张。\n\n## 关联\n- [微软4QFY26业绩前瞻与Copilot商业化NYC NDR反馈](entries/microsoft-4qfy26-preview-and-copilot-nyc-ndr-feedback.md) — 对照财报前市场对Azure约39.6%、Copilot席位超过2500万及单季资本开支410亿美元的预期，判断本次超预期来自哪里。\n- [MSFT FQ3’26财报速览：Azure加速与Copilot起飞](entries/MSFT-FQ3-26-财报速览-Azure加速-Copilot起飞-BNP-Paribas-HSBC-UBS综合.md) — 串联上一季度Azure增长39%、Copilot席位2000万和CY26资本开支1900亿美元的起点。\n- [MSFT跟进分析：Copilot起飞在即与Azure 40%增长可持续](entries/MSFT-跟进分析-Copilot起飞在即-Azure-40-增长可持续-BNP-Paribas-5-26.md) — 补充Azure增长持续性及Copilot商业化的先验判断。\n\n## 引用\n- [BNP Paribas：FQ4’26 First Take，终于找到增长与资本开支的平衡](res/微软/2026-07-29-MSFT.OQ-BNP Paribas-MICROSOFT (+)  FQ4’26 First Take Finally finding the growt...-123473953.pdf)\n- 报告日期：2026年7月30日；评级：Outperform；目标价：549美元；本文数字主要取自报告第1至3页。", "n176": "# 德银中国汽车欧洲本地化：福耀现有产能构成先发优势\n\n## 摘要\n\nDeutsche Bank认为，中国车企欧洲扩张仍将继续，但欧盟关税和《工业加速法案》可能迫使其从整车出口转向更深层的本地制造与供应链本地化。中国车企欧洲乘用车份额已由2020年1月的0.2%升至2026年6月的9.8%，短期可能因政策收紧在2028-2029年回落，但2030年前后随着本地化成熟，长期份额有望恢复至接近20%。在零部件企业中，德银优选敏实、耐世特、福耀玻璃和德昌电机；福耀已在德国、匈牙利和斯洛伐克建立后加工设施，且汽车玻璃目前未被拟议IAA明确列入强制欧盟原产地门槛，有望以较低新增资本开支承接中国车企欧洲增量。\n\n## 关键要点\n\n- 中国车企欧洲月销量由2020年1月的2075辆增至2026年6月的13.83万辆，合计市场份额由0.2%升至9.8%。\n- 德银预计2026年中国车企欧洲份额约12%，2028-2029年可能受IAA实施拖累，2030年前后本地化成熟后长期份额可接近20%。\n- 欧盟现行中国纯电动车额外关税为7.8%-35.3%，叠加10%标准进口税；德银预计插混车型可能自2027年起面临额外关税。\n- 关税并未阻止出口，而是改变动力结构：中国对欧汽车出口由1H24的41.98万辆增至1H26的101.47万辆，增长142%。\n- 中国对欧出口中纯电占比由4Q24的47%降至2Q26的36%，插混占比由11%升至35%，体现规避关税的产品迁移。\n- 欧洲本地化初期可能采取CKD组装、棕地工厂、合资及代工模式，但IAA将考察本地增加值，简单组装进口套件可能不再足够。\n- 整车厂四大车间资本开支中，冲压约占15%-20%、焊装30%-35%、涂装35%-40%、总装仅10%-15%，因此CKD初期资本压力较低，深度本地化则显著增加投入。\n- 企业车队约占欧盟新车需求60%，其残值、租赁经济性和售后网络是中国品牌扩大份额的关键门槛。\n- 德银优选在欧洲已有生产能力且同时服务中国车企的供应商，包括敏实、耐世特、福耀玻璃和德昌电机。\n- 福耀采用中国沿海集中生产汽车玻璃、欧洲本地后加工模式，在德国、匈牙利和斯洛伐克完成包边、附件安装、传感器集成和交付。\n- 汽车玻璃目前未被拟议IAA明确纳入强制欧盟原产地门槛，福耀可能维持现有模式，避免大规模新建完整玻璃产能。\n- 福耀已服务BYD、吉利、蔚来和理想等中国车企，现有欧洲设施可随客户本地化获得增量订单，新增资本开支相对有限。\n\n## 研判\n\n这份报告对福耀构成明确正面增量：欧洲贸易壁垒对整车厂是成本和资本开支压力，却可能把订单导向已经具备欧洲后加工能力的供应商。福耀的优势不是完全规避政策，而是汽车玻璃暂未进入强制原产地门槛、现有设施可低成本扩展。不过若IAA最终把玻璃纳入本地含量要求，或要求上游玻璃熔制也在欧洲完成，福耀仍可能面临新增资本开支、能源成本与毛利率压力，这应作为后续打脸条件跟踪。\n\n## 关联\n\n- [福耀玻璃MS 2Q26电话会：高附加值产品占比59.68%，美国二期加速爬坡](entries/福耀玻璃MS-2Q26电话会-高附加值产品占比59.68-美国二期加速爬坡.md) — 对照福耀海外产能、产品升级及扩张节奏。\n- [福耀玻璃JPMorgan 2Q26会后更新：最差已过但催化剂仍不足](entries/福耀玻璃JPMorgan-2Q26会后更新-最差已过但催化剂仍不足.md) — 对照近期需求、盈利和催化剂判断。\n- [福耀玻璃2026H1深度复盘：经营小幅超预期，汇兑与H2增速要求构成约束](entries/fuyao-glass-2026-h1-results-expectation-valuation-analysis.md) — 将欧洲本地化机会纳入半年报经营与估值框架。\n\n## 引用\n\n- [Deutsche Bank — China Autos & Auto Technology: From Made in China to Made in Europe: Painful Localization Journey Ahead](res/行业研究-汽车/2026-08-20-1810.HK-Deutsche Bank-China Autos  Auto Technology From Made in China to Made in...-123959227.pdf)\n- 报告日期：2026年8月20日；核心分析师：Bin Wang。", "n177": "# 恒瑞医药JPM：与BMS达成US$152亿全球战略联盟\n\n## 摘要\n恒瑞医药于2026年5月12日宣布与百时美施贵宝（BMS）达成全球战略合作，涵盖肿瘤、血液、免疫领域13个早期项目，潜在总价值高达US$152亿（US$6亿首付款+两笔周年前付款+US$143亿开发/注册/商业化里程碑+分层特许权使用费）。这是恒瑞史上最大BD交易，也是中国药企第二大license-out交易（仅次于2026年初阿斯利康与石药的US$185亿交易），标志着恒瑞从\"授权方\"向\"战略共创者\"的升级——相比2025年与GSK的交易（~US$120亿），此次增加了Co-Co选择权和联合早期发现机制。恒瑞A股/港股在公告日分别上涨5%/4.8%。JPM维持A股Overweight（目标价Rmb70）、H股Neutral（目标价HK$70）。交易需美国HSR反垄断审核，预计3Q26完成。\n\n## 关键要点\n\n- 交易结构：US$6亿首付款（按项目相对公允价值分摊，多期确认收入，首笔4Q26入账）+ 两笔周年前付款 + US$143亿里程碑 + 分层特许权使用费（BMS区域净销售额可达双位数百分比）\n- 恒瑞获BMS三大专有发现平台使用权（靶向蛋白降解、细胞治疗、放射配体治疗）；BMS获恒瑞13个早期管线（>5,600名研发人员、15个全球研究中心、>100个临床阶段产品）\n- 恒瑞将主导8个授权资产的早期临床开发（至PoC），利用中国庞大患者群加速概念验证；PoC数据设计为可支持全球注册试验\n- JPM认为交易验证了中国创新药企差异化药物发现能力和早期临床开发能力，预计更多类似MNC与中国biotech交易将出现\n- 美国众议院此前要求FDA不接受中国临床数据用于IND申请，但BMS发起的此次交易表明行业对该政策担忧有限\n- JPM A股目标价Rmb70（基于DCF，WACC 9.6%，终端增长率3%），当前~Rmb56对应25x PE\n\n## 关联\n- [贵州茅台2026前瞻：飞天提价与渠道改革驱动结构性增长](entries/贵州茅台2026前瞻-飞天提价与渠道改革驱动结构性增长.md) — 同为高壁垒中国龙头，恒瑞全球化BD加速是区别于其他药企的关键差异化因素", "n178": "# 日月光投控（世界先进）：中介层业务好于预期，VSMC资本支出降低加速盈亏平衡\n\n**报告来源：** Nomura（2026-05-05）\n\n## 描述\nNomura于2026年5月5日发布世界先进（Vanguard，5347 TT）研报，评级从中性上调至买入，目标价TWD178（30x 2027F P/E）。公司2Q26E指引晶圆出货量环比+11-13%，ASP环比+2-4%，毛利率31-33%。VSMC资本支出从$78亿降至$67亿，产能目标从55kwpm降至44kwpm，因客户将提供工具且更多洁净室空间用于中介层生产。预计折旧峰值在2029-30F，但降低的固定成本可实现更快盈亏平衡。上调2026-28F EPS预测8-24%。\n\n## 摘要\n世界先进（VIS）作为世界先进半导体代工厂，专注于8英寸晶圆制造（显示驱动IC和电源管理）。2Q26E展望积极：晶圆出货+11-13% QoQ，ASP +2-4% QoQ，UTR从1Q26的~80%恢复至85-90%。VSMC（12英寸合资厂）关键更新：资本支出从$78亿降至$67亿（工具由客户提供），产能目标从55kwpm降至44kwpm（中介层生产需要更多空间）。VSMC将新增中介层/本地硅互连（LSI）产能，承接台积电外包的65nm硅中介层生产。管理层预期VSMC折旧2029-30年达峰，但成本降低有望解锁更快盈亏平衡。\n\n## 关键要点\n\n- **评级上调至买入**：从Neutral上调，目标价TWD178（30x 2027F P/E）\n- **2Q26E强劲指引**：晶圆出货+11-13% QoQ，ASP +2-4% QoQ，毛利率31-33%\n- **VSMC资本支出降低**：从$78亿降至$67亿，产能目标从55kwpm降至44kwpm\n- **中介层业务好于预期**：承接台积电65nm硅中介层/LSI外包\n- **2026F EPS上调**：TWD5.76（此前TWD5.42），上调8%\n- **营收预测**：2026F TWD574亿（+18% YoY），2027F TWD711亿（+24% YoY）\n- **UTR恢复**：1Q26约80%，2Q26E恢复至85-90%\n\n## 标签\n日月光投控, 世界先进, VIS, 5347, 代工, 中介层, VSMC, analysis-dimension:财报分析, time:2026Q2\n\n## 关联\n- [三星电子：存储能见度延伸至2027年](entries/三星电子存储能见度延伸至2027年代工提前盈亏平衡.md)", "n179": "# 梅卡曼德机器人2026年港股招股书：收入三年复合增长46.6%的眼脑手组件龙头\n\n## 摘要\n梅卡曼德（雄安）机器人科技股份有限公司于2026年8月24日刊发港股正式招股书，拟按《上市规则》第18C章上市，股份代码09615，全球发售2,314.06万股H股，招股价95.30至101.70港元。公司定位为智能机器人组件供应商，以3D视觉、深度学习算法、运动规划软件和灵巧末端执行器构成标准化“眼－脑－手”产品体系，让工业及服务机器人在随机堆叠、反光、遮挡等复杂环境中完成自主识别、决策和操作。\n\n公司收入由2023年的1.81亿元增至2025年的3.89亿元，复合增长46.6%，毛利率由39.1%提升至64.6%；2026年第一季度收入1.07亿元，同比增长73.1%，毛利率64.8%。增长伴随全球化推进，海外收入由2023年的0.59亿元增至2025年的1.96亿元，复合增长82.7%，占比由32.4%升至50.3%。根据招股书引用的灼识咨询数据，公司2025年在直接经营的智能机器人“眼脑手”组件细分市场按收入计排名第一，市场份额约22.1%。\n\n盈利能力尚未转正。2025年公司账面亏损3.60亿元，剔除赎回负债变动、股份支付及上市开支后经调整亏损1.09亿元；2026Q1经调整亏损0.33亿元。经营活动现金净流出由2023年的2.74亿元改善至2025年的1.07亿元，但2026Q1因存储芯片提前备货流出0.53亿元。公司具备高毛利、高增长和海外扩张三项优势，但其商业化规模相对有限、客户集中度上升、研发及销售投入较高，尚需通过收入放量和费用效率改善证明盈利拐点。\n\n## 关键要点\n\n- **发行资料**：股份代码09615，全球发售2,314.06万股H股，招股价95.30至101.70港元；按中间价估计募资净额约21.29亿港元。\n- **产品定位**：核心产品包括Mech-Eye工业级3D相机、Mech-Vision/Mech-Viz视觉与运动规划软件、Mech-DLK深度学习平台、智能检测测量产品及灵巧末端执行器，形成标准化“眼－脑－手”组件。\n- **行业地位**：2025年在公司直接经营的细分市场按收入计排名第一，收入约3.89亿元，市场份额约22.1%；该细分市场2025年规模约18亿元，招股书预计2030年增至106亿元。\n- **收入增长**：2023—2025年收入分别为1.81亿、2.69亿和3.89亿元，复合增长46.6%；2026Q1收入1.07亿元，同比增73.1%。\n- **毛利改善**：毛利率由2023年的39.1%升至2024年的51.1%、2025年的64.6%，2026Q1维持64.8%，反映标准化软硬件组合及规模效应增强。\n- **海外扩张**：海外收入由2023年的0.59亿元增至2025年的1.96亿元，复合增长82.7%，2025年占总收入50.3%；截至最后实际可行日期已服务近50个国家和地区的900余家海外客户。\n- **规模验证**：截至招股书披露时，3D相机及AI软件累计出货超过29,000台，服务超过100家《财富》世界500强企业；截至2026Q1累计采购产品和解决方案的客户达到1,605家。\n- **持续亏损**：2023—2025年经调整亏损分别为3.34亿、2.14亿和1.09亿元，亏损持续收窄；2026Q1经调整亏损0.33亿元，尚未实现盈亏平衡。\n- **现金流风险**：经营现金净流出由2023年的2.74亿元降至2025年的1.07亿元，但2026Q1扩大至0.53亿元；期末现金及现金等价物约3.46亿元，IPO资金明显增强安全垫。\n- **研发投入**：2025年研发开支1.13亿元，占收入29.0%；2026Q1研发开支0.38亿元，占收入36.0%。截至2026Q1研发人员229名，占员工总数36.1%。\n- **客户集中度**：前五大客户收入占比由2023年的24.8%升至2025年的39.3%，最大客户占比由6.4%升至15.0%，项目型订单可能造成季度业绩波动。\n- **募资用途**：约31.8%用于产品与技术研发，25.2%用于丰富产品组合和应用场景，29.4%用于全球扩张和商业化，5.0%用于扩产提效，8.6%用于营运资金及一般用途。\n- **核心风险**：18C未盈利公司估值波动、技术快速迭代、工业客户项目周期长、系统集成商渠道依赖、客户集中、海外合规和地缘风险、持续经营现金流为负以及短期盈利不确定性。\n\n## 关联\n\n- [摩根士丹利WAIC 2026洞察：具身智能与工业AI变革](entries/Morgan-Stanley-WAIC-2026-洞察-具身智能与工业-AI-变革.md) — 提供工业具身智能从模型能力向真实场景商业化扩散的行业背景。\n- [摩根士丹利中国人形机器人投资者演示：2050年保有量10亿台、市场7.5万亿美元](entries/Morgan-Stanley中国人形机器人Investor-Presentation-2050年保有量10亿台-市场7-5万亿美元.md) — 补充长期机器人市场空间与感知、决策、执行组件的价值链位置。\n- [摩根士丹利人形机器人前沿：产业进展与商业化节奏](entries/Morgan-Stanley人形机器人前沿-即将登陆彭博终端与产业进展.md) — 用于对照机器人产业从工业场景向通用形态扩展的节奏和风险。\n\n## 引用\n\n- [梅卡曼德机器人2026年港股招股书](res/梅卡曼德机器人/2026-08-梅卡曼德机器人-港股招股书.pdf)\n- [梅卡曼德机器人投资者关系官网](https://www.mech-mind.com/investor-relations/zh-hans/)", "n180": "# 毛戈平JPM Global China Summit纪要：2026增长可见性高\n\n## 摘要\nJPMorgan在Global China Summit上与毛戈平管理层会面。2026年1Q销售同比+>20%（线下SSSG >12%，好于全年指引），4月延续良好趋势。管理层维持2026全年+30%收入增长指引和稳定利润率。核心看点：1）承诺未来6个月内不减持，缓解配售后的市场担忧；2）维持>30%分红率并准备回购；3）618预售自5月1日提前启动，占全年线上约40%。JPM给予Overweight（目标价HKD130，31x 2027E PE），认为毛戈平是中国体验式消费的稀缺标的，在高端美妆市场份额仅2%，有翻倍空间。中期目标600个专柜（vs 2025年底445个），每年净增约30个。\n\n## 关键要点\n\n- 1Q26销售+>20%，线下SSSG +>12%（好于全年+30%收入指引隐含的SSSG假设）；4月延续良好\n- 管理层明确承诺6个月内不减持，积极准备回购，>30%分红率维护股东回报\n- 618预售自5月1日提前启动，预计占据全年线上约40%份额——提前卡位是关键策略\n- 海外拓展：香港首店（2025年10月开业）后计划继续开店，潜在进入东南亚/欧洲；与L Catterton战略合作增强全球可见性\n- 中期目标600家专柜（vs 445家），客户渗透空间大：线下640万vs目标4,000万，线上1,560万vs目标3-4亿\n- 1Q新品：琉光赋活系列、皮肤衣（Perfection Radiance Primer Cream）、防晒隔离乳等\n- JPM Dec-26 PT HKD130（31x 27E P/E），当前~HKD61对应约17x 26E PE，上行空间~113%\n\n## 关联\n- [贵州茅台2026前瞻：飞天提价与渠道改革驱动结构性增长](entries/贵州茅台2026前瞻-飞天提价与渠道改革驱动结构性增长.md) — 同为消费升级+品牌驱动，毛戈平处于更早期成长阶段\n- [老铺黄金多空观点：增长放缓与品牌升级之争](entries/老铺黄金多空观点-增长放缓与品牌升级之争.md) — 同为高增长消费品牌，但毛戈平海外扩张和国际对标尚处于起步阶段", "n181": "# 汇川技术多投行综合分析\n\n## 摘要\n汇川技术2025年实现营收451亿元(+22% YoY)、归母净利50.5亿元(+18% YoY)，但1Q26业绩低于预期——营收101亿元(+13% YoY)，归母净利10.13亿元(-23% YoY)。多投行一致指出1Q26利润下滑主因NEV业务竞争加剧及产能瓶颈。Macquarie下调TP至77.80元(中性偏多)，Deutsche Bank维持买入/TP 84元，JPMorgan维持OW/TP 84元，Morgan Stanley维持OW/TP 95元(SOTP估值)，华泰证券维持买入/TP 83.99元。核心分歧在于自动化订单强势(40%订单增长)能否及时转化为收入，以及NEV业务毛利率何时触底。\n\n## 关键要点\n\n- 自动化业务订单增长约40% YoY但因产能瓶颈收入仅增14%，产能5月扩30%后2Q26有望加速确认\n- NEV动力系统营收203亿元(+26% YoY)，但价格竞争导致毛利率承压，公司正推动成本传导\n- 新兴业务(机器人/数字能源/数据中心)营收18亿元(+16%)，人形机器人零部件产能落地南京、岳阳\n- 投行对FY26 EPS预测分歧：JPM 2.25元/MS 2.25元/DB 2.10元，普遍下调7-10%\n- 华泰证券强调\"出海加速\"战略——与头部客户\"借船出海\"并完善海外本土化运营\n\n## 关联\n- [工业富联AI服务器分析](entries/工业富联AI服务器分析.md)", "n182": "# 泡泡玛特2026前瞻：Labubu退潮与平台价值之争\n\n## 摘要\n泡泡玛特在1Q26面临核心IP Labubu需求降温的挑战——3月中国线上电商+106% YoY但较2H25月均低约20%，二手市场Labubu跌破发行价（二手价Rmb73 vs 原价Rmb99），Monster×Sanrio系列仅售40%折扣。DB率先给出Sell评级（目标价HKD157），认为市场将泡泡玛特误读为能持续制造爆款的\"平台公司\"，实则Labubu是吸引客流的唯一\"钩子\"；HSBC维持Buy（目标价HKD235）但下调2026收入增长预测至14%、净利润增长至10%，认为大部分估值压缩已反映（forward PE已从20x降至11x）。国信证券则看好4月小家电新品（冷藏箱/咖啡机/吹风机等，预计2026收入贡献约1%，毛利率52.8%）作为IP势能催化剂，维持优于大市。三份报告的核心分歧在于：Labubu降温是暂时调整还是结构性拐点，泡泡玛特能否从单一爆款IP升级为多IP平台。\n\n## 关键要点\n\n- DB Sell观点：Labubu是最关键\"钩子\"，其降温将影响全店销售连带率；Labubu 3.0二手价从Rmb99跌至Rmb73，Twinkle Twinkle也开始折价交易，时尚疲劳信号明显\n- HSBC预期1Q26收入Rmb99亿（环比微降），2026E收入+14% YoY、净利润+10% YoY（vs之前+18%），当前估值11x forward PE，认为de-rating已完成大半\n- 国信证券预计2026小家电收入约4.9亿（占比约1%），毛利率52.8%，战略意义大于短期财务贡献\n- DB预计海外1Q26 YoY仍+100%（但环比-10%），HSBC预计2026海外+19%（vs 2025年+292%大幅减速）\n- 三家券商均认可IP运营能力，但DB认为产品过密反噬稀缺性，HSBC则认为中长期平台价值仍在\n- 当前股价~HKD156，DB目标价HKD157，HSBC目标价HKD235，国信2026E PE 11x\n\n## 关联\n- [老铺黄金多空观点：增长放缓与品牌升级之争](entries/老铺黄金多空观点-增长放缓与品牌升级之争.md) — 同为消费品牌面临高基数增长减速，但老铺受益金价上行结构", "n183": "# 澜起科技：AI驱动内存互联需求持续增长\n\n## 摘要\n澜起科技1Q26业绩大超预期——归母净利8.47亿元(+61% YoY/+40% QoQ)，beat UBS预期21%。营收14.61亿元(+20% YoY)，互联芯片收入14.17亿元(+24% YoY)。最大亮点是毛利率同比大幅提升9.3ppt(环比+5.3ppt)，主因产品组合优化：DDR5 Gen3/Gen4 RCD占比提升+MRCD/MDB、PCIe Retimer、CKD、CXL MXC等高毛利新品收入2.69亿元(+94% YoY)，占总互联收入19%。UBS给予买入/TP 237港元(审核中)，认为公司是AI资本开支上升周期中的关键受益者。\n\n## 关键要点\n\n- 1Q26毛利率显著改善(+9.3ppt YoY)，主因DDR5迭代及高毛利新品占比提升\n- 新品收入(MRCD/MDB/Retimer/CKD/CXL)同比+94%至2.69亿元，占比19%\n- BT基板紧张有所缓解但仍限制出货，人民币升值亦造成汇兑损失\n- AI受益逻辑：MRDIMM(AI推理)、PCIe Retimer(GPU扩展)、CXL(存算分离)三大方向\n- UBS预测FY26/27 EPS 2.58/3.75元(Consensus 2.71/4.16元)\n\n## 关联\n- [地平线机器人舱驾融合分析](entries/地平线机器人舱驾融合分析.md)\n- [工业富联AI服务器分析](entries/工业富联AI服务器分析.md)", "n184": "---\ntype: Analysis\ntitle: 申万宏源腾讯深度之三：AI时代核心受益者，超级入口与生态壁垒的再进化\ndescription: 申万宏源深度研报看好腾讯作为AI时代核心受益者，微信14亿+用户的超级入口在Agent时代具天然优势，SOTP目标价765港元(+40%)，预计25-27年收入7556/8488/9299亿\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/腾讯控股/20260313-申万宏源-腾讯控股-0700.HK-AI时代核心受益者，超级入口与生态壁垒的再进化（腾讯控股深度之三）.pdf\nsource_type: pdf\ntags: [tencent, competitive-advantage, business-model, 2026]\n---\n\n# 申万宏源腾讯深度之三：AI时代核心受益者，超级入口与生态壁垒的再进化\n\n## 摘要\n申万宏源2026年3月发布腾讯深度研报（系列之三），重点探讨腾讯AI业务进展和后续潜力。核心观点：微信14亿+用户的超级入口（社交关系链+支付+小程序生态）在AI Agent时代具天然优势；WorkBuddy等Agent产品热度领跑验证了基于高频IM入口的场景穿透力；腾讯资本开支/经营现金流比例在头部科技公司中较低，具备长跑潜力；3D模型领域布局全球领先。SOTP估值目标价765港元（+40%上行空间），维持买入。\n\n## 关键要点\n\n- 微信超14亿用户的超级入口（社交+支付+小程序）为AI Agent构筑极高护城河\n- WorkBuddy等OpenClaw类产品热度领跑，验证高频IM入口在Agent层的裂变能力\n- 腾讯资本开支/经营现金流比例在全球头部科技公司中处于低位，AI投入有持续现金流支持\n- AI组织架构深度重构：2025年大模型独立建制、引入顶尖AI人才、汇报链条上移\n- 多模态模型矩阵成型：混元系列覆盖语言/图像/视频/3D，3D模型具全球竞争力\n- AI已实质性赋能广告（智能投放）和游戏（内容生成）两大核心业务\n- Agent时代核心范式\"大模型+记忆+规划+工具调用\"，微信小程序生态提供大量API接口\n- 目标价765港元（SOTP估值），预计25-27年营收7556/8488/9299亿元\n\n## 关联\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 后续业绩验证了AI投入和核心业务增长\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — JPM同样看好AI期权价值\n\n## 引用\n- [申万宏源-腾讯控股深度之三](res/腾讯控股/20260313-申万宏源-腾讯控股-0700.HK-AI时代核心受益者，超级入口与生态壁垒的再进化（腾讯控股深度之三）.pdf)", "n185": "---\ntype: Analysis\ntitle: 福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform\ndescription: 福耀玻璃2026Q1汽车玻璃收入+6.9% YoY（量-3.7%/价+11%），海外收入+11.2% YoY，毛利率37.4%超预期，铝饰条业务亏损持续收窄预计2026年盈亏平衡，BNP目标价A股CNY80/HKD80\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/福耀玻璃/2026-04-22-600660.SS-BNP Paribas-FUYAO GLASS - H  Operation and margin remain robust; reiter...-121560357.pdf\nsource_type: pdf\ntags: [fuyao-glass, profit-trend, competitive-advantage, 2026-Q1]\n---\n\n# 福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform\n\n## 摘要\nBNP Paribas对福耀玻璃2026Q1给出\"运营和利润率保持稳健\"评价。汽车玻璃收入+6.9% YoY，可分解为量-3.7%/价+11%。分区域看，国内汽车玻璃收入+3.2% YoY，海外收入+11.2% YoY，海外增长显著。毛利率37.4%（+2.0ppt YoY/+0.3ppt QoQ），超预期。铝饰条业务（Fuyao SAM）亏损持续收窄，管理层预计2026年实现盈亏平衡。BNP维持Outperform评级，A股目标价CNY80（+33%），H股目标价HKD80（+27%），EPS预测小幅下调4%。\n\n## 关键要点\n\n- 汽车玻璃收入+6.9% YoY：量-3.7%/价+11%，ASP增长是核心驱动力\n- 国内汽车玻璃收入+3.2% YoY，海外收入+11.2% YoY（海外增速显著快于国内）\n- 毛利率37.4%（+2.0ppt YoY/+0.3ppt QoQ），超市场预期\n- 铝饰条业务（Fuyao SAM）亏损持续收窄，预计2026年盈亏平衡\n- BNP维持Outperform，A股目标价CNY80（+33%），H股目标价HKD80（+27%）\n- EPS预测下调4%（非实质性调整）\n- 估值基于DCF，关键风险：中国汽车销量超预期下滑、美国工厂爬坡延迟、能源/原材料成本上升\n\n## 关联\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — MS补充高附加值产品占比57.6%和2Q26展望\n\n## 引用\n- [BNP Paribas - Fuyao Glass 1Q26](res/福耀玻璃/2026-04-22-600660.SS-BNP Paribas-FUYAO GLASS - H  Operation and margin remain robust; reiter...-121560357.pdf)\n- [福耀玻璃BofA 1Q26：EBIT超预期10%，ASP增长11%驱动](entries/福耀玻璃BofA-1Q26-EBIT超预期10-ASP增长11-驱动.md) — 共享标签: profit-trend, 2026-Q1, fuyao-glass; 同标的: fuyao-glass; 共同关键词(17): 1q26, yoy, 2026, 耀玻\n- [福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% ive order momentum in 2Q26;...-121576213.pdf)\n- [福耀玻璃BofA 1Q26：EBIT超预期10%，ASP增长11%驱动](entries/福耀玻璃BofA-1Q26-EBIT超预期10-ASP增长11-驱动.md) — 共享标签: profit-trend, 2026-Q1, fuyao-glass; 同标的: fuyao-glass; 共同关键词(17): 1q26, 2026, 耀玻, pdf\n- [福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform](entries/福耀玻璃BNP-1Q26-运营和利润率保持稳健-重申Outperform.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(12): 1q26, 2026, 耀玻, pdf\n- [福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% YoY](entries/福耀玻璃UBS-1Q26快评-毛利率超预期-剔除汇兑利润-10-YoY.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(12): 2026, 耀玻, pdf, glass\n- [宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick](entries/宁波银行2026Q1-营收和利润重回双位数增长-Morgan-Stanley维持Top-Pick.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(6): 2026, pdf, 增长, 00", "n188": "# 福耀玻璃JPMorgan 2Q26业绩快评：销量承压但毛利率创新高\n\n## 摘要\n福耀玻璃2Q26收入基本停滞、销量延续负增长，表面净利润亦受汇兑逆风拖累，但经营底色好于利润表标题数字。季度毛利率40.2%创纪录，即使扣除美国OEM关税退税带来的1.28个百分点一次性贡献，38.9%的基础毛利率仍同比、环比改善，反映产能利用率回升与高附加值产品渗透可以对冲弱需求。剔除汇兑后税前利润同比增长1%、环比增长21%，说明核心盈利并未随中国汽车产量疲软而恶化。JPMorgan认可利润率韧性，却认为当前估值已较充分，维持港股中性和58港元目标价。\n\n## 关键要点\n- 2Q26营收115.58亿元，同比增长0.2%、环比增长11%；毛利46.42亿元，同比增长5%，显示增量利润主要来自毛利率而非销量扩张。季度净利润22.59亿元，同比下降18.6%、环比增长32%，净利率由1Q26的16.4%修复至19.5%。\n- 报告毛利率40.2%，较2Q25的38.5%提升1.7个百分点、较1Q26的37.4%提升2.8个百分点；其中美国OEM关税退税确认约1.48亿元、贡献1.28个百分点，剔除后基础毛利率38.9%，仍同比提升0.4个百分点、环比提升1.5个百分点。\n- 利润率改善并非全部依赖一次性项目。2Q26集团产能利用率约82%，高于1Q26不足80%的水平，更高的设备利用率、持续的良率及效率提升，以及高附加值玻璃占比上升，共同抵消了收入增长乏力。\n- 1H26汽车玻璃销量同比下降3.4%，反映国内汽车生产低迷；同期报告ASP同比增长7.4%，若剔除关税退款对收入确认的负面影响，真实ASP增幅为8.7%。这表明产品结构升级仍足以覆盖销量周期下行，但1Q26的11% ASP增速已明显回落。\n- 美国关税退款的会计影响一正一负：ARG售后市场此前已将额外关税全部转嫁客户，因此福耀需退回约2.34亿元并冲减收入，使集团ASP增速少1.23个百分点；OEM关税此前主要由福耀承担，退款约1.48亿元则冲减成本并抬升毛利率。\n- 1H26国内汽车玻璃收入同比增长4.8%，海外增长2.6%；海外增速偏低部分源于ARG退款冲减，而非终端竞争力骤降。美国业务1H26收入39.75亿元、同比增长3%，营业利润7.34亿元、同比增长24%，营业利润率升至18.5%。\n- 汇兑是报表净利润下滑的主要噪音。2Q26税前利润26.10亿元，同比下降21%，但剔除汇兑损益后税前利润29.74亿元，同比增长1%、环比增长21%，对应利润率25.7%，比报告税前口径更能呈现主营经营韧性。\n- 1H26销售返利率仅1.16%，与1Q26的1.17%相近，显著低于管理层全年约2%的指引；这为上半年利润率提供支持，但也意味着返利在下半年可能加速确认，不能将2Q26的毛利率峰值简单线性外推。\n- 公司宣派每股1.00元中期股息，同比增长11%，隐含派息率66%，高于1H25的49%。高分红强化现金回报属性，但并未改变JPMorgan对短期需求疲软及新增产能折旧压力的谨慎判断。\n- 估值采用2027年预测市盈率14倍，对应2027年6月港股目标价58港元，低于约16倍历史平均水平，以反映需求偏慢。报告日股价56.75港元，目标价空间仅约2%，因此利润率超预期不足以触发评级上调。\n- 中长期逻辑仍是全球汽车玻璃份额提升以及EV、ADAS带来的单车玻璃价值量增长；主要制约则是小厂竞争、扩产带来的折旧摊销、出口增值税退税削减，以及销量或定价不及预期。短期应重点观察38.9%的基础毛利率能否维持，而非40.2%的报告峰值。\n\n## 关联\n- [福耀玻璃2026年上半年官方业绩](entries/fuyao-glass-2026-h1-official-results.md) — 提供公司公告口径的收入、利润、分红及经营数据基准，可用于核对券商对汇兑与一次性关税退款的调整。\n- [福耀玻璃2Q26 HSBC业绩分析](entries/fuyao-glass-2q26-hsbc-analysis.md) — 同期另一家外资券商对2Q26毛利率、需求与估值的判断，可比较对基础盈利韧性的共识与差异。\n- [福耀玻璃JPM 1Q26：管理层看好2Q26订单动能，ASP增长可持续](entries/福耀玻璃JPM-1Q26-管理层看好2Q26订单动能-ASP增长可持续.md) — 串联JPMorgan从1Q预期到2Q兑现情况，检验订单动能与ASP增长判断。\n\n## 引用\n- [JPMorgan - Fuyao Glass - H 2Q26 in-line; GPM a record high despite sluggish industry demand](res/福耀玻璃/2026-08-18-600660.SS-JPMorgan-Fuyao Glass - H 2Q26 in-line; GPM a record high despite slug...-123917725.pdf)", "n189": "# 福耀玻璃JPMorgan 2Q26会后更新：最差已过但催化剂仍不足\n\n## 摘要\n业绩会与JPMorgan非交易路演后的核心判断是，2Q26很可能已构成国内汽车生产的周期低点，3Q客户滚动订单指向温和环比修复，但复苏力度尚不足以成为强催化。更重要的中长期驱动力来自汽车智能化：1H26高附加值产品收入占比升至59.7%，使调整后ASP仍增长8.7%，欧洲份额提升和美国二期复产则支撑海外收入占比由44%向约50%迈进。利润率方面，剔除关税退款后2Q毛利率38.9%，运营效率和产品结构改善抵消折旧、人工、运费及返利压力，管理层预计3Q基础成本环境大致稳定。尽管“最差已过”，JPMorgan仍下调盈利预测并维持A/H股中性，仅将目标价提高至60元及60港元，意味着催化剂尚未超过估值约束。\n\n## 关键要点\n- 管理层认为2Q26可能是中国汽车生产低点，客户滚动订单显示3Q26销售将环比、同比改善，但国内乘用车零售仍偏弱，复苏基调是“温和”而非强反弹；出口延续强势是公司销量表现可能优于行业的重要支撑。\n- 1H26汽车玻璃ASP为259.6元/平方米，同比增长7.4%；剔除ARG关税退款冲减收入后增长8.7%。国内ASP保持双位数增长，而欧美ASP约增长5%，海外智能化渗透率较低，留下进一步结构升级空间。\n- 高附加值产品占汽车玻璃收入59.7%，同比提升8.0个百分点，其中调光玻璃约贡献4个百分点增量。管理层预计调光玻璃未来3—5年从30万元以上车型下沉至20万元级车型，长期乘用车渗透率可能接近50%，因此ASP增长更偏结构性而非单纯周期性。\n- 1H26海外汽车玻璃收入同比增长2.6%，剔除2.34亿元ARG退款影响后增长5.1%；海外OEM收入仍保持双位数增长，主要由份额提升驱动，而售后市场受客户去库存拖累，管理层估计该影响持续约一个季度至半年。\n- 海外收入当前占集团约44%，长期目标约50%。欧洲竞争对手Saint-Gobain、NSG等逐步弱化汽车玻璃投入，已有订单向福耀转移，管理层预计欧洲未来增速高于美国；美国仍增长但节奏更温和。\n- 2Q26报告毛利率40.17%，美国OEM关税退款1.48亿元贡献1.28个百分点；剔除后38.9%，同比仍提升0.4个百分点、环比提升1.5个百分点。同比改善来自产品组合、良率和流程效率，并获纯碱及能源成本约0.39个百分点帮助。\n- 毛利率逆风同样清晰：新增产能折旧和人工成本各拖累约0.7个百分点，运费约拖累0.3个百分点，销售返利约拖累1.15个百分点。管理层预计3Q纯碱、能源价格大致稳定，运费小幅上升，基础毛利率大体稳定，但下半年返利通常高于上半年。\n- 美国业务2Q营业利润率23.9%，其中退税贡献6.47个百分点；剔除后17.5%，与2Q25的17.6%基本持平。火灾后生产转移至一期，反而提高一期利用率、效率和良率；受影响二期预计9月底基本复产，补充性的中国海运供货将逐步停止。\n- 美国二期火灾造成约1,970万美元损失，公司已收到650万美元保险赔款，并于近期再收到1,088万美元，后者预计3Q确认。复产可降低额外运费，但保险收益与产能恢复均带有阶段性，不应替代对基础美国利润率的判断。\n- FYSAM 1H26亏损217万欧元，同比收窄131万欧元，管理层仍预计2026全年实现盈亏平衡；中国铝饰条1H收入约6.10亿元、同比增长2.3%，2Q营业利润率由1Q的2.27%显著升至7.4%，协同销售开始改善盈利质量。\n- 出口退税政策影响预计有限，因为福耀多数出口是归入HS 8708的高附加值集成汽车零部件，受影响较大的HS 7007基础加工玻璃占比很小；2024年退税率由13%降至9%的影响，也已通过产品升级和向客户传导价格消化。\n- 现金配置仍积极：1H26中期派息率65.73%，与历史累计约65%接近；1H资本开支含应付票据27.7亿元，全年预算77.3亿元，当前扩产结束后常态年度资本开支预计回落至约60亿元，有利于中期自由现金流改善。\n- JPMorgan将2026/27年调整后EPS由3.65/4.18元下调至3.45/4.12元，降幅5.5%/1.4%；同时因判断行业最差阶段已过，将A/H目标价从58元/58港元上调至60元/60港元。盈利下修与估值倍数上调相互抵消，维持中性正体现“改善已被定价、缺乏额外催化”的结论。\n- 关键跟踪指标是3Q订单恢复斜率、38.9%基础毛利率能否守住、美国二期是否按期复产、欧洲订单转移速度及下半年返利率；若只有周期修复而没有盈利预测上调，股价向上空间仍受60元/60港元目标价约束。\n\n## 关联\n- [福耀玻璃2026年上半年官方业绩](entries/fuyao-glass-2026-h1-official-results.md) — 官方数据锚定1H26经营、分红和资本开支，便于区分公司事实、管理层展望与JPMorgan预测调整。\n- [福耀玻璃2Q26 HSBC业绩分析](entries/fuyao-glass-2q26-hsbc-analysis.md) — 提供同期券商对需求低点、毛利率可持续性和估值空间的独立参照。\n- [福耀玻璃JPM 1Q26：管理层看好2Q26订单动能，ASP增长可持续](entries/福耀玻璃JPM-1Q26-管理层看好2Q26订单动能-ASP增长可持续.md) — 对照此前JPMorgan对订单、ASP和海外利用率的判断，观察2Q兑现及3Q展望变化。\n\n## 引用\n- [JPMorgan - Fuyao A&H Worst behind, catalyst still elusive](res/福耀玻璃/2026-08-19-600660.SS-JPMorgan-Fuyao AH Worst behind, catalyst still elusive-123953162.pdf)", "n190": "---\ntype: Analysis\ntitle: 福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升\ndescription: 福耀玻璃2026Q1 ASP同比+11%超长期指引6-7% CAGR，高附加值产品占比57.6%(+7.6ppt YoY)，市占率持续提升（量-3.7%跑赢行业-9.3%），MS对2Q26展望偏谨慎（天然气价格+返利压力）\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/福耀玻璃/2026-04-22-600660.SS-Morgan Stanley-Fuyao Glass Industry Group 1Q26 Earnings Call Takeaways – S...-121554520.undefined.pdf\nsource_type: pdf\ntags: [fuyao-glass, profit-trend, competitive-advantage, 2026-Q1]\n---\n\n# 福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升\n\n## 摘要\nMorgan Stanley在福耀玻璃2026Q1业绩电话会后发布更新。ASP同比+11%超出长期指引6-7% CAGR，受益于国内高端车型销量增长。高附加值产品（天幕玻璃、HUD前挡、镀膜玻璃等）占比提升至57.6%（+7.6ppt YoY）。量-3.7%仍跑赢中国乘用车产量-9.3%和非中国市场-中个位数。管理层预计海外电动车加速渗透（尤其欧洲油价上涨）将进一步推动ASP上行。但对2Q26展望偏谨慎：天然气价格高企仍是压力，返利仅确认1.17ppt（可能增加）。\n\n## 关键要点\n\n- ASP同比+11%，超长期指引6-7% CAGR，受益国内高端车型销量增长\n- 高附加值产品占比57.6%（+7.6ppt YoY），价值创造型产品占比持续提升\n- 量-3.7% YoY，但跑赢中国乘用车产量-9.3%和非中国市场中个位数下滑\n- 管理层看好海外EV加速渗透（尤其欧洲油价上涨）推动ASP进一步上行\n- 2Q26展望偏谨慎：正面因素=订单恢复+美国工厂季节性盈利改善；负面因素=天然气价格高企+返利可能增加\n- 返利仅确认1.17ppt（vs 2025全年正常水平），后续季度可能增加\n- MS DCF估值：WACC 13%，中期增长率8%，终值增长率3%\n\n## 引用\n- [Morgan Stanley - Fuyao Glass 1Q26 Earnings Call Takeaways](res/福耀玻璃/2026-04-22-600660.SS-Morgan Stanley-Fuyao Glass Industry Group 1Q26 Earnings Call Takeaways – S...-121554520.undefined.pdf)\n- [福耀玻璃JPM 1Q26：管理层看好2Q26订单动能，ASP增长可持续](entries/福耀玻璃JPM-1Q26-管理层看好2Q26订单动能-ASP增长可持续.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(16): 1q26, 2026, 耀玻, pdf\n- [福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% YoY](entries/福耀玻璃UBS-1Q26快评-毛利率超预期-剔除汇兑利润-10-YoY.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(16): yoy, asp同比, 2026, 耀玻\n- [福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform](entries/福耀玻璃BNP-1Q26-运营和利润率保持稳健-重申Outperform.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(14): 1q26, yoy, 2026, 耀玻\n- [福耀玻璃BofA 1Q26：EBIT超预期10%，ASP增长11%驱动](entries/福耀玻璃BofA-1Q26-EBIT超预期10-ASP增长11-驱动.md) — 共享标签: profit-trend, 2026-Q1, fuyao-glass; 同标的: fuyao-glass; 共同关键词(17): 1q26, yoy, 2026, 耀玻\n- [宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick](entries/宁波银行2026Q1-营收和利润重回双位数增长-Morgan-Stanley维持Top-Pick.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(8): yoy, 2026, pdf, 00\n- [宁波银行UBS 1Q26快评：超预期+分红率大幅提升至27%](entries/宁波银行UBS-1Q26快评-超预期-分红率大幅提升至27.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(8): yoy, 2026, pdf, 00", "n191": "# 福耀玻璃MS 2Q26业绩快评：核心经营利润增长5%，毛利率升至40.2%\n\n## 摘要\n福耀玻璃2Q26营收115.58亿元，同比基本持平、环比增长11%，经营利润同比增长5%至28.45亿元，核心经营表现大致符合市场预期。受3.64亿元汇兑损失拖累，净利润同比下降19%至22.59亿元，但这主要是非经营性因素，与2Q25的3.66亿元汇兑收益形成约7.30亿元负向摆动。更值得关注的是毛利率升至40.2%，同比增加1.7个百分点、环比增加2.8个百分点并创2021年以来季度新高，表明高毛利产品组合与可能的美国关税回收已盖过天然气、海运和俄亥俄电价上涨。Morgan Stanley维持H股“等权”评级及53.50港元目标价，短期判断的关键转向高毛利率能否在2H26延续，而非表观净利润的同比降幅。\n\n## 关键要点\n- **收入增长仍受行业产量约束**：2Q26收入115.58亿元，同比基本持平，1H26收入219.71亿元、同比增长2%；二季度缺乏明显收入增长，反映汽车产量疲弱仍压制销量，但环比11%的恢复说明订单与季节性有所改善。\n- **主营盈利强于表观净利**：2Q26经营利润28.45亿元，同比增长5%、环比增长31%，经营利润率24.6%，同比提升1.0个百分点、环比提升3.7个百分点；这比净利润指标更能反映当季经营质量。\n- **汇兑造成显著基数扭曲**：当季汇兑损失3.64亿元，而2Q25为汇兑收益3.66亿元，前后形成约7.30亿元负向变化，导致净利润同比下降19%至22.59亿元、净利率同比下降4.5个百分点至19.5%；不能据此推断主营业务恶化。\n- **毛利率创五年季度高位**：2Q26毛利46.42亿元，同比增长5%、环比增长19%；毛利率40.2%，同比提升1.7个百分点、环比提升2.8个百分点，是2021年以来最高季度水平，也是本期最重要的正面信号。\n- **结构升级体现定价与技术壁垒**：在天然气价格、海运费及美国俄亥俄州电价同比上升的环境下，毛利率仍显著扩张，Morgan Stanley认为主要原因包括高毛利产品组合改善；这说明智能化、高附加值玻璃渗透正在把技术与客户认证优势转化为利润率。\n- **关税回收可能提供额外贡献**：报告提出，美国关税成本向客户回收可能也是毛利率改善原因，逻辑与同期耐世特业绩中的关税补偿相似；若后续电话会确认，其意义在于福耀对客户具备较强议价能力，但需要区分一次性追溯补偿与可持续提价。\n- **半年经营利润保持增长**：1H26经营利润50.24亿元，同比增长6%，经营利润率22.9%、同比提升0.7个百分点；同期净利润39.70亿元、同比下降17%，再次显示汇率而非经营效率是半年利润同比下滑的主要矛盾。\n- **后续验证聚焦三项变量**：Morgan Stanley关注2H26利润率趋势、3Q26销量/ASP/返利，以及美国工厂火灾损失与3Q保险赔付；其中返利确认节奏和保险回收会影响季度利润，而产品组合、成本转嫁能力决定中期盈利中枢。\n- **估值立场保持克制**：Morgan Stanley给予H股等权评级、目标价53.50港元，相对2026年8月18日收盘价56.75港元隐含约6%下行；其预测2026-28年EPS为3.78/4.53/5.23元，对应报告口径市盈率12.9/10.8/9.3倍。\n- **核心判断**：2Q26并非“利润衰退”，而是“汇兑掩盖经营改善”；若40%左右毛利率能在成本压力与销量偏弱时保持，福耀的产品升级、海外议价和成本控制优势将得到更强验证，反之则需警惕关税回收等阶段性项目抬高单季利润率。\n\n## 关联\n- [福耀玻璃2026年上半年官方业绩](entries/fuyao-glass-2026-h1-official-results.md) — 提供公司公告口径的半年财务基准，可用于核验本研报对汇兑、收入与利润的拆分。\n- [福耀玻璃2Q26业绩前瞻与基本面底部复苏判研](entries/fuyao-glass-2q26-hsbc-ubs-preview-analysis.md) — 对照财报前市场关于毛利率、汇兑压力和下半年恢复的预期，识别实际结果的预期差。\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — 串联1Q产品结构、ASP与2Q毛利率兑现情况，观察竞争优势向利润的传导。\n\n## 引用\n- [Morgan Stanley - 2Q26 Core Earnings in Line, GPM in the Spotlight](res/福耀玻璃/2026-08-18-600660.SS-Morgan Stanley-Fuyao Glass Industry Group 2Q26 Core Earnings in Line, GPM ...-123913062.pdf)", "n192": "# 福耀玻璃MS 2Q26电话会：高附加值产品占比59.68%，美国二期加速爬坡\n\n## 摘要\nMorgan Stanley在业绩会及非交易路演后确认，福耀1H26高附加值产品占汽车玻璃收入59.68%，同比提高8.03个百分点，其中智能/可调光玻璃贡献3.87个百分点，产品结构升级仍是ASP和毛利率的主要驱动力。汽车玻璃ASP同比增长7.4%，若剔除从收入中扣减的关税影响则增长8.7%，但海外售后玻璃去库存使销量同比下降3.4%，拖慢2Q海外收入增速，券商判断该压力偏暂时。美国工厂火灾造成1966万美元损失，2Q已获650万美元赔付，3Q预计再获1088万美元；与此同时美国二期工厂利用率预计从2Q的0%升至3Q的20%-30%、4Q的50%。研报维持H股“等权”评级与53.50港元目标价，显示经营中长期逻辑改善与短期估值上行空间有限并存。\n\n## 关键要点\n- **高附加值产品继续快速渗透**：1H26高附加值产品收入占汽车玻璃收入59.68%，同比提升8.03个百分点；近六成收入已来自增值型产品，说明福耀不再只是跟随汽车产量增长，而是通过单车玻璃价值量提升获得结构性增长。\n- **智能玻璃是结构升级核心增量**：智能/可调光玻璃单项贡献高附加值产品占比增幅中的3.87个百分点，约占8.03个百分点总提升的近一半；全球汽车智能化提升有望延续天幕、调光、HUD等产品需求，并巩固福耀的技术认证和规模制造壁垒。\n- **ASP表现超过表面数据**：1H26汽车玻璃ASP同比增长7.4%，若剔除被从收入中扣减的关税影响则增长8.7%；后者更接近真实产品组合与定价变化，说明智能化升级带来的价值增量仍可覆盖部分行业销量压力。\n- **销量下滑来自阶段性渠道调整**：1H26汽车玻璃销量同比下降3.4%，主要因2Q海外售后市场去库存，并使海外收入增长放缓；Morgan Stanley将其视为暂时逆风，而非海外份额趋势逆转，并预计公司仍将继续获取海外市场份额。\n- **关税会计处理影响收入解读**：关税回收从收入中扣减，使披露ASP增速低于剔除关税后的8.7%；分析后续季度时应同时观察报表ASP与可比经营ASP，避免把关税转嫁的会计呈现误判为产品定价能力减弱。\n- **火灾损失大部分有望被保险覆盖**：美国工厂火灾造成1966万美元损失，2Q已收到650万美元保险赔偿，管理层预计3Q再收到1088万美元，累计预期赔付1738万美元，约覆盖已披露损失的88%；3Q赔付将带来利润时点上的正面影响。\n- **美国二期进入快速爬坡窗口**：第二座美国工厂利用率预计由2Q的0%提升至3Q的20%-30%，并在4Q达到50%；这会带来收入与本地供货能力改善，但爬坡初期固定成本吸收不足，利用率提升速度将决定其对利润率的净贡献。\n- **海外竞争优势仍需销量验证**：去库存消退后，海外售后订单是否恢复、美国二期是否按计划爬坡，是判断“暂时逆风”是否成立的两项硬指标；若销量恢复同时ASP保持中高个位数增长，海外份额提升与产品升级将形成双轮驱动。\n- **估值尚未反映明显安全边际**：Morgan Stanley维持H股等权评级和53.50港元目标价，相比2026年8月19日58.30港元收盘价约有8%下行；预测2026-28年EPS为3.78/4.53/5.23元，对应报告口径市盈率13.2/11.1/9.6倍。\n- **核心判断**：电话会强化了“结构升级可持续、销量逆风暂时、美国供给扩张提速”的经营框架，但3Q保险收益与4Q产能爬坡会令季度利润含有明显非线性；真正决定长期竞争力的是59.68%的高附加值占比能否继续提升，以及海外去库存后份额增量能否兑现。\n\n## 关联\n- [福耀玻璃2026年上半年官方业绩](entries/fuyao-glass-2026-h1-official-results.md) — 提供销量、产品结构及利润的官方财报锚点，用于区分经营趋势与研报解读。\n- [福耀玻璃2Q26业绩前瞻与海外份额扩张展望](entries/fuyao-glass-2q26-preview-and-global-market-share.md) — 对照财报前对欧美份额、美国扩产和ASP增长的判断，检验电话会后的兑现程度。\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — 延续Morgan Stanley对ASP、高附加值产品及海外市占率的季度跟踪链条。\n\n## 引用\n- [Morgan Stanley - 2Q26 Earnings and NDR Call Takeaways](res/福耀玻璃/2026-08-19-600660.SS-Morgan Stanley-Fuyao Glass Industry Group 2Q26 Earnings and NDR Call Takea...-123949357.pdf)", "n193": "---\ntype: Analysis\ntitle: 福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% YoY\ndescription: 福耀玻璃2026Q1营收104.13亿(+5.1% YoY)，毛利率37.4%(+2ppt YoY)超预期，ASP同比+11%，剔除汇兑损益后税前利润+10% YoY，纯碱降价约18%贡献显著\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/福耀玻璃/2026-04-21-600660.SS-UBS Equities-First Read Fuyao Glass _Positive Q126 earnings growth again...-121530995.pdf\nsource_type: pdf\ntags: [fuyao-glass, profit-trend, competitive-advantage, 2026-Q1]\n---\n\n# 福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% YoY\n\n## 摘要\n福耀玻璃2026Q1营收104.13亿元（+5.1% YoY），在中国乘用车产量-10% YoY、美国汽车销量-6% YoY的挑战下仍实现正增长。核心驱动力：ASP同比+11%（高附加值产品占比提升）和市占率持续提升。毛利率37.4%（+2ppt YoY/+0.3ppt QoQ），大幅超预期，受益于纯碱价格同比降约18%、高附加值产品占比提升、美国工厂产能爬坡。净利润15.71亿元（-15.7% YoY），但剔除汇兑损益（Q1损失4.4亿 vs 2025Q1收益2.4亿）后税前利润+10% YoY。UBS维持Buy评级，H股目标价HK$62.85，A股目标价CNY80。\n\n## 关键要点\n\n- 营收104.13亿元（+5.1% YoY），远超中国乘用车产量-10%的行业背景\n- 毛利率37.4%（+2ppt YoY/+0.3ppt QoQ），超市场预期\n- 毛利率提升四因素：纯碱降价约18%、高附加值产品占比提升、美国工厂产能爬坡、管道天然气价格受政府管控\n- ASP同比+11%，受益天幕玻璃/HUD等高附加值产品渗透率提升\n- 净利润15.71亿（-15.7% YoY），但剔除汇兑后税前利润+10% YoY\n- 汇兑损益逆转：2025Q1收益2.4亿→2026Q1损失4.4亿，是利润下滑的核心干扰项\n- UBS目标价：A股CNY80（+48%上行），H股HK$62.85（+52.5%回报率）\n\n## 关联\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — MS补充高附加值产品占比57.6%和2Q26展望\n\n## 引用\n- [UBS - Fuyao Glass Q126 First Read](res/福耀玻璃/2026-04-21-600660.SS-UBS Equities-First Read Fuyao Glass _Positive Q126 earnings growth again...-121530995.pdf)\n- [福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform](entries/福耀玻璃BNP-1Q26-运营和利润率保持稳健-重申Outperform.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(15): yoy, 2026, 耀玻, 毛利率37\n- [福耀玻璃BofA 1Q26：EBIT超预期10%，ASP增长11%驱动](entries/福耀玻璃BofA-1Q26-EBIT超预期10-ASP增长11-驱动.md) — 共享标签: profit-trend, 2026-Q1, fuyao-glass; 同标的: fuyao-glass; 共同关键词(17): yoy, 2026, 耀玻, pdf\n- [福耀玻璃JPM 1Q26：管理层看好2Q26订单动能，ASP增长可持续](entries/福耀玻璃JPM-1Q26-管理层看好2Q26订单动能-ASP增长可持续.md) — 共享标签: profit-trend, competitive-advantage, 2026-Q1; 同标的: fuyao-glass; 共同关键词(12): 2026, 耀玻, pdf, glass\n- [宁波银行UBS 1Q26快评：超预期+分红率大幅提升至27%](entries/宁波银行UBS-1Q26快评-超预期-分红率大幅提升至27.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(17): ubs, first, yoy, 2026\n- [宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick](entries/宁波银行2026Q1-营收和利润重回双位数增长-Morgan-Stanley维持Top-Pick.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(7): yoy, 2026, pdf, 利润", "n194": "# 美光FQ3:26业绩预览：LTA与Agentic AI成为重估关键\n\n**报告来源：** UBS Equities（2026-06-08）\n\n## 描述\nUBS于2026年6月8日发布美光FQ3:26（5月）业绩预览报告。预计存储定价持续走强，公司指引将超预期，重点关注LTA（长期协议）和Agentic AI对存储需求的重塑。模型FY26/27E营收$1,166亿/$2,433亿，EPS $63.74/$151.27。重申买入评级，目标价$1,625（~15x NTM P/E applied to C2029E EPS $125）。\n\n## 摘要\nUBS认为美光FQ3:26（5月）业绩有望超预期，主要受存储定价持续走强推动。关键看点在于LTA——预计行业30%的DDR成交量将以略低于当前价格的水平锁定，形成盈利底部支撑。Agentic AI是存储需求新变量：单次智能体查询可产生4-5个并发Agent，每个执行独立CPU任务并持续与GPU/ASIC加速器交互，带来DRAM容量、HBM带宽和SSD存储的乘数级增长。HBM作为\"智能层\"，当前每GPU的KV缓存约10-100GB。美光预计在1-delta节点采用最新EUV工具。UBS模型显示C2026-2029E EPS均超过$100。\n\n## 关键要点\n\n- **FQ3:26预览**：预计营收$360亿/EPS $20.96，远超公司指引\n- **LTA结构变化**：预计30%行业DDR成交量锁定在略低于现价的水平，稳定盈利基础\n- **Agentic AI驱动**：KV缓存增长成为系统级瓶颈，HBM需求乘数级增长\n- **HBM仍是关键**：作为\"智能层\"直接贴近加速器，当前每GPU KV缓存10-100GB\n- **盈利预测**：FY26E EPS $63.74（营收$1,166亿），FY27E EPS $151.27（营收$2,433亿）\n- **目标价$1,625**：基于~15x NTM P/E，EPS CAGR强劲\n- **评级买入**：认为市场终将为美光结构性变化赋予更高估值\n\n## 标签\n美光, MU, 存储器, DRAM, HBM, AgenticAI, LTA, analysis-dimension:业绩预览, time:2026Q2\n\n## 关联\n- [Nova NDR要点](entries/Nova-NDR要点.md)", "n195": "# 美国银行台积电资本拨款加速与美国厂盈利改善\n\n## 摘要\n台积电董事会最新批准约290亿美元资本拨款，使2026年前三季累计拨款同比增长99%，结构也由厂房与洁净室准备逐步转向先进前端、先进封装及特殊制程的实质扩产。美国银行据此判断，2026年资本支出可达公司指引中位数约620亿美元；若拨款增速持续高于长期趋势，2027年资本支出可能进一步升至800亿至850亿美元，高于该行原估780亿美元及市场预期750亿美元。与此同时，亚利桑那厂二季度营收增至450亿新台币，环比增长17%、同比增长145%，剔除政府补贴后净利率约38%，说明利用率、定价及执行力已显著缓冲海外生产成本。研报维持买入评级与3100新台币目标价，核心结论是人工智能算力需求足以支撑激进扩产，同时将集团毛利率维持在接近高六成水平。\n\n## 关键要点\n- **拨款领先指标再加速**：2026年前三季董事会批准资本拨款约290亿美元，同比增加99%；拨款通常领先实际设备采购与产能开出，因而是判断2027年供给扩张更有效的前瞻指标，而非单季费用波动。\n- **扩产进入设备与产能形成阶段**：过去十二个月房地产、厂务及洁净室仅占拨款约35%，低于2024至2025年平均47%；资金配比转向先进前端，并温和增加先进后端封装与特殊制程，意味着建设重心正从基础设施转到可生产资产。\n- **资本支出上行情景明确**：美国银行预计2026年资本支出约620亿美元；若资本拨款维持同比40%至45%的高增速，2027年实际资本支出可达800亿至850亿美元，而报告中的基准预测与市场预期分别约780亿和750亿美元。\n- **需求并非单押图形处理器**：产能测算同时覆盖图形处理器、专用集成电路、x86与ARM服务器处理器、网络交换芯片及高端移动芯片，人工智能基础设施与既有移动需求共同提高先进制程利用率的可见度。\n- **折旧上升但毛利率仍有韧性**：大规模投资预计推动2026至2028年折旧以约20%的复合年增长率上升，但高性能计算需求和技术领先带来的价值定价，可使集团毛利率保持在高六成区间，折旧并不必然转化为同幅度利润率下滑。\n- **美国厂经营改善具有验证意义**：亚利桑那厂二季度营收约450亿新台币，占集团营收4%，环比增长17%、同比增长145%；剔除补贴后净利率约38%，较2025年约负90%的水平发生根本逆转，虽仍低于集团约50%的净利率，但稀释幅度已可控。\n- **盈利增长覆盖投资强度**：美国银行预测2026至2028年调整后净利润分别为2.86万亿、3.97万亿和4.72万亿新台币，对应每股收益110.20、153.17和181.96新台币；2027年营收和盈利复合增速分别约33%与40%，自由现金流仍随资本支出增加而扩张。\n- **估值尚未计入全部上行情景**：以报告股价2380新台币计，股票约为2027年预测市盈率17倍，处于长期11至21倍区间中部；3100新台币目标价采用20倍2027年市盈率，投资逻辑依赖人工智能需求兑现及海外厂持续改善，而非估值倍数突破历史上沿。\n- **主要观察变量可量化**：后续应跟踪董事会拨款增速是否保持40%以上、先进前端与封装占比、亚利桑那厂利用率及剔除补贴利润率；若拨款回落或美国厂利润率重新恶化，800亿至850亿美元资本支出与高六成毛利率假设均需下修。\n\n## 关联\n- [台积电先进节点需求强劲与二〇二六至二〇二七年资本支出展望](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 对照2026年5月美国银行对310亿美元拨款、美国厂首季盈利和2027年750亿美元资本支出的较早判断，可观察预期连续上修。\n- [台积电二〇二六年二季度业绩点评与资本支出展望](entries/台积电BNP-2Q26业绩点评与资本支出展望.md) — 法巴从三年累计2400亿美元资本支出、先进制程和先进封装产能角度提供交叉验证，并提示设备涨价与折旧压力。\n- [台积电二〇二六年二季度业绩与展望综合分析](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 汇总多家机构对营收、毛利率和资本支出的共识与分歧，为本报告的上行情景提供基准参照。\n\n## 引用\n- [美国银行全球研究：台积电资本拨款加速以支持需求，美国厂爬坡进展良好](res/台积电/2026-08-18-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. Capital appropriatio...-123903884.pdf)", "n196": "# 老铺黄金多空观点：增长放缓与品牌升级之争\n\n## 摘要\n老铺黄金2025年营收273亿（+221% YoY），2026年面临高基数和金价波动的双重挑战。UBS（Buy, PT HKD930）情景分析显示2026E营收/净利润增长55%/67%（基准情形），线上渠道占比提升至20%（VS 2025低teens）可推升净利率。JPMorgan（Overweight, PT HKD1,296）上海渠道调研显示节日期间仍需排队10-30分钟、转化率>70%、新客占比约50%，需求韧性强劲，且短期增发可能性低。然而Macquarie（Underperform, PT HKD453）认为中国消费力难以支撑频繁涨价（2025年经历4轮），预计2027E净利润-40%，且高端店效已超国际奢侈品牌，运营杠杆风险下行。MS战术建议同样看多。当前股价~HKD588，估值从极端分化（UBS 11x vs Macquarie 10x 2027E PE）反映市场极度不确定性。\n\n## 关键要点\n\n- UBS基准情形：2026E收入/净利润+55%/+67%，线上占比提升至20%带来净利率结构性改善（线上NPM比线下高L-MSD）\n- UBS北京门店渠道调研：3-4月SSSG -20~30%，因高基数+金价回调+代购库存未消化；VIC客群好于中产\n- JPM上海调研：节日期间需求韧性，30单/小时，新品Rose Window系列缺货；5g金条赠品门槛从50万降至25万维护客情\n- Macquarie看空观点：2025年经历4轮涨价，消费力承压；店效超国际奢侈品牌（Rmb6-7亿/年），增长空间有限；2027E净利润-40% (-39.5%)\n- Macquarie预警：运营费用率仅14%（国际奢侈品牌>40%），若收入增速放缓，经营杠杆将显著恶化\n- 潜在催化剂：海外扩张（东南亚/日韩/欧洲）、SKU创新（镶钻纯金/珐琅）\n\n## 关联\n- [泡泡玛特多空观点：增长放缓与平台价值之争](entries/泡泡玛特多空观点-增长放缓与平台价值之争.md) — 同为高增长消费品牌面临增速拐点分歧，但有更强海外确定性", "n197": "---\ntype: Analysis\ntitle: 腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%\ndescription: 腾讯2026Q1营收1965亿(+9%)，Non-IFRS净利679亿(+11%)，游戏/广告/金融科技全面增长，Hy3 AI模型发布并成为OpenRouter最受欢迎模型，WorkBuddy成中国最广用AI智能体\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/腾讯控股/2026-05-13-腾讯控股-0700.HK-截至2026年3月31日止三个月业绩公布.pdf\nsource_type: pdf\ntags: [tencent, profit-trend, valuation, 2026-Q1]\n---\n\n# 腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%\n\n## 摘要\n腾讯2026Q1营收1965亿（+9% YoY），毛利1113亿（+11% YoY），Non-IFRS净利679亿（+11% YoY），全面超市场预期。游戏业务多款长青游戏流水创新高（王者荣耀/和平精英/三角洲行动），广告收入+20% YoY，金融科技+9% YoY。AI领域取得突破：Hy3 preview模型发布后在OpenRouter token消耗量稳居前列，WorkBuddy成为中国最受欢迎的AI智能体服务。视频号用户时长+20% YoY。微信小店交易额快速增长。\n\n## 关键要点\n\n- 营收1965亿（+9% YoY），毛利1113亿（+11% YoY），毛利率56.6%（+1ppt YoY）\n- Non-IFRS经营利润756亿（+9% YoY），Non-IFRS净利679亿（+11% YoY）\n- 增值服务961亿（+4%）：国内游戏454亿（+6%），国际游戏188亿（+13%）\n- 广告收入382亿（+20% YoY），受益视频号广告和腾讯营销AIM+智能投放\n- 金融科技及企业服务599亿（+9% YoY），商业支付金额增速环比提升\n- 微信MAU 14.32亿（+2% YoY），视频号用户时长+20% YoY\n- Hy3 preview模型发布（4月28日），推理/Agent/代码能力在同等参数规模中表现最佳\n- WorkBuddy以DAU计成为中国最受欢迎的效率AI智能体\n- Non-IFRS摊薄EPS 7.364元（+12% YoY），IFRS摊薄EPS 6.302元（+23% YoY）\n\n## 关联\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — JPM的深度分析，目标价690港元\n- [腾讯控股UBS 1Q26：符合预期，低估值的期权价值](entries/腾讯控股UBS-1Q26-符合预期-低估值的期权价值.md) — UBS认为当前估值低估了AI期权的价值\n\n## 引用\n- [腾讯控股-截至2026年3月31日止三个月业绩公布](res/腾讯控股/2026-05-13-腾讯控股-0700.HK-截至2026年3月31日止三个月业绩公布.pdf)", "n198": "---\ntype: Analysis\ntitle: 腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧\ndescription: JPMorgan在腾讯2026Q1后转向更积极，管理层首次披露双P&L：Non-IFRS OP ex-AI为844亿(+17%) vs 含AI的756亿(+9%)，将AI稀释从叙事担忧转化为可审计数据，目标价690港元\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/腾讯控股/2026-05-13-0700.HK-JPMorgan-Tencent (0700) First Take 1Q26 - two PLs under one ticker-122024510.pdf\nsource_type: pdf\ntags: [tencent, profit-trend, valuation, 2026-Q1]\n---\n\n# 腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧\n\n## 摘要\nJPMorgan在腾讯2026Q1业绩后发布深度分析，核心亮点是管理层首次正式披露\"双P&L\"：Non-IFRS经营利润扣除新AI产品后为844亿（+17% YoY），而含AI投入为756亿（+9% YoY）。这实质上将\"AI稀释盈利\"的熊方叙事从无法证实的担忧转化为有数据支撑的可审慎指标。广告收入+20%超预期，国内游戏+6%稳健。JPM维持Overweight，目标价690港元。另一份详细报告《Compounding core, bounded AI, trough multiple》进一步阐述核心业务持续增长、AI投入可控、估值处于历史低位的三重逻辑。\n\n## 关键要点\n\n- 管理层首次披露双P&L：ex-AI的Non-IFRS OP 844亿（+17%）vs 含AI的756亿（+9%），AI投入约88亿/季\n- 营收1965亿略低于JPM预期（-4%），但经营利润673.8亿超JPM预期（+5%）\n- 广告收入382亿（+20% YoY），超出预期（+1% vs JPMe）\n- 国内游戏454亿（+6% YoY），低于预期（-4%），但多款长青游戏流水创新高\n- 国际游戏188亿（+13% YoY），低于预期（-13%），预计后续季度加速\n- 金融科技599亿（+9% YoY），符合预期\n- 目标价690港元（基于SOTP），核心业务估值合理+AI期权价值\n- JPM认为腾讯估值处于历史低位（约13x Forward PE），下行风险有限\n\n## 关联\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 官方业绩数据\n- [腾讯控股UBS 1Q26：符合预期，低估值的期权价值](entries/腾讯控股UBS-1Q26-符合预期-低估值的期权价值.md) — UBS同样看好当前低估值\n\n## 引用\n- [JPMorgan - Tencent 1Q26 First Take](res/腾讯控股/2026-05-13-0700.HK-JPMorgan-Tencent (0700) First Take 1Q26 - two PLs under one ticker-122024510.pdf)\n- [JPMorgan - Tencent Compounding core](res/腾讯控股/2026-05-13-0700.HK-JPMorgan-Tencent (0700) Compounding core, bounded AI, trough multiple-122031596.pdf)\n- [华泰证券腾讯1Q26前瞻：AI布局和云业务迎来拐点，维持买入](entries/华泰证券腾讯1Q26前瞻-AI布局和云业务迎来拐点-维持买入.md) — 共享标签: tencent, 2026-Q1, profit-trend; 同标的: tencent; 共同关键词(8): q2, ai, pdf, 1q", "n199": "---\ntype: Analysis\ntitle: 腾讯控股UBS 1Q26：符合预期，低估值的期权价值\ndescription: UBS认为腾讯2026Q1业绩符合预期，核心业务盈利能力稳健(+17% ex-AI)，当前约13x Forward PE处于历史低位，AI期权价值未充分定价，目标价516港元\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/腾讯控股/2026-05-14-0700.HK-UBS Equities-First Read Tencent Holdings _1Q26 inline; undervalue option...-122029104.pdf\nsource_type: pdf\ntags: [tencent, valuation, profit-trend, 2026-Q1]\n---\n\n# 腾讯控股UBS 1Q26：符合预期，低估值的期权价值\n\n## 摘要\nUBS对腾讯2026Q1给出\"符合预期\"评价。非IFRS经营利润756亿（+9% YoY/环比+10%），略高于UBS预期750亿。分业务看，广告+20% YoY超预期，金融科技+9%符合预期，游戏国内+6%/国际+13%略低于预期。UBS认为当前核心业务估值约13x Forward PE处于历史低位，AI带来的增量价值未充分反映在股价中。维持Buy评级，目标价516港元（基于SOTP估值）。\n\n## 关键要点\n\n- Non-IFRS OP 756亿（+9% YoY/+10% QoQ），略超UBS预期750亿\n- 广告382亿（+20% YoY）为最大超预期亮点，视频号广告持续放量\n- 国内游戏454亿（+6% YoY）符合预期，王者荣耀/和平精英流水创新高\n- 国际游戏188亿（+13% YoY）低于预期，但Supercell表现强劲\n- 目标价516港元（基于SOTP），当前股价约460港元有约12%上行空间\n- 核心业务估值13x Forward PE，低于5年均值约18x\n- 腾讯AI投资（Hy3模型、WorkBuddy）尚未贡献显著收入，但提供期权价值\n- 视频号广告加载率仍远低于行业水平，长期变现空间大\n\n## 关联\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 官方业绩数据\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — JPM更乐观的目标价690港元\n\n## 引用\n- [UBS - Tencent 1Q26 First Read](res/腾讯控股/2026-05-14-0700.HK-UBS Equities-First Read Tencent Holdings _1Q26 inline; undervalue option...-122029104.pdf)\n- [宁波银行UBS 1Q26快评：超预期+分红率大幅提升至27%](entries/宁波银行UBS-1Q26快评-超预期-分红率大幅提升至27.md) — 共享标签: profit-trend, valuation, 2026-Q1; 共同关键词(14): read, ub, 2026, 1q26"}, "types": ["Analysis", "Article", "Note", "Reference", "Synthesis"], "palette": {"Article": "#3b82f6", "Analysis": "#8b5cf6", "Synthesis": "#ec4899", "Reference": "#10b981", "Note": "#94a3b8"}, "stats": {"total_nodes": 200, "total_edges": 498, "orphans": 2}};
</script>
<script>
(function(){
const B=window.BUNDLE;
document.title='知识图谱 — '+B.nodes.length+' 节点';

// Type chips
const p=B.palette||{};
B.types.forEach(t=>{
  const c=p[t]||'#94a3b8',ch=document.createElement('span');
  ch.className='chip';ch.textContent=t;ch.style.setProperty('--c',c);
  ch.addEventListener('click',()=>{
    const active=ch.classList.toggle('active');
    B.types.forEach(t2=>document.querySelectorAll('#type-chips .chip:not([data-all])')
      .forEach(c2=>{if(c2!==ch)c2.classList.remove('active')}));
    document.querySelector('#type-chips [data-all]').classList.toggle('active',!active);
    cy.nodes().forEach(n=>n.toggleClass('dim',active&&n.data('type')!==t));
    cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));
  });
  document.getElementById('type-chips').appendChild(ch);
});
document.querySelector('#type-chips [data-all]').addEventListener('click',()=>{
  document.querySelectorAll('#type-chips .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#type-chips [data-all]').classList.add('active');
  cy.elements().removeClass('dim');
});

// Legend
const legend=document.getElementById('legend');
B.types.forEach(t=>{
  const c=p[t]||'#94a3b8',item=document.createElement('span'),dot=document.createElement('span');
  item.className='legend-item';dot.className='stats-dot';dot.style.background=c;
  item.appendChild(dot);item.appendChild(document.createTextNode(t));legend.appendChild(item);
});

// Indices
const nodeIdx={};B.nodes.forEach(n=>nodeIdx[n.data.id]=n.data);
const backlinks={};B.edges.forEach(e=>{(backlinks[e.data.target]||=[]).push(e.data.source)});

// Cytoscape
const cy=cytoscape({
  container:document.getElementById('graph'),
  elements:[...B.nodes,...B.edges],
  style:[
    {selector:'node',style:{
      'background-color':'data(color)','label':'data(label)','color':'#0f172a',
      'font-size':9.5,'text-valign':'bottom','text-margin-y':3,'text-wrap':'wrap','text-max-width':100,
      'width':'data(size)','height':'data(size)','border-width':1,'border-color':'data(color)',
      opacity:.92,'transition-property':'opacity','transition-duration':150
    }},
    {selector:'node:selected',style:{'border-width':3,'border-color':'#f59e0b'}},
    {selector:'edge',style:{width:1.5,'line-color':'#cbd5e1','target-arrow-color':'#cbd5e1','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.8}},
    {selector:'.dim',style:{opacity:.08}},
    {selector:'.hidden',style:{display:'none'}}
  ],
  layout:{name:'cose',animate:false,padding:30},
  wheelSensitivity:.2
});

cy.on('tap','node',evt=>showDetail(evt.target.id()));
cy.on('tap',evt=>{if(evt.target===cy)clearSelection()});

// Search
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){cy.elements().removeClass('dim');return}
  cy.nodes().forEach(n=>{
    const d=n.data();
    const hay=(d.label||'').toLowerCase()+' '+d.id+' '+(d.tags||[]).join(' ').toLowerCase();
    n.toggleClass('dim',!hay.includes(q));
  });
  cy.edges().forEach(e=>e.toggleClass('dim',e.source().hasClass('dim')||e.target().hasClass('dim')));
});

// Layout
document.getElementById('layout').addEventListener('change',e=>{
  const name=e.target.value,opts={name,animate:false,padding:30};
  if(name==='grid')opts.rows=Math.ceil(Math.sqrt(cy.nodes(':visible').length||1));
  cy.layout(opts).run();
});
document.getElementById('reset').addEventListener('click',()=>{cy.fit(null,30);clearSelection()});

// Detail panel
function clearSelection(){
  cy.elements().unselect();
  document.getElementById('detail-empty').hidden=false;
  document.getElementById('detail-content').hidden=true;
}

function showDetail(nid){
  const d=nodeIdx[nid];if(!d)return;
  cy.elements().unselect();
  const n=cy.getElementById(nid);if(n)n.select();
  document.getElementById('detail-empty').hidden=true;
  const content=document.getElementById('detail-content');content.hidden=false;

  const badge=document.getElementById('detail-type');
  badge.textContent=d.type;badge.style.background=d.color;

  document.getElementById('detail-title').textContent=d.label;
  document.getElementById('detail-description').textContent=d.description||'—';

  const resEl=document.getElementById('detail-resource');resEl.innerHTML='';
  const resource=d.resource||'';
  if(/^https?:\/\//.test(resource)){
    const a=document.createElement('a');a.href=resource;a.target='_blank';a.rel='noopener';
    a.textContent=resource.length>80?resource.slice(0,77)+'...':resource;resEl.appendChild(a);
  }else{resEl.textContent=resource||'—';}

  const tagsEl=document.getElementById('detail-tags');tagsEl.replaceChildren();
  if(d.tags?.length){d.tags.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;tagsEl.appendChild(s)})}
  else{tagsEl.textContent='—';}

  // Detail body: render markdown from bundle bodies
  const body=B.bodies[nid]||'';
  const bodyEl=document.getElementById('detail-body');
  bodyEl.innerHTML=body?renderMD(body):'<p class="muted">无正文内容</p>';

  // Backlinks
  const bl=backlinks[nid]||[];
  const blEl=document.getElementById('backlinks-list');blEl.innerHTML='';
  const blSec=document.getElementById('detail-backlinks');
  if(bl.length){blSec.hidden=false;bl.forEach(s=>{
    const li=document.createElement('li'),a=document.createElement('a');
    a.textContent=nodeIdx[s]?.data?.label||s;a.addEventListener('click',()=>showDetail(s));
    li.appendChild(a);blEl.appendChild(li);
  })}else{blSec.hidden=true;}

  cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),1.0)},{duration:200});
}

// Simple markdown renderer
function renderMD(t){
  if(!t)return'';
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>'<pre><code>'+code.trim()+'</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // 不把不可信 Markdown URL 写入 HTML 属性，避免 javascript:/引号注入。
  h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<span>$1 ($2)</span>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<span>$1 ($2)</span>');
  h=h.replace(/^---$/gm,'<hr>');
  h=h.replace(/^[\*\-] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/\n\n+/g,'</p><p>');
  h='<p>'+h+'</p>';
  return h.replace(/<p>\s*<\/p>/g,'');
}

// Auto-init
const initial=B.nodes[0];
if(initial)showDetail(initial.data.id);
})();
</script>
