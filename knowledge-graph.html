至今+6.4%；新城发展拟发行20亿元私募REIT扩募\n\n## 关联\n\n- [JPMorgan中国房地产5月数据：一线城市房价初现企稳迹象](JPMorgan中国房地产5月数据-一线城市房价初现企稳迹象.md) — 同为Karl Chan团队5月NBS数据分析，提供月度宏观背景，与周度高频数据形成时间维度互补\n- [JPMorgan全球房地产日报-中国地产新闻与研究摘要](JPMorgan全球房地产日报-中国地产新闻与研究摘要.md) — 同属JPMorgan房地产研究体系，涵盖每日新闻与事件催化，与周度数据监控形成频率互补\n\n## 引用\n\n- JPMorgan Property Data Monitor, 24 June 2026. Karl Chan, Alvin Au et al.", "n111": "# 麦格理中国自动化与工业研究：EU路演反馈与AIDC机遇\n\n## 摘要\n麦格理在2026年7月发布的中国自动化与工业报告中总结了其欧洲（EU）路演反馈。在AI数据中心（AIDC）用电及高效率重载设备的强劲需求推动下，欧洲长线投资者对中国工业和工控标的兴趣显著上升。在麦格理覆盖的中国工业企业中，潍柴动力是最受外资青睐的核心资产。投资者对汇川技术、恒立液压和三花智控等人形机器人与自动化供应链的商业化前景表示乐观，但对传统基建与低毛利组装业务保持谨慎。\n\n## 关键要点\n\n- AI数据中心（AIDC）已成为欧洲机构配置中国工业股的核心叙事，潍柴动力为外资持有量最大的工业股。\n- 欧洲投资者对汇川技术和气立可（AirTAC）保持较高持仓，而汉钟精机虽持仓量低但目前高居外资咨询与研究意向首位。\n- 麦格理重申其工业装备偏好Pecking Order：潍柴动力 > 鼎力机械 > 三一重工 > 气立可 > 恒立液压。\n- 投资者普遍关注地缘政治摩擦与供应链出海（如墨西哥工厂）对毛利率的稀释作用，对中大型重型卡车出口和LNG重卡渗透率持乐观共识。\n\n## 关联\n- [Morgan Stanley中国工业中报展望：资本支出强劲与机器人商业化](entries/ms-china-industrials-mid-year-outlook-2026-07.md) — 交叉印证了 Morgan Stanley 对 2026 年工程机械以及人形机器人核心部件（绿的谐波、双环传动）的出货与资本支出预测。\n-  — 东方电气的自研 F 级燃气轮机出海与 AI 调峰用电需求，与麦格理报告中 AIDC 工业能源用电叙事完全契合。\n\n## 引用\n- [Macquarie Research - China automation & industrials (07 July 2026)](res/行业研究-工业自动化/2026-07-07-Macquarie-Research-China-automation-industrials.pdf)", "n112": "# 麦格理东方电气1Q26业绩快评与评级下调分析\n\n## 摘要\n麦格理发布报告将东方电气（1072.HK/600875.SS）评级下调至“差于大市”（Underperform），H股目标价下调10%至17.13港元。1Q26东方电气实现营收175亿元（+5.6% YoY），净利润+37% YoY至16亿元，但这主要由公允价值变动损益贡献，实际扣非净利润仅为12亿元（+11.5% YoY）。虽然毛利率微增0.4个百分点至18.3%，但这掩盖了其核心订单走弱的事实。截至2025年底，在手订单额同比下滑8%至1403亿元，订单对营收覆盖率从2.19x下降至1.78x。在“十五五”煤电从“基荷”转向“调峰”的宏观背景下，主营煤电装备的东方电气中线能见度被显著削弱。\n\n## 关键要点\n\n- **扣非利润温和**：1Q26列报利润+37%掩盖了主业真实增长，剔除投资公允价值变动后的核心扣非利润同比增速为较温和的 +11.5% YoY。\n- **订单储备与覆盖双降**：2025年在手订单额收缩8%至1403亿元，导致营收覆盖倍数降至 1.78x，核心积压订单动能出现转折点。\n- **海外市场开拓质量瑕疵**：尽管2025年海外订单达140亿元，并在哈萨克斯坦斩获3台50MW的G50自主燃机合同，但渠道调研显示其主要由中资项目业主低价倾斜竞得，尚未构成独立的海外商业化突破。\n- **煤电政策逆风压制能见度**：未来煤炭火电定位发生转变，导致麦格理将东方电气2026E/2027E/2028E净利润预测分别大幅调低了 12%/28%/41%，认为其近年在燃气轮机和储能的布局不足以对冲火电需求滑坡。\n\n## 关联\n- [建银国际燃气轮机行业深度与东方电气、应流股份覆盖（2026年6月）](entries/ccbi-advanced-manufacturing-gas-turbines-upcycle-202606.md) —— 构成显著的牛熊观点分歧：建银国际（CCBI）强调了东方电气自主G50燃机在电力设备大周期的出口红利（“优于大市”），而麦格理则聚焦于其在手煤电大订单降温及海外低价竞争的风险（“差于大市”）。\n- [东方电气港股持仓情况](entries/macquarie-dec-1q26-performance-downgrade.md) —— 东方电气（01072.HK）是用户于2026-07-13刚买入的试探性仓位（目前占比1.8%），本业绩警示条目与当前持仓深度穿透，具有高优先级的决策参考价值。\n\n## 引用\n- [Macquarie - Dongfang Electric: One-off support masks order weakness](res/东方电气/2026-04-30-600875.SS-Macquarie Research-One‑off support masks order weakness-121717458.pdf)", "n113": "# 微软4QFY26业绩前瞻与Copilot商业化NYC NDR反馈\n\n## 摘要\n微软在纽约NDR（路演）反馈中显示，Copilot已取代Azure成为投资者最关心的核心议题。受新产品能力提升及销售推广效能释放影响，FQ4 Copilot席位有望远超此前2500万的指引目标，且定价模式正在从纯席位制向“席位+消耗量”混合模式演进。业绩方面，预计4QFY26总营收同比+16.8%（至893亿美元），优于公司此前指引上限；Azure在GPU短缺导致算力溢价的背景下，预计录得39.6%的强劲同比增速。但由于推理算力投资强劲，Q4单季Capex预计飙升至410亿美元。HSBC认为虽然大规模基础设施扩张拖累了近期自由现金流表现，但FCF将在2027年见底，此后ROIC将稳步修复。HSBC下调目标价至567美元（原571美元），BNP Paribas维持555美元目标价，重申Outperform。\n\n## 关键要点\n\n- **营收与Azure增速**：4QFY26总营收预计增长16.8%至893.1亿美元（高于官方872.5亿指引）。其中Azure增长39.6% YoY，核心驱动为GPU供应瓶颈下的算力溢价。SpaceX将闲置GPU高价租给Anthropic/Google侧面印证了算力供求的紧张。\n- **Copilot 爆发拐点**：纽约NDR反馈显示，Copilot因功能迭代速度加快（如Agent Mode/Copilot Cowork应用）和标杆大单落地（如英国国民医疗服务体系NHS 50万席位采购），正加速向企业级深水区渗透。\n- **算力资产周转率**：由于GPU和先进制程算力占比提升，Azure资产周转率（年化营收/资产原值，含租约）从FY22的42-43%稀释至当前的37%，长期来看或降至33-34%。\n- **FCF见底与Capex峰值**：4QFY26单季度Capex预计大幅提升至410亿美元（3QFY26为319亿）。HSBC预计巨额折旧将导致微软自由现金流（FCF）在2027年探底。\n- **定价模式重塑**：从单纯收取订阅年费（per seat）的静态模式，向基础订阅费+超额消耗量（consumption-based）的混合模式转化，有助于企业客户根据自身推理任务规模优化Token投入。\n\n## 关联\n- [MSFT NDR反馈：Copilot成核心议题，FQ4席位或远超2500万 (BNP Paribas 6/11)](entries/MSFT-NDR反馈-Copilot成核心议题-FQ4席位或远超2500万-BNP-Paribas-6-11.md) — 对应BNP Paribas在NDR会后对Copilot付费席位爆发和用量定价模式演变的反馈。\n- [MSFT FQ3'26 深度分析：Capex飙升、Azure加速与定价模式转型 (UBS)](entries/MSFT-FQ3-26-深度分析-Capex飙升-Azure加速与定价模式转型-UBS.md) — 对应三季度业绩中Capex飙升和Azure加速的背景数据。\n- [MSFT NDR前瞻10问：Copilot进展、GPU定价权与AI基础设施融资 (BNP Paribas 6/9)](entries/MSFT-NDR前瞻10问-Copilot进展-GPU定价权与AI基础设施融资-BNP-Paribas-6-9.md) — NDR前夕投资者对大额Capex对现金流挤压、GPU定价权的十大核心关切。", "n114": "# 微软FY2026官方年报\n\n## 摘要\n微软FY2026实现营收3318.39亿美元，同比增长17.8%，营业利润1552.37亿美元增长20.8%，利润增长继续快于收入。GAAP净利润1337.49亿美元增长31.3%，其中包含OpenAI投资及其他非经营项目影响；剔除OpenAI影响后的Non-GAAP净利润为1287.86亿美元，增长22%。经营现金流增长至1829.35亿美元，但AI数据中心和算力资本开支大幅增加，使自由现金流降至669.87亿美元、FCF/净利润约50%，资本回报成为下一财年的核心验证变量。\n\n## 关键要点\n\n1. **全年增长**：FY2026营收3318.39亿美元（+17.8%），营业利润1552.37亿美元（+20.8%），GAAP净利润1337.49亿美元（+31.3%）。\n2. **调整后盈利**：剔除OpenAI投资影响后，Non-GAAP净利润1287.86亿美元（+22%），调整后摊薄EPS 17.28美元（+22%）。\n3. **FQ4表现**：季度营收900.07亿美元（+18%），营业利润406.03亿美元（+18%），GAAP EPS 4.81美元（+32%）。\n4. **云与AI**：FQ4微软云收入593亿美元（+27%），Azure及其他云服务收入增长43%，Azure全年收入首次超过1000亿美元。\n5. **Copilot变现**：Microsoft 365 Copilot付费席位超过3000万，证明应用层AI收入开始形成规模，但席位活跃度与续约率仍需继续验证。\n6. **合同储备**：商业剩余履约义务约6780亿美元，同比增长84%，提供较强收入可见度，同时需关注大模型客户集中度。\n7. **现金流与CapEx**：FY2026经营现金流1829.35亿美元，资本开支1159.48亿美元，自由现金流669.87亿美元，FCF/净利润约50.1%。\n8. **资本强度风险**：AI基础设施回报取决于Azure需求、定价、利用率和AI采用速度；若客户延迟或迁移工作负载，长期折旧及租赁义务可能压制回报。\n9. **股东回报**：FQ4通过股息和回购向股东返还102亿美元；高CapEx周期下，资本配置需平衡AI投资与股东回报。\n\n## 关联\n\n- [微软FQ4 2026汇丰财报后分析](entries/MSFT-FQ4-26-HSBC-双引擎AI变现与回报率.md) — 用官方年报核验Azure、Copilot、CapEx和云资本回报假设。\n- [微软FQ4 2026 BNP财报后分析](entries/MSFT-FQ4-26-BNP-全栈AI变现与资本纪律.md) — 对照AI全栈变现及FY27自由现金流纪律。\n- [微软FQ4 2026 UBS财报后分析](entries/微软FQ4-26财报后分析-Azure上修与利润率韧性-UBS.md) — 补充Azure预测上修、利润率和估值判断。\n\n## 引用\n\n- [Microsoft FY2026 Form 10-K filed with the SEC](res/微软/microsoft-fy2026-sec-10k.pdf)", "n115": "# Momenta港股不同投票权控制上市招股书分析\n\n**类别**: 主板上市招股说明书 | **公司**: MOMENTA GLOBAL LIMITED | **联席保荐人**: 中金公司、高盛\n\n## 摘要\nMomenta成立于2016年，是全球领先的自动驾驶软件解决方案提供商。公司依托“一个飞轮，两条腿”策略，实现量产乘用车智驾方案（L2级城市/高速NOA）与完全自动驾驶（L4级Robotaxi）业务的协同演进。针对城市NOA搭载车辆销量计，Momenta在全球独立智能驾驶解决方案提供商中排名第一，市场份额高达64.5%。\n\n## 关键要点\n\n- **财务高增长与净亏损**：2023-2025年公司收入分别为7.43亿、13.25亿及24.13亿元人民币；毛利由1.30亿飙升至17.27亿元，但由于前期巨额的研发和销售投入，年内亏损分别为25.7亿、32.1亿和34.6亿元（经调整年内亏损分别为10.9亿、9.59亿和3.03亿元）。\n- **量产落地规模**：截至2025年12月31日，累计获得170款车型定点（已量产68款），智能驾驶装车辆超68万辆（城市NOA安装量超65万辆），合作车企24家，覆盖奔驰、丰田、上汽、广汽等全球头部厂商。\n- **技术壁垒**：全球首家于2025年将基于强化学习的模型投入量产的独立智驾方案商，具备端到端深度学习算法量产及大数据闭环迭代能力。\n- **上市开支与募资**：预计募资净额约56.15亿港元，60%用于加强核心技术研发与推进下一代智能驾驶算法及闭环自动化平台。\n\n## 关联\n- [地平线机器人舱驾融合分析](entries/地平线机器人舱驾融合分析.md) —— 同为中国智驾芯片及软件头部企业，对比其在量产乘用车SOP与算法迭代上的技术护城河。\n- **智能驾驶** —— 自动驾驶是Momenta的核心赛道。\n- **招股书** —— 港股IPO招股书系列。", "n116": "# Morgan Stanley中国金融体系去杠杆与正向循环研判\n\n## 摘要\nMorgan Stanley在2026年7月发布的中国金融业投资者演示报告中指出，中国正通过主动退出阶段性刺激政策来促进金融体系的高质量发展。尽管短期内对消费和社融总量造成了情绪压制，但长期来看有助于防范系统性风险。报告显示，中国高风险金融资产从2017年的62万亿元（占总额的30.2%）降至2025年的21万亿元（占比4.9%），预计到2027年底将进一步降至15万亿元（占比3%左右）。随着人民币存贷款新规对非理性揽存的清理，大中型银行负债成本正大幅降低，预计净息差（NIM）将在2026年企稳，2027年迎来回升反弹，金融系统迈向“高质量增长与合理信贷配置”的良性循环。\n\n## 关键要点\n\n- **退出刺激政策的必要性**：10年金融清理整顿成效显著，高风险金融资产占总资产比重大幅降至4.9%（2025年数据），未来去杠杆将聚焦于增速显著超家庭收入的消费贷以及名义经营贷的置换。\n- **信贷回归市场化定价**：社融增速在6%左右是最可持续和理想的中期速度，随着2026年普惠小微量化增速目标的取消，信贷资源错配与内卷式杀价得到实质性纠正。\n- **NIM净息差改善路径**：得益于存款管理新规落地，严厉取缔手工补息和高息揽存，银行负债端红利正快速释放，推动大中型银行NIM在2026年探底企稳，并于2027年进入反弹上升期。\n- **配置与选股策略**：强推具有独立市占率和分红率双升弹性的宁波银行（Top Pick，2026Q1营收/净利重回双位数增长）。对于防范资本注入摊薄稀释的红利需求，优先配置CCB-H和BOC-H（2026E股息率在5.8%-6.1%）。\n\n## 关联\n- [Morgan Stanley中国金融业高质量发展与存款新规影响](entries/Morgan-Stanley中国金融业高质量发展与存款新规影响.md) —— 同主题：MS前期针对存款利率管理办法新规对银行负债端影响的专题讨论。\n- [建银国际燃气轮机行业深度与东方电气、应流股份覆盖（2026年6月）](entries/ccbi-advanced-manufacturing-gas-turbines-upcycle-202606.md) —— 同样探讨了AI驱动（AIDC算力电力消耗）对实体工业升级以及配套基础设施行业（如电力设备、电力网及上游半导体）利润的结构性刺激。\n\n## 引用\n- [Morgan Stanley - China Financials: Further de-leveraging or positive development loop? How to invest?](res/行业研究-金融/2026-07-10-Morgan Stanley-Investor Presentation China Financials Further de-leveragi...-123078904.undefined.pdf)", "n117": "# Morgan Stanley全球云资本开支追踪：2027年共识升至1.2万亿美元仍偏保守\n\n## 摘要\nMorgan Stanley认为，四大美国超大规模云厂商在2026年二季度业绩季集体释放更强的资本开支信号，推动2027年全球云资本开支共识由同比增长14%跃升至29%，对应约1.2万亿美元。尽管投入强度已接近历史高位，但AI及传统云需求仍高于可用算力，Azure、GCP与AWS收入又在供给受限下同步加速，说明新增容量可被快速消化。MS自下而上估算2027年现金资本开支约1.4万亿美元、较共识高17%，因此判断当前预测仍偏保守，云基础设施供应链的订单与盈利能见度有望继续延长。\n\n## 关键要点\n\n- 2027年全球云资本开支共识约1.2万亿美元、同比+29%，较业绩季前预测高约1700亿美元；MS估算约1.4万亿美元，比共识高17%。\n- 2026至2027年合计云资本开支预测已由年初约1.3万亿美元升至2.1万亿美元，增加约8000亿美元；两年支出相当于同期收入的33%，约为2014至2023年平均投入强度的4倍。\n- 四大厂商2026年投入分别为：Alphabet 1950至2050亿美元、Amazon约2200亿美元、Meta 1300至1450亿美元、Microsoft底层投入约1900亿美元；微软因租赁会计重分类报告值约1750亿美元。\n- 云收入在供给约束下仍加速：Azure同比+43%，GCP同比+82%，AWS同比+37%并创18个季度最快增速，验证利用率提升、AI服务和传统云消费共同拉动变现。\n- 共识隐含2027年非AI云资本开支仅同比+7%，而MS判断过于保守；云资本开支覆盖的前14大厂商预测已至少连续10个季度上调。\n- 投资回报可见度改善：Amazon称多数AI容量采用多年合同且服务器投资不到3年可回本；积压订单、定价权、自研芯片和效率提升也支撑各厂商继续扩张。\n\n## 研判\n资本开支高增并非单纯的GPU采购脉冲，而是外部云客户、内部AI负载与传统云迁移共同形成的供需缺口。短期主要风险是资本强度接近35%后自由现金流承压，但经营现金流、债务与股权融资、经营租赁和第三方容量可缓冲资金压力。对供应链应优先关注云资本开支收入敞口高、订单能见度延长且具定价权的服务器、光模块、存储、网络及先进制程公司，而非仅按低估值追逐周期弹性。\n\n## 关联\n- [微软4Q/FY26财报前瞻：Azure增长强劲，Capex预期上修，M365商业云加速](entries/msft-4qfy26-azure-capex-m365-ubs-update.md) — 微软FY27资本开支预测升至2610亿美元，补充单一厂商投入与变现检验。\n- [Meta 1Q26业绩超预期但资本开支大幅上调，多空观点激烈交锋](entries/Meta-1Q26-Results-Capex-BofA-DB-JPM-20260430.md) — Meta高投入导致自由现金流转负，体现资本周期的核心风险。\n- [Google 1Q26云业务超预期爆发，Cloud backlog达4620亿美元](entries/Google-1Q26-Cloud-Backlog-BofA-DB-HSBC-20260430.md) — GCP收入与积压订单验证AI基础设施需求及回报可见度。\n\n## 引用\n- [Morgan Stanley - Global Cloud Capex Tracker: Spending Acceleration Continues](res/行业研究-科技硬件/2026-08-03-Morgan Stanley-US Technology Global Cloud Capex Tracker Spending Accelera...-123578596.pdf)", "n118": "# 摩根士丹利中国工业中报展望：资本支出强劲与机器人商业化起航\n\n## 摘要\n摩根士丹利在2026年7月发布的《中国工业中报展望》（China Industrials Mid-year Outlook）中，系统性评估了中国工业、工控、工程机械以及先进制造板块的投资机遇。报告预测，受制造业出海和资本支出（Capex）复苏的提振，2026年中国工业自动化市场将同比增长5%（较1Q26的1%显著修复）。人形机器人商业化将在2026年迎来“元年”，MS预测全球人形机器人出货量在2026年将达到5万台，至2030年规模将达到44.6万台（出货量CAGR达106%）。工程机械方面，受益于折旧置换周期，将2026年挖掘机销量预测上调至 +21%。双环传动、恒力液压、绿的谐波被列为人形机器人硬件供应链核心首选池。\n\n## 关键要点\n\n- 中国先进制造 Capex 呈现“更强韧、更广泛”的复苏，自动化及工业机器人市场由 1Q26 的 1% 极速回升，预计 2026 全年同比增长 5%，工业机器人出货量增长 18% 达到 110 亿美元市场空间。\n- 人形机器人核心软硬件进入实质性规模出货：2026 年预计出货 5 万台，2030 年增长至 44.6 万台，对应 150 亿美元硬件市场。\n- 投资首选组合（Overweight）及人形零部件链主要标的：\n  - 绿的谐波 (688017.SS)：谐波减速器龙头，目标价 631 元（当前 454 元），2026E PE 402x，成长预期高。\n  - 双环传动 (002472.SZ)：电驱高精度齿轮及 RV 减速器，目标价 50 元（当前 46.8 元），2026E PE 27.5x，具备极高估值性价比。\n  - 恒力液压 (601100.SS)：行星滚柱丝杠与线性关节，目标价 133 元（当前 117.5 元），2026E PE 48.3x，为工业出海与丝杠国产替代代表。\n- 报告将挖掘机 2026 年销量增速由 +15% 上调至 +21%，重卡销量上调至 127 万辆（+11% YoY），主要由置换周期与天然气（LNG）重卡低成本替代（渗透率达 28%）驱动。\n\n## 关联\n- [双环传动QARP分析](entries/shuanghuan-driveline-qarp-analysis-2026-07.md) — 50元目标价与超配评级为动态PEG和机器人业务拆分提供量化锚点。\n- [恒立液压QARP分析](entries/hengli-hydraulic-qarp-analysis-2026-07.md) — 丝杠与先进制造逻辑需结合静态PE约50倍的估值纪律交叉判断。\n\n## 引用\n- [Morgan Stanley - China Industrials Mid-year Outlook: Selective Stock Picks (06 July 2026)](res/行业研究-工业自动化/2026-07-06-Morgan-Stanley-China-Industrials-Mid-year-Outlook.pdf)", "n119": "# 摩根士丹利中国房地产周度监测：新房成交同比反弹，去化率显著改善\n\n**来源**: 行业研究-房地产 | **机构**: Morgan Stanley | **分析师**: Stephen Cheung, CFA / Cara Zhu | **日期**: 2026-07-06\n\n## 摘要\n\n摩根士丹利于2026年7月6日发布中国房地产周度高频数据监测报告（第27期）。截至7月5日当周，国内新房及二手房成交均出现同比反弹。50城周度新房网签量同比转正至+22%（前值-11%），将年初至今累计跌幅收窄至-11% YoY。其中，二线城市销量同比增29%领涨，三线增22%，一线降幅收窄至-6%。10城二手房成交同比回升至+4%（前值-1%），YTD累计维持+5% YoY。本周推盘总去化率显著改善至68%（前值53%），其中一线城市去化率达90%（前值58%），表明政策后核心城市需求端企稳。中原六城二手房业主降价比例小幅回落至16.7%（前值17.0%），一线中介景气指数升至54.7（前值51.6），维持行业“同步”（In-Line）评级。\n\n## 关键要点\n\n\n- **新房注册销量（50城）**：单周销量同比上升22%（前值-11%），使得YTD累计同比为-11%。分能级来看，一线城市同比-6%（前值-19%），二线城市同比+29%（前值-13%），三线城市同比+22%（前值+10%）。\n- **二手房注册销量（10城）**：单周销量同比上升4%（前值-1%），YTD累计为+5% YoY。其中，一线城市同比+14%（前值持平），二线城市同比-3%（前值-0.4%）。\n- **推盘去化率**：整体去化率跃升至68%（上一周为53%）。其中一线城市录得90%的高去化率（前值58%），二线城市回升至68%（前值53%）。\n- **先行指标与情绪**：中原六城二手房挂牌降价指数为16.7%（前值17.0%，反映降价范围略有收窄）；一线城市中介人指数升至54.7（前值51.6），市场信心小幅回暖。\n- **个股评级与首选**：覆盖14家开发商。首选超配（Overweight）企业包括：建发国际（1908.HK，TP暂缺）、华润置地（1109.HK）、新城发展（1030.HK）与新城控股（601155.SS）以及越秀地产（0123.HK）。\n\n## 关联\n\n- [JPMorgan中国地产周度数据监控：端午假期扰动致销售转弱，一线城市挂牌量持续下降支撑房价企稳](jpm-china-property-weekly-data-2026-06.md) — 同样是6月下旬高频数据监控，反映了前一周端午节假期对销售同比造成的暂时性扰动，本报告中7月首周新房销售同比的暴涨（+22%）证实了上周基数扭曲的判断。\n- [JPM中国地产股：近期股价下跌归因与一线城市企稳下的择机买入逻辑](jpm-china-property-share-price-weakness-2026-06.md) — 讨论了前几周因为高频数据短暂回落导致的板块获利回吐，而本周摩根士丹利的去化率与新房销售反弹，为一线及二线城市的阶段性企稳提供了进一步的数据支撑。\n- [JPMorgan中国房地产5月数据：一线城市房价初现企稳迹象](JPMorgan中国房地产5月数据-一线城市房价初现企稳迹象.md) — 提供了此前月度维度的政策效果与一线城市止跌企稳的宏观脉络，与本周度报告中一线城市90%的超高推盘去化率相印证。\n\n## 引用\n\n- Morgan Stanley China Property Weekly Database Tracker #27, July 6, 2026. Stephen Cheung, Cara Zhu.\n- 数据来源：CREIS、中原地产、摩根士丹利研究部。", "n120": "# 大摩GenAI ROIC深度框架：开源权重模型普及下云巨头如何维持20-40%高资本回报率\n\n## 摘要\nMorgan Stanley发布北美互联网与AI基础设施专题深度研报，系统回应市场对于开源权重模型（Open-Weight Models，如DeepSeek-V4、Meta Muse等）激增是否会压低Token价格并摧毁超大规模云巨头（Hyperscalers，如Amazon、Google、Meta、Microsoft）投资回报率（ROIC）的担忧。大摩基于1GW自有算力数据中心（配备约41万颗GB300芯片）的细颗粒度单元经济学模型测算显示：即便混合Token价格降至1.00-1.75美元/百万Tokens且GPU租赁价格下探至7-8.5美元/小时，凭借推理吞吐量提升（2,000-3,500 tokens/s/GPU）与规模化利用率（75%），超大规模云厂商依然能产生23%-39%的健康ROIC。算力资产本身的物理稀缺性、自研定制芯片（Custom Silicon）的低服务成本优势以及开源模型对核心云存储、数据库（RAG）、安全网络服务的强Attach带动效应，构成了云巨头穿越价格战的长期壁垒。\n\n## 关键要点\n- **开源权重模型的颠覆与扩散效应**：开源模型（用户拥有权重、可私有化微调部署）以低成本大幅拉低企业落地门槛，但也对闭源模型API形成直接价格挤压。大摩强调，模型层正步入“Android生态”逻辑——单Token价格下降不可避免，但换来的是全社会调用体积（Volume）呈指数级爆发，核心盈利考核应转向EBIT绝对利润额（Dollar Growth）而非单纯毛利率百分比。\n- **1GW GB300数据中心ROIC量化测算**：\n  - 资产配置：1GW电力容量对应约410,256颗GB300芯片，单卡年可用机时约36亿GPU小时；\n  - 基础测算：在75%综合利用率、GPU租赁单价8.5美元/小时基准下，单GW年营收达229亿美元；\n  - 成本构成：IT设备年折旧约50亿美元、非IT基建折旧10亿美元、电力与运营维护Opex约20亿美元，单GW总Opex为76亿美元；\n  - 回报率：实现税前EBIT 153亿美元（EBIT率67%），扣除21%税率后税后净营业利润（NOPAT）达121亿美元，对应总Capex的投资资本回报率（ROIC）高达31%（波动区间23%-39%）。\n- **模型API层吞吐量与单位经济学博弈**：对于模型提供商（Labs），在基准Token单价1.75美元/M、吞吐量2,750 tokens/s/GPU（基于DeepSeek-V4 1.6T等前沿架构基准）下，65%容量用于推理即可在单GW产生400亿美元营收与90亿美元NOPAT，实现20%-60%的模型级ROIC，突显架构吞吐效率（如Google Gemini Flash系列）与前沿能力同等关键。\n- **云巨头多元化变现与“引流品”逻辑（Attach Mechanism）**：Serverless API token收入在开源模型时代可能演变为低毛利的“引流品”（如同超市里的平价牛奶），但开源负载深度拉动企业将专有数据上云：1）专用GPU实例租赁；2）连接私有知识库的RAG管道（极大增加云端存储和向量数据库开销）；3）合规、身份与安全监控套件，从而提升全栈客户终身价值（LTV）。\n- **标的推荐与风险收益不对称性**：大摩重申对Amazon（目标价335美元，25x '27/'28E EPS）和Alphabet（GOOGL）的超配评级（Overweight），主因二者拥有最完整的自研芯片生态（Trainium/Inferentia/TPU）与最低的算力交付成本；Meta（目标价775美元，23x '27/'28E EPS）则受益于Muse开源生态扩展和核心广告ROI持续改善。\n\n## 关联\n- [Morgan Stanley全球云Capex追踪：2026-28基础设施投资全景](entries/morgan-stanley-global-cloud-capex-tracker-2026-08.md) — 本报告从单GW单元经济学与ROIC角度为大摩全球Capex跟踪提供了底层测算支柱。\n- [微软MSFT：AI基础设施深度系列之Token优化周期来临](entries/MSFT-AI基础设施深度系列-OpenAI与Anthropic效应-Token优化周期来临-BNP-Paribas-6-2.md) — 法巴关于Token优化周期与推理成本下降的研判与大摩开源模型吞吐量模型形成深度对照。\n- [Google 1Q26云订单积压与Agentic AI资本开支](entries/Google-1Q26-Cloud-Backlog-BofA-DB-HSBC-20260430.md) — 验证超大规模云厂商在积压订单支撑下的算力变现韧性。\n\n## 引用\n- [Morgan Stanley - Internet: How Could Open-Weight Models Impact GenAI ROIC?](res/行业研究-互联网/2026-08-12-Morgan Stanley-Internet How Could Open-Weight Models Impact GenAI ROIC-123797326.pdf)", "n121": "# 大摩北美互联网估值周报：AI动能积聚下的估值折价，SBC现金化对EV/EBITDA真实倍数重估\n\n## 摘要\nMorgan Stanley发布北美互联网行业最新估值跟踪报告《Where Are We Trading Now: AI Momentum Building?》。全周互联网板块上涨5%（标普500/纳指分别+4%/+5%），其中META（+6%）、ABNB（+18%）、CART（+12%）领涨，GOOGL（-1%）与APP（-12%）承压。从估值分位数来看，三大巨头AMZN、GOOGL、META分别交易于20倍、17倍、19倍2026年预期EPS，较各自TTM历史估值中枢折价达33%、34%、20%，整体行业NTM EV/EBITDA（13.1倍）较5年/10年均值（13.8x/14.9x）折价5%-12%。大摩特别引入“将股权激励（SBC）视为现金支出”的真实估值测算框架，指出SBC现金化后数字媒体与电商板块EV/EBITDA平均提升30%-36%，但在AI商业化动能持续积聚与扎实自由现金流支撑下，维持北美互联网板块“吸引（Attractive）”评级。\n\n## 关键要点\n- **大厂估值处于历史合理偏低区间**：AMZN（20.4x '26 EPS）、GOOGL（17.2x '26 EPS）、META（18.6x '26 EPS）均处于近一年估值分位数的偏低位置（折价20%-34%）；行业整体NTM EV/EBITDA为13.1x，处于历史中枢偏下，具备较好的下行安全边际。\n- **SBC股权激励现金化调整（Stock-Based Compensation as Cash）**：\n  - 数字媒体（Digital Media）：调整后2026E EV/EBITDA倍数平均提升约36%（如GOOGL从13.4x升至16.7x，META从7.3x升至10.2x，SNAP受高额股权摊薄影响调整幅度居前）；\n  - 电子商务（eCommerce）：调整后倍数平均提升约30%（AMZN由6.9x升至14.8x，CHWY由2.3x升至15.6x）；\n  - 共享经济与出行（Shared Economy）：调整后倍数平均提升约44%（UBER由6.1x升至13.8x，DASH由9.8x升至24.4x）。\n- **细分板块分化与财报催化**：\n  - 数字广告与AI社交：META与Reddit（RDDT，2026E EV/EBITDA 9.7x，EPS $6.86）受AI赋能广告转化与高用户粘性驱动，基本面持续强化；\n  - 共享出行与外卖：Uber拟要约收购Delivery Hero（50%+1股），大摩作为财务顾问提示协同效应，CART与ABNB在强劲消费支出支撑下大幅反弹；\n  - 电商零售：实体与线上消费向头部平台集中，AMZN凭借AWS算力基础设施与高毛利广告业务双轮驱动，盈利质量在加回SBC后依然领先。\n- **投资建议与核心标的排序**：首选依然围绕具备自研算力优势、核心主业强现金流与AI模型变现闭环的巨头：AMZN（超配，目标价$335）、GOOGL（超配）、META（超配，目标价$775）。\n\n## 关联\n- [大摩GenAI ROIC深度框架：开源权重模型普及下云巨头如何维持高资本回报率](entries/ms-genai-roic-framework-open-weight-models.md) — 补充大摩对北美互联网巨头底层算力与模型变现的细颗粒度ROIC模型。\n- [Morgan Stanley互联网周报：AI硬件vs软件投资轮动分析](entries/Morgan-Stanley互联网周报-AI硬件vs软件投资轮动分析.md) — 对比前期AI硬件与软件应用端的资金轮动节奏。\n- [Google 1Q26云订单积压与Agentic AI资本开支](entries/Google-1Q26-Cloud-Backlog-BofA-DB-HSBC-20260430.md) — 对应GOOGL目前17x EPS超低估值背后的基本面与订单支撑。\n\n## 引用\n- [Morgan Stanley - Internet: Where Are We Trading Now: AI Momentum Building?](res/行业研究-互联网/2026-08-11-Morgan Stanley-Internet Where Are We Trading Now AI Momentum Building-123785181.pdf)", "n122": "# 微软4Q/FY26财报前瞻：Azure增长强劲，Capex预期上修，M365商业云加速（UBS 7/26）\n\n## 摘要\n瑞银（UBS）发布微软（MSFT.O）4Q/FY26（截至2026年6月财季）财报前瞻与渠道调查总结。基于数十位客户与合作伙伴访谈，UBS维持“买入”评级，但战术上临近财报发布持谨慎平衡态度。市场对AI基础设施提供商Capex上升及云增速超预期能力极为敏感。虽然Azure/AWS需求非常健康，且GitHub Copilot改价带来适度拉动，但外部客户算力容量限制及早期Token优化尝试可能限制Azure指引的超预期空间。将FY27 Capex预测由$2340亿调高至$2610亿。M365方面，受益于Copilot/Cowork改进及板块调价，将FY27 M365 Commercial Cloud增速预测上调70bps至16.2%。目标价由$510微调至$480（对应CY27 Non-GAAP PE 21x）。\n\n## 关键要点\n\n- **Azure与算力限制**：Azure需求保持强劲，但受限于第三方客户GPU容量瓶颈及企业早期Token优化，2H26 Azure增速大幅超预期的门槛较高。\n- **Capex预测上修**：由于中短期算力需求依然高企及内存价格通胀，将FY27 Capex预测由$2340亿上调至$2610亿（市场投资者心理预期在$2550-2600亿）。\n- **M365/Copilot商业化加速**：Copilot体验改善与M365套餐调价形成合力，将FY27 M365商业云收入增速调高70bps至16.2%。\n- **估值与情绪边际**：微软股价年内回调21%已部分消化投资者对Capex飙升及AI ROI不确定性的焦虑；当前CY27E PE仅19x (GAAP) / 17x (Non-GAAP)，具备良好安全边际。\n- **财务预测**：预测FY26/FY27营收分别达$3,307.68亿与$3,883.82亿（YoY +17.4% / +17.4%），稀释每股收益（UBS）分别为$16.95与$19.26。\n\n## 关联\n- [MSFT FQ3'26 财报速览：Azure加速 + Copilot起飞 (BNP Paribas/HSBC/UBS综合)](entries/MSFT-FQ3-26-财报速览-Azure加速-Copilot起飞-BNP-Paribas-HSBC-UBS综合.md) —— 对比三季度财报表现与四季度前瞻预期。\n- [MSFT AI基础设施货币化：仍处AI周期早期阶段 (Morgan Stanley 5/27)](entries/MSFT-AI基础设施货币化-仍处AI周期早期阶段-Morgan-Stanley-5-27.md) —— 查看摩根士丹利关于Capex投产比与算力扩容的论述。\n\n## 引用\n- [UBS - Microsoft Corp. Update on Azure, Capex and M365](res/微软/2026-07-26-MSFT.OQ-UBS Equities-Microsoft Corp. _Update on Azure, Capex and M365_ (Buy) Keir...-123405553.pdf)", "n123": "# 宁波银行深度：如何理解“大银行做不好，小银行做不了”的客群经营能力（中泰证券 7/25）\n\n## 摘要\n中泰证券发布宁波银行（002142.SZ）系列深度报告之一（客群篇）。报告指出，宁波银行是A股银行中少数真正以“客群经营能力”立身的城商行龙头。公司通过服务能力贯穿两端：在中小企业端，凭借信息替代抵押的数字化风控能力，做深做透“大银行做不好”的长尾市场；在大型客户端，通过“鲲鹏司库”与“财资大管家”嵌入企业资金中枢，做强“小银行做不了”的综合服务，实现活期存款沉淀（新增存款中活期占比70.84%）。预计2026-2028E归母净利润同比分别增长10.0%、11.3%与11.5%，维持“增持”评级。\n\n## 关键要点\n\n- **中小企业端（大银行做不好）**：\n  - **信息替代抵押**：信用贷款占比达39.1%（与招商银行同处行业第一档），在“敢做无抵押”的同时全行不良率长期保持在0.76%（行业并列最低）。\n  - **数字化效率与人均产出**：将长尾服务成本大幅降低，人均营收达289.5万元（高于招商银行与杭州银行）。\n- **大型客户端（小银行做不了）**：\n  - **基础设施化粘性**：避开单纯授信价格战，以司库管理平台切入企业资金中枢。\n  - **低成本负债沉淀**：对公活期存款占比升至37.7%，对公活期成本率仅0.63%（整体存款付息率1.61%），负债端成本优势显著。托管规模突破5.14万亿元。\n- **管理层与治理结构**：\n  - 国资、外资、民营均衡的股权结构提供长期主义土壤。2026年完成行内成长的管理团队平稳交接（庄灵君等），经营战略具备极强延续性。\n- **业绩与估值预测**：\n  - 预测2026E/2027E/2028E营收分别为789.24亿、875.63亿与977.02亿元；归母净利润分别为323.95亿、360.63亿与402.10亿元（YoY +10.0% / +11.3% / +11.5%）。\n  - 当前股价对应2026E PE 6.74x、PB 0.89x，ROE稳定在14%以上，安全边际良好。\n\n## 关联\n- [宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick](entries/宁波银行2026Q1-营收和利润重回双位数增长-Morgan-Stanley维持Top-Pick.md) —— 对比摩根士丹利关于宁波银行一季报营收重回双位数增长的研判。\n-  —— 追踪宁波银行资产质量与不良率（0.76%）在历史财报中的稳定性。\n\n## 引用\n- [中泰证券 - 宁波银行系列报告之一丨客群篇：如何理解“大银行做不好，小银行做不了”](res/宁波银行/2026-07-25-002142.SZ-Zhongtai Securities-宁波银行-宁波银行系列报告之一丨客群篇： 如何理解“大银行做不好，小银行做不了”-07252026-123408680.pdf)", "n124": "# 厦门瑞为信息港股18C章上市招股书分析\n\n**类别**: 主板上市招股说明书 (第18C章) | **公司**: 厦门瑞为信息技术股份有限公司 | **联席保荐人**: 招银国际、国泰君安\n\n## 摘要\n瑞为信息成立于2012年，是一家专注于提供视觉智能算法和软硬件产品的大型AI公司，致力于将计算机视觉算法应用于智慧民航、智慧商业及智慧安全驾驶三大核心场景。弗若斯特沙利文显示，按2025年收入计，公司在防坠防碰、刷脸通行等中国民航视觉智能产品市场中位列第一（市场份额8.7%），商业空间视觉智能产品市场排名第四。\n\n## 关键要点\n\n- **财务状况**：2023-2025年收入分别为2.42亿、3.95亿和4.43亿元人民币，其中智慧民航和智慧商业为主要收入支柱；毛利率分别保持在40.8%、39.8%和37.7%；2023年净亏损3258万，2024年扭亏实现净利829万，2025年由于加大研发投入及计提金融资产减值而再度录得净亏损6815万元（经调整年内亏损为4879万元）。\n- **技术链条与Reco系列**：拥有自研FacePass、RecoSee、RecoAware、RecoThink等视觉智能体，并于2026年4月发布首个集成视觉与力触觉的端到端具身大模型VTFLA模型，已启动人形机器人研发。\n- **募资用途**：计划发售28,087,000股H股，指示性售价21.66港元。募资所得约55.8%将用于算法迭代与大模型研制，26.3%用于建立硬件自制和组装测试生产基地。\n\n## 关联\n- **招股书** —— 本文为特专科技18C上市招股书。\n- **具身智能** —— 瑞为信息通过自研VTFLA模型和轮腿式人形机器人进入这一前沿领域。\n- [基本半导体港股IPO招股书分析](entries/basic-semiconductor-sic-ipo-prospectus-202606.md) —— 同属于18C特专科技公司上市，可对比两家公司在现金流消耗率、IDM vs 代工、盈利路径及大客户集中度上的差异。", "n125": "# Reddit 2Q26广告高增长与Google搜索流量风险再平衡\n\n## 摘要\nReddit 2Q26收入8.05亿美元，同比增长61%，连续第八个季度实现60%以上增长；广告收入增长64%，活跃广告主增长70%以上，证明中下层漏斗产品与SMB扩张正在提高变现效率。与此同时，DAUq虽同比增长18%至1.30亿，但美国DAUq环比减少30万，Google搜索生态及机器翻译内容排名变化重新暴露获客入口依赖。JPMorgan将2026年收入与调整后EBITDA预测分别上调至35.21亿和15.91亿美元，但因搜索流量可见度有限，维持Neutral，并以约12倍2028E调整后EBITDA给出2027年底185美元目标价。\n\n## 关键要点\n\n- 2Q26收入8.05亿美元（+61% YoY），高于管理层7.15亿至7.25亿美元指引；调整后EBITDA为3.43亿美元，利润率42.6%，同比增长106%。\n- 广告收入同比增长64%，活跃广告主增长70%以上；动态商品广告与App安装收入均同比翻倍，中型市场与SMB收入也同比翻倍。\n- Max广告主数量环比增长60%，Max收入环比增长150%，显示自动化投放与SMB onboarding 正成为广告增长的新引擎。\n- DAUq为1.30亿（+18% YoY），但美国登录用户与登出用户分别环比减少10万和20万；搜索逆风在2Q末加剧，短期流量预测可信度下降。\n- 新App用户留存同比提升50%，feed模型提升贡献率与会话频次，产品优化可部分对冲外部搜索流量波动，但尚未证明能够替代Google导流。\n- JPMorgan上调2026E收入5%至35.21亿美元、调整后EBITDA 6.8%至15.91亿美元，同时将2026E DAUq下调2%至1.38亿，呈现“ARPU上修、用户下修”的分化。\n- 185美元目标价基于约12倍2028E调整后EBITDA 28.89亿美元，相比Snap与Pinterest约5倍均值有显著溢价，安全边际受流量风险约束。\n\n## 分析结论\nReddit的核心矛盾已从广告产品能否兑现，转向强劲ARPU能否长期覆盖用户入口波动。广告主广度、Max放量和43%左右EBITDA利润率支持盈利预测上修，但Google向AI Overviews演进可能同时改变自然流量与数据授权谈判的价值分配；在产品驱动留存持续改善并形成独立获客闭环前，Neutral较追逐高增长更符合风险收益比。\n\n## 关联\n- [Google AI Wars流量跟踪：Gemini与Claude高速增长，Google搜索份额稳定](entries/Google-AI-Wars-Traffic-BofA-202605-06.md) — Google搜索份额约90%的稳定表象，与Reddit承受的搜索生态结构性导流波动形成互补观察。\n- [Google 1Q26云业务超预期爆发，Cloud backlog达4620亿美元](entries/Google-1Q26-Cloud-Backlog-BofA-DB-HSBC-20260430.md) — AI Overviews与AI Mode推动Google查询增长，解释搜索产品升级为何可能重塑外部内容平台流量。\n- [Meta 1Q26业绩超预期但资本开支大幅上调](entries/Meta-1Q26-Results-Capex-BofA-DB-JPM-20260430.md) — 对比大型广告平台利用AI推荐与广告排序扩大ROI，凸显Reddit商业化增长与流量控制力的差距。\n\n## 引用\n- [JPMorgan - Reddit Advertising Trajectory Remains Strong, But Traffic and User Challenges Resurface](res/Reddit/2026-07-31-RDDT.N-JPMorgan-Reddit%20Advertising%20Trajectory%20Remains%20Strong,%20But%20Traffic%20an...-123507569.pdf)", "n126": "# 中国短剧行业野村专家会纪要：红果短剧AI生成内容反噬流量，平台重回真人短剧偏好（野村 7/13）\n\n## 摘要\n野村证券（Nomura）组织字节跳动旗下的红果短剧（Hongguo）平台专家小范围交流。专家透露，虽然AI工具将短剧生产成本降至真人内容的1/3至1/4，并推动AI漫改内容快速激增，但AI生成内容缺乏真实人类情感共鸣，品牌广告主买单意愿低，且劣质生成内容稀释了平台整体广告价值。红果短剧已主动干预，将AI生成内容播放量占比硬性限制在30%以下，流量与资金重新倾斜真人短剧。专家预计2026年中国AI生成短剧市场规模将增长80%至267亿元，带动的整体短剧市场将突破1200亿元（+25% YoY）。\n\n## 关键要点\n\n- **AI生成短剧的弊端与平台政策转向**：\n  - **成本与效率**：AI工具制作单本短剧成本仅为真人剧的25%-33%，制作周期极大缩短。\n  - **广告价值稀释**：创作者批量刷低质AI生成内容抢占时长，但由于缺少情感粘性，广告主转化率差。\n  - **政策调控**：红果硬性干预流量分发，将AI内容占比上限封顶在30%，重回真人短剧扶持路线。这将对Seedance等文生视频AI工具的商业化产生制约。\n- **红果双App矩阵与用户画像差异**：\n  - **红果短剧主App**：1H26 DAU 达到1.20亿，MAU 达3.30亿。核心用户为下沉市场中老年人群，以生命周期更长的真人爆款剧为主。\n  - **红果漫剧App**（由“咸柠檬”升级）：2026年6月 DAU 达1650万，MAU 达4000万。主打年轻男性ACGN（二次元）群体，以低成本、短生命周期的AI生成漫改内容为主。\n- **短剧整体市场规模预测**：\n  - 预计2026年中国AI生成短剧市场规模达267亿元（+80% YoY）；红果在AI短剧市场占据超过60%的份额。\n  - 中国整体短剧（真人+AI）市场规模预计2026年将超过1200亿元（+25% YoY）。\n\n## 关联\n- [野村证券中国互联网2026年5月月度流量与App跟踪报告](entries/野村证券中国互联网2026年5月月度流量与App跟踪报告.md) —— 对比野村对字节跳动及红果短剧月度活跃用户（MAU/DAU）的跟踪数据。\n- [JPMorgan 2026 Global China Summit 中国互联网行业关键洞察](entries/JPMorgan-2026-Global-China-Summit-中国互联网行业关键洞察.md) —— 对应互联网泛娱乐流量与AI应用商业化环境变迁。\n\n## 引用\n- [Nomura - Takeaways from a short drama platform expert call](res/行业研究-互联网/2026-07-13-0700.HK-Nomura-China Internet  New Media - Takeaways from a short drama pl...-123128877.pdf)", "n127": "# 双环传动002472.SZ价值成长QARP深度分析\n\n## 摘要\n双环传动是全球高精度齿轮及机器人RV减速器（环动科技）龙头，新能源汽车齿轮国内市占率超60%。2025年实现营收91.12亿元，归母净利润12.62亿元（+23.2%）。但2026Q1显示降速压力：营业收入20.95亿元（+1.49%），扣非净利润2.58亿元（-4.04%），主要由于新能源整车厂价格战向上游传导压价。当前静态PE为23.8x，2026E动态PE约21-22x，动态PEG达1.76（估值未透支但缺乏安全边际），五档结论为合理。建议在28.0-30.0元理想区间低吸。\n\n## 关键要点\n\n- 新能源电驱高精度齿轮壁垒极高，双环实现规模效应和工艺领先，2026Q1毛利率仍维持27.55%的高水平。\n- 机器人RV减速器子公司环动科技已启动分拆上市，国内RV减速器市占率第一（~30%），是人形机器人链的核心受益期权。\n- 2026年业绩由高速增长期进入个位数/低双位数稳态调整期，一致预期2026E利润增长降至10-15%。\n- 相比恒立液压50x PE，双环23x PE性价比较高，但无安全边际不宜追高。\n\n## 关联\n- [摩根士丹利中国工业中报展望：资本支出强劲与机器人商业化起航](entries/ms-china-industrials-mid-year-outlook-2026-07.md) — MS维持其超配（OW）评级并给与50.00元目标价。\n- [德意志银行亚太工业外资持仓追踪：2Q26恒立与双环逆势流入](entries/deutsche-bank-apac-industrials-foreign-shareholding-2q26.md) — 2Q26外资持股回升2.1%至11.6%，显示资金情绪修复。\n\n## 引用\n- [双环传动2025年年报及2026年一季报](res/待分类)\n- [东吴证券双环传动点评报告-2026-04](res/待分类)", "n128": "# SK海力士HSBC 2Q26研报：情绪过度脱节，重申Buy与超级周期，目标价370万韩元\n\n## 摘要\nHSBC发布SK海力士最新研究报告，重申 Buy 评级，目标价 370 万韩元（对应 2027E 目标 PB 3.4x，隐含139%上涨空间）。HSBC认为市场情绪已严重偏离基本面事实。二季度营业利润61万亿韩元（含6-7万亿韩元奖金提拨），微幅低于预期主因HBM及移动端DRAM组合变动。展望3Q26，在DRAM均价+20%及NAND均价+13%推动下，预计三季度营业利润将爆破至 79 万亿韩元（+30% QoQ，+591% YoY）。Agentic AI引发的存储超级周期媲美1990-1995年PC时代，HBM4切换将重建产品溢价。\n\n## 关键要点\n\n- 3Q26大幅加速展望：预计3Q26营收101万亿韩元（+27% QoQ），营业利润79万亿韩元（+30% QoQ），DRAM出货量+11% QoQ。\n- Agentic AI驱动超级周期：媲美1990-1995年PC超级周期，办公自动化与Context Memory（KV Cache）需求爆发，云厂商（CSP）扩产不会减速。\n- HBM4溢价重建：随着HBM4落地，HBM与普通DRAM的溢价将重新扩大，加上基于ARM架构CPU的SO-CAMM2需求推动，ASP上行空间打开。\n- 目标价估值逻辑：给予2027/28E 目标 PB 3.4x（对应历史高位+20%溢价），隐含PE仅约 8x 2027/28E 平均EPS，极具性价比。\n\n## 关联\n- [SK海力士Macquarie 2Q26研报：现金扣除后扣非PE仅1倍，股价严重超跌](entries/sk-hynix-macquarie-2q26-update.md)\n- [SK海力士MS 2Q26研报：短期微小Miss不改下半年强劲反弹](entries/sk-hynix-morgan-stanley-2q26-update.md)\n\n## 引用\n- [HSBC - SK Hynix Buy Excessive Divergence](res/SK海力士/doc_8ca37be2f209_2026-07-30-000660.KS-HSBC Global Investme-SK Hynix (000660 KP) Buy Excessive divergence – sentiment h...-123472585.pdf)", "n129": "# SK海力士Macquarie 2Q26研报：现金扣除后扣非PE仅1倍，股价严重超跌\n\n## 摘要\nMacquarie发布SK海力士2Q26点评，二季度实现营业利润60.5万亿韩元（+61% QoQ），主要由DRAM ASP（+30%）和NAND ASP（+55%）驱动。虽然盈利略低于市场极高预期，但主要是由于HBM4出货节奏与传统DRAM产品组合短期扰动。Macquarie强调股价在一个月内腰斩（回落近40-50%），当前股价交易于 2027E PE 2.5x / PB 1.3x，若扣除2027年底预期的净现金后，实际PE仅约 1x。管理层确认AI需求极其强劲且供应链受限（晶圆惩罚与技术复杂度），客户正积极签订多年期LTA。重申 Outperform 评级，目标价 340 万韩元。\n\n## 关键要点\n\n- 2Q26营业利润60.5万亿韩元（+61% QoQ），DRAM均价+30%，NAND均价+55%，显示强劲定价权。\n- 估值极度超跌：当前股价对应 2026E PE 4.0x，2027E PE 2.5x，PB 1.3x；扣除净现金后 2027E ex-cash PE 仅 1x。\n- AI需求确认：客户正在寻求签订长单（LTA）以锁定产能，AI资本开支具备可持续性与成本效益。\n- 催化剂：ADR定价落地、3Q26签订2027年HBM长期供应协议、下半年跟进股东回报举措。\n\n## 关联\n- [SK海力士MS 2Q26研报：短期微小Miss不改下半年强劲反弹](entries/sk-hynix-morgan-stanley-2q26-update.md)\n- [SK海力士HSBC 2Q26研报：情绪过度脱节，重申Buy与超级周期](entries/sk-hynix-hsbc-2q26-update.md)\n\n## 引用\n- [Macquarie - SK Hynix Oversold at 1x ex-cash PE](res/SK海力士/doc_96e2b7f7b0f5_2026-07-29-000660.KS-Macquarie Research-Oversold at 1x ex-cash PE-123468415.pdf)", "n130": "# SK海力士MS 2Q26研报：短期微小Miss不改下半年强劲反弹，目标价260万韩元\n\n## 摘要\nMorgan Stanley在SK海力士2Q26财报后重申 Overweight 评级，目标价 260 万韩元（潜在涨幅68%）。二季度实现创纪录的营业利润60.5万亿韩元（+61% QoQ，营业利润率达76%），略低于买方共识主因二季度DRAM均价增幅受HBM3e产品转换过渡影响。MS预计下半年HBM4放量将驱动DRAM ASP大幅上行。公司已与约10家AI核心客户签署多长单（LTA），显著提高了利润与FCF可见度。当前股价交易于 2026E PE 4.9x / 2027E PE 3.4x / PB 1.7x，市场已过度按周期下行定价，严重低估了AI需求的持续性。\n\n## 关键要点\n\n- 2Q26创纪录业绩：营业利润60.5万亿韩元，DRAM OPM达~80%，NAND OPM达~70%。\n- HBM4下半年加速：下半年HBM4量产落地将推升DRAM ASP，打破二季度HBM3e过渡期的均价停滞。\n- 10家多长单（LTA）锁定：客户锁定多年期供应，大幅改善盈利与现金流可见度，全年度Capex维持在近50万亿韩元的高位。\n- 股东回报可期：随着三季度现金储备突破100万亿韩元及ADR监管申报完成，近期有望出台股东回报/回购政策。\n\n## 关联\n- [SK海力士Macquarie 2Q26研报：现金扣除后扣非PE仅1倍，股价严重超跌](entries/sk-hynix-macquarie-2q26-update.md)\n- [SK海力士HSBC 2Q26研报：情绪过度脱节，重申Buy与超级周期](entries/sk-hynix-hsbc-2q26-update.md)\n\n## 引用\n- [Morgan Stanley - SK Hynix 2Q26 Update](res/SK海力士/doc_3176339150d7_2026-07-29-000660.KS-Morgan Stanley-SK hynix 2Q26 – Slight Miss before Stronger Back Half-123455566.pdf)", "n131": "# 腾讯控股2026Q2及H1官方业绩\n\n## 摘要\n腾讯2026年第二季度实现营收2047.85亿元，同比增长11%，毛利1184.33亿元增长13%，增长质量优于收入增速。GAAP归母净利润560.22亿元仅增长0.7%，而更能反映主营经营的Non-IFRS归母净利润684.15亿元增长9%。2026年上半年营收4012.43亿元增长10%，Non-IFRS归母净利润1363.20亿元增长10%；公司同时显著增加AI算力采购，短期自由现金流受到资本开支挤压。\n\n## 关键要点\n\n1. **Q2收入利润**：营收2047.85亿元（+11% YoY），毛利1184.33亿元（+13%），经营利润672.76亿元（+12%）。\n2. **调整后盈利**：Q2 Non-IFRS经营利润756.36亿元（+9%），Non-IFRS归母净利润684.15亿元（+9%），摊薄EPS 7.433元（+9%）。\n3. **半年表现**：H1营收4012.43亿元（+10%），归母净利润1141.15亿元（+10%），Non-IFRS归母净利润1363.20亿元（+10%）。\n4. **用户基础**：微信及WeChat合并月活14.39亿（+2%），QQ移动端月活5.20亿（-2%），收费增值服务订阅2.59亿（-2%）。\n5. **业务增速**：Q2营销服务收入435.65亿元（+22%），金融科技及企业服务收入602.86亿元（+9%），广告和企业服务是主要增量。\n6. **AI商业化**：WorkBuddy用户和付费意愿增长，微信内AI智能体“小微”开始小规模测试，Hy3正式版进入生产使用。\n7. **资本投入**：披露口径Q2资本开支527.84亿元，主要投向IT基础设施、数据中心、计算设备及软件，AI算力投入显著抬升。\n8. **现金流风险**：高额资本开支及算力预付款压低当期自由现金流，后续需同时跟踪AI收入、资本开支与经营现金流转化。\n\n## 关联\n\n- [德银腾讯2Q26业绩分析](entries/tencent-2q26-db-ai-strategy-and-capex-surge.md) — 将官方收入、分部增长和资本开支数据映射到AI战略及估值影响。\n- [汇丰腾讯2Q26分析](entries/tencent-hsbc-2q26-better-ai-outlook.md) — 对照卖方对AI成本、WorkBuddy变现及利润率的判断。\n- [瑞银腾讯2Q26分析](entries/tencent-ubs-2q26-patience-for-ai-upside.md) — 提供AI投入压制短期利润、长期价值待兑现的反方视角。\n\n## 引用\n\n- [腾讯控股截至2026年6月30日止三个月及六个月业绩公告](res/腾讯控股/tencent-2026-q2-h1-results.pdf)", "n132": "# 德银腾讯2Q26业绩分析：AI战略清晰化与Capex激增176%，游戏与广告基本面强劲\n\n## 摘要\n腾讯控股（0700.HK）发布2026年第二季度业绩，各项核心业务维持稳健动能。2Q26实现总营收2,047.85亿元人民币（同比+11%，环比持平），与德银及彭博一致预期基本吻合；毛利率达58%（同比+1pp）；Non-IFRS归母净利润达684.15亿元（同比+9%），若剔除新AI产品（混元Hy、元宝、CodeBuddy、WorkBuddy、小微）前期投入影响，Non-IFRS经营利润同比增速达19%（由756.4亿增至861亿元）。本季度最显著变化在于资本开支（Capex）同比大幅激增176%（环比+65%）至593亿元，体现公司在AI算力基础设施及大模型落地上的果断加码。德银维持2026/2027年营收预期8,274亿/9,027亿元，小幅下调调整后净利润预测2%/4%以反映AI Capex与研发折旧，将目标价由800港元微调至760港元，重申“买入”评级。\n\n## 关键要点\n- **AI战略矩阵清晰化，落地全面提速**：腾讯明确构建以底层大模型“混元Hy”、生产力Agent工具“WorkBuddy/CodeBuddy”以及微信生态级C端Agent“小微（Xiaowei）”为核心的三层架构。2026年7月发布的Hy3正式版在OpenRouter全球Token消耗榜跻身前3；WorkBuddy用户与付费意愿增长迅速；基于轻量定制化WeLM模型的微信“小微”已启动小规模灰度测试，聚焦隐私保护与生态端侧低延迟。\n- **游戏业务国内重回双位数增长**：2Q26本土游戏收入达473亿元（同比+17%，显著高于1Q26的+6%），受《三角洲行动》（Delta Force）、《无畏契约》（VALORANT）等长青射击大作双端发力，以及新爆款《洛克王国：世界》推动；海外游戏受基数影响收入186亿元（同比-12%），但递延收入支撑下半年整体游戏增速维持健康。\n- **营销服务（广告）AI赋能提速**：广告收入达435.65亿元（同比+22%，环比+14%），得益于AI驱动推荐模型升级、AIM+全自动投放平台（针对小店与微短剧广告端到端生成）以及视频号总使用时长超20%的强劲增长；618大促及闭环电商（微信小店）交易生态进一步推高电商、本地生活投放。\n- **金融科技与企业服务（云）加速**：板块收入602.86亿元（同比+9%），其中云业务收入增速受AI算力租用、海外拓展及有利定价带动回升至20%出头区间，预计2H26在企业智能化渗透下进一步提速。\n- **现金流与资本开支考量**：2Q26经营性现金流527亿元，受单季593亿Capex及算力预付款影响，表观自由现金流转为-138亿元；但若剔除AI算力预付款，常规FCF达376亿元，主业造血能力依然极其强韧。\n\n## 关联\n- [腾讯控股2Q26前瞻与微信AI Agent关键进展](entries/tencent-2q26-preview-and-weixin-ai-agent-milestones.md) — 德银2Q26财报实际数据与前瞻中预测的微信AI小微灰度节奏、游戏反弹路径完全吻合。\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — 1Q26小摩预判的AI独立核算在本季德银分析中得到验证（剔除AI产品后OP增长19%）。\n- [申万宏源腾讯深度之三：超级入口与生态壁垒的再进化](entries/申万宏源腾讯深度之三-AI时代核心受益者-超级入口与生态壁垒的再进化.md) — 深度阐述微信流量底座与生态闭环在Agent时代转化变现的独特壁垒。\n\n## 引用\n- [Deutsche Bank - Tencent: Clearer AI strategy & accelerated execution](res/腾讯控股/2026-08-12-0700.HK-Deutsche Bank-Tencent Clearer AI strategy  accelerated execution-123796968.pdf)", "n133": "# 腾讯控股2Q26前瞻：AI加大投入拖累短期利润率，核心业务韧性良好（野村 7/13）\n\n## 摘要\n野村证券（Nomura）发布腾讯控股（0700.HK）2Q26F业绩前瞻报告。野村预计腾讯2Q26F营业收入同比增长10%至2030亿元（符合彭博一致预期）；Non-IFRS净利润同比增长6%至670亿元（比一致预期690亿元低3%）。因AI模型研发与算力基础设施投入加大，预计Non-IFRS营业利润率（OPM）同比下降0.4pp至37.1%。各板块中，游戏（+10%）与视频号广告（+18%）表现亮眼，腾讯云带动企业服务收入加速至+22%。混元3.0正式版表现优异，WorkBuddy桌面Agent用户数领先，AI战略落地成效显现。维持“买入”评级及SOTP目标价727.00港元。\n\n## 关键要点\n\n- **业绩与利润率**：预测2Q26F营收2030亿元（+10% YoY），Non-IFRS净利润670亿元（+6% YoY）；受AI算力与研发投入影响，Non-IFRS OPM回落至37.1%（同比-0.4pp）。\n- **细分业务动能**：\n  - **网络游戏**：营收预计653亿元（+10% YoY），本土游戏在爆款带动下+11% YoY，海外+8% YoY。\n  - **网络广告**：营收预计+18% YoY，视频号广告加载率与变现效率提升是核心驱动。\n  - **金融科技与企业服务 (FBS)**：营收预计+9% YoY，其中企业服务（腾讯云）营收增速由1Q26的20%进一步加速至22%。\n- **AI 战略成效**：\n  - **混元 3.0**：7月初发布的正式版能力显著超越4月预览版，开发者认可度高，快速缩小与全球领先模型的差距。\n  - **WorkBuddy 桌面 Agent**：据Analysys数据，截至2026年3月月访问量达885万，为国内最受欢迎的桌面AI Agent；但阿里与字节竞品相继推出，竞争加剧。\n- **盈利与估值预测**：微调FY26F与FY27F Non-IFRS净利润预测-2%/-1%，维持买入评级与SOTP目标价727.00港元（对应FY27F PE 20x，目前当前股价仅12.7x，安全边际极高）。\n\n## 关联\n- [腾讯2Q26业绩前瞻与微信AI Agent里程碑](entries/tencent-2q26-preview-and-weixin-ai-agent-milestones.md) —— 对比汇丰HSBC关于微信AI Agent变现与2Q26前瞻的分析。\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) —— 结合摩根大通关于AI资本开支与双P&L拆解的逻辑比较。\n\n## 引用\n- [Nomura - Tencent Holdings 2Q26F: margin likely under pressure on AI investment](res/腾讯控股/2026-07-13-0700.HK-Nomura-Tencent Holdings (700 HK) (Buy) - 2Q26F margin likely under...-123124523.pdf)", "n134": "# 腾讯控股2Q26业绩前瞻与微信AI Agent商业化进程\n\n## 摘要\n腾讯2Q26经营表现整体稳定，各板块稳健推进。预计2Q营收同比+9%，Non-IFRS净利润达660亿元（+4% YoY）。游戏业务方面，本土市场在《王者荣耀》、《和平精英》及新品《宝可梦大集结》支撑下预计增长10%，海外市场受Supercell及库洛游戏并表高基数影响增速放缓至8%。广告受视频号与广告技术升级支撑预计增长18%。最受关注的AI进程上，Weixin AI Agent已于2026年6月初启动Beta公测，由HY3模型驱动。为支撑AI基础设施建设，腾讯Capex预计大幅提升至1700亿元。因AI Capex及折旧费用上调，HSBC将腾讯目标价从720港元下调至655港元，JPMorgan维持690港元目标价，强调14x FY26e PE估值具有高安全边际。\n\n## 关键要点\n\n- **营收与盈利预测**：预计2Q26营收同比+9%，调整后营业利润达740亿元（+7% YoY）。业务结构向高毛利转变，GPM预计提升至57.9%。\n- **微信 AI Agent 商业化**：Weixin Agent 6月Beta测试将微信AI从单纯的概念期权转化为落地里程碑。JPMorgan将此评估为“三层增量价值空间”：1) 更好的流量索取线索；2) 基于更广商户生态的半市场形态；3) 顶层流量分发电商平台。估算至2030年，该AI代理将贡献Rmb690亿至Rmb4260亿的增量营收。\n- **Capex与研发费用激增**：为支持大规模AI推理和算力网络建设，腾讯Capex预计显著提升（HSBC预测2026年Capex升至1700亿，远高于2025年的870亿），这会导致折旧和摊销上升。\n- **产品与用户粘性**：微信AI助手WorkBuddy继续维持强劲增长（3月MAU已达800万）；混元3.0（HY3）模型性能及用户满意度稳步攀升。\n- **游戏版图微调**：受《王者荣耀世界》及 legacy 游戏释放节奏放缓影响，未来3年游戏收入预期略有下调，但整体常青产品流水仍显坚韧。\n\n## 关联\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 腾讯一季度在Hy3模型和WorkBuddy生产力工具的首次业绩表现。\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — 对应JPMorgan提出的双P&L框架，用以平息AI高投入对核心业务利润率稀释的担忧。\n- [华泰证券腾讯1Q26前瞻：AI布局和云业务迎来拐点，维持买入](entries/华泰证券腾讯1Q26前瞻-AI布局和云业务迎来拐点-维持买入.md) — 微信智能体云端承载与大模型升级对腾讯云业绩拐点的影响。", "n135": "# 汇丰腾讯2Q26：AI成本担忧或被高估，WorkBuddy开始变现\n\n## 摘要\n腾讯2Q26营收2047.85亿元，同比增长11%，较汇丰及市场预期高1%；Non-IFRS净利润684.15亿元，同比增长9%，与市场预期基本一致。汇丰认为市场对AI投入拖累的担忧可能过度：小微使用较小参数WeLM并持续提升Token效率，GPU出租又能为资本开支提供即时变现。核心业务仍稳健但短期不再加速，国际游戏高基数与新游空窗构成约束；汇丰维持买入评级和655港元目标价，对461.60港元股价对应41.9%上行空间。\n\n## 关键要点\n- **业绩略优于预期**：2Q26营收2047.85亿元（+11% YoY）高汇丰/共识1%，Non-IFRS经营利润756.36亿元（+9%）高共识1%，Non-IFRS净利润684.15亿元（+9%）符合共识。\n- **广告与国内游戏强劲**：营销服务收入435.65亿元（+22%）高共识3%，国内游戏473亿元（+17%）高共识6%；国际游戏186.14亿元（-1%）低共识9%。\n- **AI成本或被高估**：小微采用更小参数的WeLM并强调隐私、Agent能力和成本效率，预计营销投入也低于传统聊天机器人元宝。\n- **AI开始形成收入闭环**：Hy3付费期日均Token使用量为预览版的7倍；WorkBuddy与MaaS付费用户毛利率已接近腾讯云整体水平，云收入同比增速加快至20%出头。\n- **盈利预测与估值**：汇丰预计2026/27/28年EPS为28.83/28.75/32.87元，当前对应13.8/13.8/12.1倍PE；维持目标价655港元和买入评级。\n- **短期风险**：汇丰下调2026-28年国际游戏预测3%-6%，预计国内游戏3Q26降速、待9月新游《王者万象棋》后4Q回升。\n\n## 关联\n- [德银腾讯2Q26业绩分析：AI战略清晰化与Capex激增176%，游戏与广告基本面强劲](entries/tencent-2q26-db-ai-strategy-and-capex-surge.md) — 对照德银对2Q26实际业绩、AI产品矩阵及资本开支的判断。\n- [腾讯控股2Q26业绩前瞻与微信AI Agent商业化进程](entries/tencent-2q26-preview-and-weixin-ai-agent-milestones.md) — 回看财报前对小微商业化、AI投入与盈利影响的预期。\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — 追踪剔除新AI产品后的核心经营利润增速从1Q26的17%升至2Q26的19%。\n\n## 引用\n- [HSBC - Tencent Holdings: Buy: Better AI outlook](res/腾讯控股/2026-08-13-0700.HK-HSBC Global Investme-Tencent Holdings (700 HK) Buy Better AI outlook-123797024.pdf)", "n136": "# 瑞银腾讯2Q26：短期盈利受AI投入压制，长期价值需耐心兑现\n\n## 摘要\n腾讯2Q26营收和调整后经营利润分别同比增长11%和9%，均比预期高约1%，核心业务保持韧性。瑞银把全年资本开支预测从1700亿元大幅上调至2500亿元，并下调2026-28年盈利预测1%-4%，判断AI成本已可见但元宝、小微及AI云的集团级利润贡献仍需时间。短期缺乏AI盈利催化，股价可能难跑赢；长期凭借微信分发、私有数据、闭环生态和强现金流，腾讯有望承接利润池从基础设施向应用迁移，瑞银维持买入并将目标价由780港元降至770港元。\n\n## 关键要点\n- **2Q26符合预期**：营收同比+11%、调整后经营利润同比+9%，均小幅高预期1%；剔除新AI投入后调整后经营利润同比+19%，高于1Q26的+17%。\n- **资本开支显著上修**：2Q26 Capex约530亿元，较1Q26的320亿元明显增加；瑞银将2026年全年Capex预测由1700亿元上调至2500亿元。\n- **AI产品进展**：Hy3正式版日均Token消耗较预览版增长6倍；WorkBuddy 6月交互量2750万次，第二名为1280万次，订阅增长且利润率已接近云业务。\n- **核心业务仍有韧性**：国内游戏收入同比+17%，国际游戏按固定汇率增长+4%；广告收入同比+22%，瑞银预计3Q26广告仍增长18%。\n- **短期盈利承压**：瑞银预计2H26收入/调整后经营利润同比增长7%-8%/-1%，2027年约增长10%/持平，并将2026-28年盈利预测下调1%-4%。\n- **估值已计入较多成本**：股价461.60港元对应约14倍2026E PE；目标价770港元隐含66.8%价格上涨及68.2%总回报。\n- **长期护城河**：微信的分发入口、私有数据、交易闭环与强资产负债表，使腾讯能够在AI商业化延迟时主动调节投资强度。\n\n## 关联\n- [腾讯控股UBS 1Q26：符合预期，低估值的期权价值](entries/腾讯控股UBS-1Q26-符合预期-低估值的期权价值.md) — 对照瑞银从1Q26低估值期权逻辑到2Q26高投入等待兑现的观点变化。\n- [德银腾讯2Q26业绩分析：AI战略清晰化与Capex激增176%，游戏与广告基本面强劲](entries/tencent-2q26-db-ai-strategy-and-capex-surge.md) — 对照德银对593亿元口径Capex及AI战略加速的解读。\n- [腾讯控股2Q26业绩前瞻与微信AI Agent商业化进程](entries/tencent-2q26-preview-and-weixin-ai-agent-milestones.md) — 验证财报前对小微进度、资本开支和利润率拖累的判断。\n\n## 引用\n- [UBS - Tencent Holdings: 2Q26 inline; Patience needed to unlock long-term AI upsides](res/腾讯控股/2026-08-13-0700.HK-UBS Equities-First Read Tencent Holdings _2Q26 inline; Patience needed t...-123797061.pdf)", "n137": "# 台积电2026Q2官方业绩\n\n## 摘要\n台积电2026年第二季度营收1.270381万亿新台币，同比增长36.0%、环比增长12.0%，净利润7065.62亿元，同比增长77.4%。季度毛利率67.7%、营业利润率60.3%，均处于极高水平，先进制程需求和经营杠杆共同推升盈利。2nm已贡献3%晶圆收入，管理层预计其陡峭爬坡将支持第三季度美元收入升至446亿至458亿美元，并预计2026年美元收入增长略高于40%。\n\n## 关键要点\n\n1. **收入利润**：Q2营收1.270381万亿新台币（+36.0% YoY），净利润7065.62亿元（+77.4%），摊薄EPS 27.25元（+77.4%）。\n2. **美元口径**：季度美元收入402.0亿美元，同比增长33.7%、环比增长12.0%，达到原指引390亿至402亿美元上沿。\n3. **利润率**：毛利率67.7%，营业利润率60.3%，净利率55.6%；ROE年化45.9%，体现先进制程定价和产能利用率优势。\n4. **制程结构**：2nm、3nm、5nm、7nm收入占比分别为3%、30%、33%、11%，7nm及以下先进制程合计77%。\n5. **现金流**：经营现金流7833.6亿元，资本开支4960.0亿元，自由现金流2873.6亿元，仍保持正向现金创造。\n6. **资产负债表**：现金及有价证券3.518万亿元，总负债率30.9%，长期有息债务占资产9.2%，扩产资金安全度较高。\n7. **Q3指引**：美元收入446亿至458亿美元，毛利率65%至67%，营业利润率56%至58%，汇率假设USD/NTD 32.0。\n8. **全年展望**：管理层预计2026年美元收入增长略高于40%，增长由先进制程强劲需求和2nm快速爬坡驱动。\n\n## 关联\n\n- [台积电2Q26业绩与展望综合分析](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 将官方财务与UBS、BNP、JPM、BofA预测进行交叉验证。\n- [台积电UBS 2Q26业绩及毛利率展望](entries/台积电UBS-2Q26业绩及后市毛利率展望.md) — 解释2nm爬坡、海外厂和折旧对未来毛利率的影响。\n- [台积电JPMorgan 2Q26分析](entries/台积电JPMorgan-2Q26业绩与AI算力需求能见度.md) — 补充AI需求可见度与资本支出判断。\n\n## 引用\n\n- [TSMC 2026Q2 SEC Form 6-K](res/台积电/tsmc-2026-q2-official-6k.pdf)\n- [TSMC 2026Q2 Earnings Release](res/台积电/tsmc-2026-q2-earnings-release.pdf)\n- [TSMC 2026Q2 Earnings Presentation](res/台积电/tsmc-2026-q2-presentation.pdf)", "n138": "# 瑞银全球汽车行业巡礼：中国EV与AD供应链的核心发现与机器人机遇\n\n## 摘要\n瑞银在2026年7月的全球汽车日线分析（Pole Position）中总结了对中国新能源车（EV）及智能驾驶（AD）旗舰路演的反馈。在国内新车市场内卷和高压竞争环境下，车企正从单纯的“价格战”转向“密集发布新车型”的内卷竞争。此外，内存芯片（Memory）成本在 Q2 显著上升，导致智能溢价 EV 的制造原材料成本面临 1.0 - 2.0 万人民币的上涨压力。几乎所有中国车商都在将出口作为核心引擎。同时，人形机器人和物理 AI（Physical AI）开始成为零部件供应商（如禾赛、速腾聚创、双环传动）极具商业前景的第二增长曲线。\n\n## 关键要点\n\n- 国内汽车行业竞争策略出现结构性转变，受“反内卷”政策引导，价格摩擦趋缓，车企转向通过加速车型迭代和高频新车发布获取份额。\n- 智能驾驶面临内存芯片缺料和涨价挑战：相比去年，普通车型面临 1-2 千元内存成本通胀，而搭载高级领航辅助（NOA）的智能高端 EV 面临 1-2 万元内存成本上涨，甚至在短期内压制了高级智驾功能（如高阶 NOA）的装车节奏。\n- 出海出口成为行业最重要驱动力，吉利汽车海外月出口量稳定在 10 万辆左右（同比翻倍，占总销量 40%+），广汽与零跑海外也录得三位数高增长；但美欧关税政策地缘风险仍大，三一重工等在欧美重装出口上面临瓶颈。\n- 物理 AI 与人形机器人硬件重构了高端制造的投资赔率，瑞银在巡礼标的中明确给与双环传动（Shuanghuan）、禾赛科技（Hesai）等“买入（Buy）”评级，看好其减速器及激光雷达的机器人第二增长曲线。\n\n## 关联\n- [双环传动QARP分析](entries/shuanghuan-driveline-qarp-analysis-2026-07.md) — 电驱齿轮和机器人精密减速器受益于物理AI浪潮，交叉验证第二增长曲线。\n- [福耀玻璃2Q26前瞻与全球市占率](entries/fuyao-glass-2q26-preview-and-global-market-share.md) — 汽车市场与高附加值零部件出口判断可用于验证玻璃ASP升级。\n\n## 引用\n- [UBS Equities - Pole Position (UBS European & US Autos Daily, 6 July 2026)](res/行业研究-汽车/2026-07-06-UBS-Equities-Pole-Position-European-US-Autos-Daily.pdf)", "n139": "# 万国数据AI驱动数据中心高速增长\n\n## 摘要\n万国数据1Q26业绩强劲——净收入34亿元(+24% YoY)、调整后EBITDA 19亿元(+47% YoY)，大幅beat市场预期。核心催化剂是AI驱动的需求爆发：新增订单200MW(季度新高)，全年目标500MW以上。管理层指引未来三年每年新订单500-800MW，计划投资300-500亿元(CNY30-50bn)支持扩张。Deutsche Bank维持Buy/TP 50美元，Macquarie维持Outperform/TP 64.6美元，JPMorgan(Not Rated)强调3年总预订目标强劲。\n\n## 关键要点\n\n- 1Q26新增200MW订单，YTD达340MW(含超大规模客户130MW+)，管理层预期年化500-800MW可持续\n- 土地储备扩至~4GW(从3GW)，过去15个月启动约400MW新建设\n- 三年资本开支300-500亿元，约60%以新增债务融资，净负债/EBITDA峰值5-6x\n- 月服务收入(MSR)同比降~4%，但调整后毛利率稳定在10-11%，新项目开发成本降至~$3mn/MW\n- 管理层预期2027年入驻面积YoY翻倍、2H27起收入加速增长\n\n## 关联\n- [隆基绿能BC技术分析](entries/隆基绿能BC技术转型分析.md)\n- [工业富联AI服务器分析](entries/工业富联AI服务器分析.md)", "n140": "# 三星电子：存储能见度延伸至2027年，代工提前盈亏平衡\n\n**报告来源：** BNP Paribas（2026-04-30）\n\n## 描述\nBNP Paribas于2026年4月30日发布三星电子1Q26业绩点评。1Q26实现创纪录季度营收134万亿韩元（环比+43%），营业利润57万亿韩元（环比+185%），受益于存储超级周期。DRAM/NAND ASP环比暴涨低90%/高80%。上调2026/27/28E EPS 81%/33%/15%，目标价从28.1万韩元上调至30万韩元（SOTP估值）。评级Outperform。\n\n## 摘要\n三星电子1Q26创历史新高，存储超级周期是主要驱动力。常规DRAM利润率首次超越HBM，因季度合约价在供应紧张中上涨速度快于HBM年度合约。三星在HBM4E、SOCAMM2、PCIe Gen6 SSD等新产品保持技术领先。代工业务1Q实现>10%同比增长，获关键硅光子项目，预计2027年初盈亏平衡，受益于4nm高利用率（HBM4基础晶粒）和Gen2 2nm移动产品量产。泰勒厂设备已搬入，2026年运营2027年量产，有望拓展美国客户群。MX部门重夺全球智能手机第一，但利润率因元件成本上涨承压。\n\n## 关键要点\n\n- **1Q26创纪录**：营收134万亿韩元（+43% QoQ），营业利润57万亿韩元（+185% QoQ）\n- **常规DRAM利润率超HBM**：季度合约价上涨快于HBM年度合约，三星常规DRAM敞口更大\n- **存储能见度延伸至2027年**：供应持续紧张，三星作为最大DRAM/NAND供应商受益最大\n- **代工加速盈亏平衡**：4nm高利用率+2nm量产推动，预计2027年初达成\n- **泰勒厂战略**：设备已搬入，2027年量产，有望拓展美国客户基础\n- **目标价30万韩元**：SOTP估值，2027E P/E 8.5x/P/B 2.1x，评级Outperform\n- **新产品领先**：HBM4E样品出货、SOCAMM2认证、PCIe Gen6 SSD等\n\n## 标签\n三星电子, 005930, 存储器, DRAM, NAND, 代工, HBM, analysis-dimension:财报分析, time:2026Q2\n\n## 关联\n- [美光FQ3:26业绩预览](entries/美光FQ3-26业绩预览.md)", "n141": "# 中通快递1Q26超预期+反内卷持续\n\n## 摘要\n中通快递1Q26业绩全面超预期，收入+22% YoY（vs一致预期18%），核心盈利增速与收入一致，但政府补贴减少拖累adj NP仅+5%。关键亮点：市场份额+1.4ppt至行业最高，ASP +Rmb0.11（KA客户贡献+Rmb0.18 lift），运输成本-Rmb0.04/件。三家大行（JPM OW, MS OW, UBS Buy）一致看好，认为反内卷政策持续+行业竞争格局改善下，中通\"质量优先\"策略正在验证——MS第三次上调盈利预测，2026/27E adj NP +5.4%/+5.3%；UBS也上调ASP假设后EPS +4%。阿里减持消息（9%持股）导致股价 -3%被三家券商一致视为买入机会，预计近期恢复回购（剩余US$8亿额度，~8% shareholder return）。\n\n## 关键要点\n\n- 1Q26收入+22% YoY至Rmb147亿，adj NP ~Rmb20亿（+5% YoY），排除政府补贴影响后增速与收入一致\n- 市场份额+1.4ppt（至行业最高），ASP +Rmb0.11（KA +Rmb0.18 vs 激励 -Rmb0.09），运输成本-Rmb0.04、分拣-Rmb0.02\n- 反内卷政策持续（生产大省执行趋严、落后地区收紧），行业竞争从\"价格战\"转向\"品质竞争\"\n- 阿里减持公告（9%股权、终止投资者权利协议）为情绪扰动而非基本面恶化——近期有望恢复回购\n- MS 2Q26预测：adj NP ~Rmb29亿（同比+40%），低基数效应显著\n- 全年指引维持10-13%件量增长，但偏向低端；4月行业低个位数增长下中通仍保持teens增速\n- 零售/逆向物流成为新战略杠杆：零售件量+65% YoY（抖音日件量~700万，占比~50%）\n\n## 关联\n- [泡泡玛特多空观点：增长放缓与平台价值之争](entries/泡泡玛特多空观点-增长放缓与平台价值之争.md) — 同为消费相关标的，中通受益于电商物流结构性增长和竞争格局改善", "n142": "# 中际旭创1Q26超预期：1.6T推动利润率上行，能见度超越2027年\n\n**报告来源：** BofA Global Research（2026-04-16）\n\n## 描述\nBofA于2026年4月16日发布中际旭创1Q26业绩点评。1Q净利润¥57.35亿（+57% QoQ，+262% YoY），超BofA预期24%/共识31%。营收¥195亿（+47% QoQ，+192% YoY）证明1.6T已开始放量。毛利率达46.1%（+1.6pp QoQ，+9.4pp YoY），产品组合足以抵消组件价格上涨和年度降价。上调2026-28E盈利23-29%，目标价¥1,100（30x 2H26-1H27E P/E），重申买入。\n\n## 摘要\n中际旭创1Q26业绩大幅超预期，1.6T/SiPh产品开始规模放量。1.6T（SiPh）毛利率预计达55-60%，随1.6T出货量环比提升，预计2H26利润率进一步扩张。公司通过预付款锁定关键组件供应，展现了强大的采购能力，缓解市场对组件供应的担忧。BofA模型显示2025-28E盈利CAGR达78%，2026E/27E/28E净利润¥338亿/¥508亿/¥607亿，营收¥1,048亿/¥1,478亿/¥1,756亿。\n\n## 关键要点\n\n- **1Q26大超预期**：净利润¥57.35亿（+262% YoY），超共识31%\n- **1.6T放量**：营收¥195亿（+192% YoY），证明1.6T光模块规模出货\n- **毛利率持续扩张**：46.1%（+9.4pp YoY），1.6T/SiPh毛利预计55-60%\n- **采购能力强大**：预付款锁定关键组件供应\n- **盈利上调23-29%**：2026E净利¥338亿，2027E ¥508亿，2028E ¥607亿\n- **目标价¥1,100**：30x 2H26-1H27E P/E，历史均值+1SD\n\n## 标签\n中际旭创, 300308, 光模块, 1.6T, SiPh, AI, analysis-dimension:财报分析, time:2026Q2\n\n## 关联\n- [中际旭创：多重增长驱动-AI光网络升级](entries/中际旭创多重增长驱动-AI光网络升级.md)", "n143": "# 中际旭创上调PO至¥1,650：全栈光学供应商受益于更强周期\n\n**报告来源：** BofA Global Research（2026-06-09）\n\n## 描述\nBofA于2026年6月9日再次上调中际旭创目标价至¥1,650（25x 2027E P/E），此前为¥1,100（30x 2H26-1H27E P/E）。上调2026-28E盈利16-70%，预计1.6T/NPO在2027年贡献~68%/~14%收入。预计1.6T需求在2027年更强劲并延续至2028年，NPO需求在2027年清晰可见。每500万个NPO订单可产生¥100亿+盈利。重申买入。\n\n## 摘要\nBofA认为中际旭创作为全栈光学供应商正受益于更强的周期。1.6T需求持续走强并在2027年更强劲，上游供应商订单积压延长为佐证。预计全球1.6T出货量2026/27年达20mn/56mn单位，中际旭创维持>40%份额。NPO需求在2027年日益清晰，预计不止一家CSP将NPO部署在规模化系统中。2.4T Coherent-Lite解决方案（可能由谷歌部署）表明高价值相干光解决方案正在从scale-out向scale-up架构扩展。中际旭创是少数中国供应商之一，有望受益于与谷歌的深度合作关系。\n\n## 关键要点\n\n- **目标价大幅上调**：¥1,650（25x 2027E P/E），此前¥1,100\n- **盈利上调16-70%**：2026E净利¥392亿，2027E ¥733亿，2028E ¥1,035亿\n- **1.6T/NPO占比**：2027年1.6T占收入68%，NPO占14%\n- **全球1.6T出货量**：2026E 20mn单位，2027E 56mn单位\n- **NPO大单潜力**：每500万NPO订单=¥100亿+盈利\n- **Coherent-Lite机会**：谷歌2.4T方案可能成为2027-28新增长点\n- **62%盈利CAGR**（2026-28E）\n\n## 标签\n中际旭创, 300308, 光模块, 1.6T, NPO, Coherent-Lite, AI, analysis-dimension:估值重估, time:2026Q2\n\n## 关联\n- [中际旭创1Q26超预期：1.6T推动利润率上行](entries/中际旭创1Q26超预期1-6T推动利润率上行.md)\n- [中际旭创：多重增长驱动-AI光网络升级](entries/中际旭创多重增长驱动-AI光网络升级.md)", "n144": "# 中际旭创：多重增长驱动——AI光网络1.6T/3.2T/NPO/CPO延伸AI上行周期\n\n**报告来源：** Nomura（2026-04-16）\n\n## 描述\nNomura于2026年4月16日发布中际旭创深度报告，认为1.6T/3.2T收发器、NPO和CPO将延伸AI上行周期。1Q26业绩强劲（营收/盈利环比+47%/+57%），1.6T收发器成为关键增长驱动。上调FY26-27F全球1.6T出货量预测至26mn/60mn单位（此前20mn/34mn），预计公司在100G+收发器市场维持30-35%份额，在1.6T市场>45%。目标价¥1,015（20x FY27F EPS），评级买入。\n\n## 摘要\nNomura认为中际旭创将受益于多年期长期增长：2028年起的3.2T收发器升级以及NPO（近场封装光学）和CPO（共封装光学）的业务扩展。1.6T/SiPh产品出货推动毛利率持续改善。公司作为全球高端光收发器龙头（Light Counting数据），在AI基础设施投资和网络技术升级中获得强劲增长动力。模型显示FY26/27/28F营收¥1,221亿/¥2,045亿/¥2,717亿，净利润¥324亿/¥565亿/¥754亿，显著高于WIND共识。\n\n## 关键要点\n\n- **1.6T出货量大幅上调**：FY26F 26mn单位，FY27F 60mn单位（此前34mn）\n- **800G出货量下调**：FY26F 34mn单位，FY27F 50mn单位（此前43mn/58mn）\n- **市场份额领先**：100G+市场30-35%，1.6T市场>45%\n- **SiPh推动毛利率**：产品升级支撑利润率持续扩张\n- **目标价¥1,015**：20x FY27F EPS ¥50.87\n- **3.2T/NPO/CPO布局**：延伸AI上行周期至2028年之后\n- **风险**：AI需求放缓、竞争加剧、ASP侵蚀超预期、CPO替代风险\n\n## 标签\n中际旭创, 300308, 光模块, 1.6T, SiPh, NPO, CPO, AI, analysis-dimension:行业展望, time:2026Q2\n\n## 关联\n- [中际旭创1Q26超预期：1.6T推动利润率上行](entries/中际旭创1Q26超预期1-6T推动利润率上行.md)\n- [中际旭创上调PO至¥1,650：全栈光学](entries/中际旭创上调PO至1650全栈光学供应商.md)", "n145": "# 云计算经济性基准显示微软云兼具回报韧性与估值吸引力\n\n## 摘要\n汇丰以资产周转率、利润率、投入资本回报率、剩余履约义务及三类估值倍数横向比较五家云基础设施商，结论是微软云和谷歌云拥有最佳风险调整后定价。微软云二〇二七年投入资本回报率约14.6%，明显高于甲骨文云6.7%和核心编织4.7%，且二〇二八年扣除股权激励后的企业价值与经营利润比率仅14.1倍，低于亚马逊云18.2倍与核心编织27.0倍。通用云软件与服务提高资产周转和利润率，微软AAA信用、近净现金状态及约3.4年履约义务覆盖则降低再融资和续租风险。主要反面因素是开放人工智能与安索匹克合计约占微软云相关剩余履约义务46%，资本开支激增与客户集中使账面订单并非无风险收入。\n\n## 关键要点\n- 汇丰估算二〇二七年微软云投入资本回报率为14.6%，介于亚马逊云18.9%和谷歌云16.0%之后，但远高于甲骨文云6.7%及核心编织4.7%；通用计算和软件服务占比更高，是回报差异的结构性来源。\n- 微软云经营利润率被估算长期维持约40%，二〇二七年资产周转率约36.4%；核心编织同期利润率仅14.2%、资产周转率25.8%，说明纯图形处理器租赁更商品化且资本效率更弱。\n- 微软云收入估算由二〇二五年886.7亿美元增至二〇二七年1927.5亿美元，二〇二六及二〇二七年同比增长分别约48.2%和42.4%；扣除股权激励后的经营利润二〇二五至二〇三〇年复合增速约39.3%。\n- 为支持增长，微软资本开支预计从二〇二五年1180亿美元升至二〇二六年1757亿美元和二〇二七年2388亿美元，增速分别约48.9%与35.9%；高回报率与强资产负债表使扩张仍具经济合理性，但自由现金流短期承压。\n- 订单期限兼顾可见度与灵活性：微软云相关剩余履约义务约5381亿美元，相当于未来十二个月云收入约3.4年；亚马逊仅2.5年，核心编织6.4年，甲骨文18.8年，过短意味着续租风险，过长则可能包含远期履约与融资负担。\n- 企业价值与经营利润法显示，微软云二〇二八年隐含倍数14.1倍，较亚马逊云18.2倍折价约23%，也远低于核心编织27.0倍；其二〇二六年29.7倍看似较高，但盈利增长令倍数快速消化。\n- 企业价值与剩余履约义务比率方面，微软云为2.87倍，高于甲骨文0.45倍与核心编织0.92倍；这不是单纯昂贵，而是市场为更高利润率、执行能力和低融资风险支付溢价。\n- 企业价值与净物业设备比率方面，微软云约6.1倍、为样本最高，反映同一资产基础能产生更高利润；因此不能只凭资产倍数把核心编织3.4倍判断为便宜，低资产估值可能对应低回报和高资本成本。\n- 汇丰估算开放人工智能公司占微软总剩余履约义务约42%，安索匹克约占4%，两者合计46%；大型私营模型公司的融资与流动性若恶化，订单推迟、重谈或坏账会显著影响增长可见度。\n- 微软的客户预收款约757亿美元，占总物业设备17.5%，比例接近核心编织18.1%；但报告判断其中多数来自非云业务，加上AAA评级和约4.4%的五年期美元债收益率，微软并不依赖预收款为资本开支融资。\n- 财务风险明显低于新云和甲骨文：微软二〇二七年净债务与非通用会计准则经营利润比率约为零，而核心编织约17.8倍、甲骨文约3.6倍；高利率或融资窗口关闭时，微软持续扩产能力更强。\n- 估值拆分依赖假设：汇丰将微软非云业务估值设为约2.10万亿美元、相当于二〇二七年扣除股权激励后经营利润16倍，由此推得云业务企业价值约1.55万亿美元；若非云业务合理倍数变化，云业务隐含估值也会反向变化。\n\n## 关联\n- [微软三季度财报速览：Azure加速与智能助手起飞](entries/MSFT-FQ3-26-财报速览-Azure加速-Copilot起飞-BNP-Paribas-HSBC-UBS综合.md) — 提供Azure最新增速、资本开支和商业化数据锚点。\n- [微软三季度资本开支、Azure加速与定价转型](entries/MSFT-FQ3-26-深度分析-Capex飙升-Azure加速与定价模式转型-UBS.md) — 补充资本开支上修、自由现金流压力及定价模型变化。\n- [微软人工智能基础设施货币化仍处周期早期](entries/MSFT-AI基础设施货币化-仍处AI周期早期阶段-Morgan-Stanley-5-27.md) — 解释高资本投入为何仍可能产生长期收入与利润回报。\n\n## 引用\n- [汇丰：云计算经济性基准、风险与估值差异](res/微软/2026-08-06-MSFT.OQ-HSBC Global Investme-Cloudnomics Benchmarking analysis reveals risk and valuation...-123655744.pdf)", "n146": "# 伯恩斯坦：AI电力狂潮下，这次燃气轮机周期和2000年不一样\n\n## 摘要\n\n伯恩斯坦2026年6月18日发布90页研报《Powering AI: Mapping the gas turbine supply stack》，核心结论：本轮燃气轮机产能扩张以棕地复活（brownfield de-mothballing）为主，而非2000年代的绿地新建，周期退可守、进可攻。全球燃气轮机产能从2025年64GW增至2030年约109GW（+60%），三大厂贡献约75%增量。AI数据中心电力需求2025-2030年全球新增20-34GW/年，美国占比>60%，燃气发电满足约50%，三大厂订单中数据中心占比20-30%。真正的风险不是总量过剩，而是结构性错配——中小机组和备用电源可能过剩，重型燃气轮机（HDGT）到2030年仍是紧俏货（缺口23.6GW），而IGT&Aero从2027年起过剩18.8GW。三大厂Backlog已排至2028年，HDGT交付周期3-5年，价格战很难打起来。Turbine价格2023年以来+50%，美国CCGT单位造价$1,400/kW→$2,200/kW（+50%），供应链瓶颈（高温合金叶片）反而成为OEM定价权护城河。服务市场是真正现金牛：全球现役燃气轮机约2,100GW，每GW装机≈4亿欧元全生命周期服务收入，利润率远高于设备销售。\n\n## 关键要点\n\n\n- **棕地复苏 vs 绿地新建**：本轮周期以棕地复产、产线优化为主，退出成本极低；2000年代是绿地新建工厂，沉没成本高。棕地扩张的好处是灵活性极高——需求好就开机，需求差就再mothball\n- **全球产能扩张路径**：2025年64GW → 2030年109GW（+60%）。西门子能源翻倍至31GW（重启停用6年的Charlotte工厂），GE Vernova从16GW→24GW（Belfort/Greenville班次优化），三菱重工2028年先扩30%\n- **AI数据中心电力需求**：2025-2030年全球新增20-34GW/年，美国>60%，燃气发电满足约50%，三大厂订单中数据中心占比20-30%。非AI需求同样强劲：工业回流、油气开采、电动车充电等推动美国电力增速达2.5%+\n- **结构性错配而非总量过剩**：HDGT 2025年缺口38.6GW，2030年缺口23.6GW，持续供不应求；IGT&Aero 2027年起过剩18.8GW。三大厂产能结构中HDGT占68%，IGT&Aero仅占29%\n- **订单能见度与定价权**：GE Vernova燃气轮机合同量12个月翻倍50GW→100GW，西门子能源Backlog 87GW（+75% YoY）。2028年生产槽位基本卖光，HDGT交付周期3-5年。Turbine价格+50%，GE Vernova 2026H1新签订单再贵10-20个百分点\n- **供应链瓶颈成护城河**：高温合金叶片/导叶由Howmet主导（市占率>50%），垂直整合模式（铸造→涂层→机加工全自营）导致产能扩张慢，反而锁定OEM定价权\n- **服务市场是现金牛**：全球现役燃气轮机约2,100GW（GE Vernova近1,000GW，西门子约480GW）。西门子每GW装机≈4亿欧元全生命周期服务收入，基荷机组占比从50%→80%+。GE Vernova HDGT服务合同>50%剩余期限在15年以上\n- **A股映射——主机厂**：东方电气是国内重型燃机最硬核标的（G50→H级突破），叠加电网设备高景气，与西门子能源\"电网+燃机\"双轮驱动逻辑共振。上海电气、哈尔滨电气弹性较弱\n- **A股映射——核心零部件**：应流股份是高温合金叶片+精铸件龙头，直接对标Howmet。图南股份、钢研高纳是高温合金材料\"卖铲子\"逻辑。航发动力技术同源性但军用为主\n- **A股映射——电网设备**：平高电气、中国西电、许继电气受益于特高压及电网设备全球建设周期共振。GE Vernova将电网业务视为\"质量复合增长器\"（quality compounder）\n\n## 关联\n\n（待补充）\n- [万国数据AI驱动数据中心分析](entries/万国数据AI驱动数据中心分析.md) — 万国数据 — AI电力需求关联\n- [JPMorgan-AIDC储能系统参考架构-早期订单指向需求爆发](entries/JPMorgan-AIDC储能系统参考架构-早期订单指向需求爆发.md) — AIDC储能 — 电力基础设施关联", "n147": "# 华泰证券科技行业深度：AI Agent加速有望驱动算力通胀持续\n\n**来源**: 行业研究-计算机 | **机构**: huatai-securities\n\n## 摘要\n\n华泰证券认为AI Agent加速落地将推动算力需求持续高增长。\nAgent应用对算力的消耗远高于传统AI应用，带来算力通胀效应。\n中国算力产业链（服务器、光模块、液冷）有望持续受益。\n\n## 关键要点\n\n\n- AI Agent推理算力需求是传统AI应用的5-10倍\n- 2026年中国AI算力市场规模预计同比增长60%+\n- 国产AI芯片在推理场景中加速渗透\n- 算力租赁和MaaS(Model-as-a-Service)模式兴起\n- 液冷散热渗透率快速提升，2026年有望达30%\n- 推荐中际旭创、工业富联等算力基础设施标的\n\n## 关联\n\n- 行业: tech-industry\n- 机构: huatai-securities\n- 主题: ai-agent-computing\n- 相关: 中际旭创, 工业富联, liquid-cooling\n\n- [华泰证券资产配置月报：AI链行情进入新阶段](entries/华泰证券资产配置月报-AI链行情进入新阶段.md) — 同机构华泰证券AI/科技研究系列\n- [JPMorgan中国AI应用调研：从模型竞赛到应用落地的转折点](entries/JPMorgan中国AI应用调研-从模型竞赛到应用落地的转折点.md) — 同主题：中国AI应用落地进展\n- [MSFT 跟进分析：Copilot起飞在即，Azure 40%+增长可持续 (BNP Paribas 5/26)](entries/MSFT-跟进分析-Copilot起飞在即-Azure-40-增长可持续-BNP-Paribas-5-26.md) — 同主题：AI Agent/Copilot产品进展", "n148": "---\ntype: Analysis\ntitle: 华泰证券腾讯1Q26前瞻：AI布局和云业务迎来拐点，维持买入\ndescription: 华泰证券预计腾讯1Q26营收+11%/经调整净利+10%，AI Agent赛道迎拐点(龙虾产品矩阵升级/云提价/混元3.0发布)，SOTP目标价716港元，预计26年营收8410亿\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/腾讯控股/20260410-华泰证券-腾讯控股-0700.HK-AI布局和云业务迎来拐点.pdf\nsource_type: pdf\ntags: [tencent, profit-trend, business-model, 2026-Q1]\n---\n\n# 华泰证券腾讯1Q26前瞻：AI布局和云业务迎来拐点\n\n## 摘要\n华泰证券2026年4月发布腾讯1Q26前瞻报告。预计1Q26营收+11%至2015亿，经调整归母净利润+10%至673亿。核心看点：AI Agent赛道迎来拐点——龙虾(WorkBuddy)产品矩阵持续升级（嵌入微信/企业微信、多Agent协同、Skillhub生态打通），云业务提价+海外扩张驱动增长拐点。混元3.0预计4月上线。维持买入评级，SOTP目标价716港元。\n\n## 关键要点\n\n- 预计1Q26营收+11%（游戏+13%/广告+19%/金融科技+9%），经调整净利+10%至673亿\n- AI Agent赛道迎拐点：龙虾体系化升级，嵌入微信/小程序/企业微信，支持多Agent协同\n- 云业务驱动力：海外亚洲扩张、德国新区2Q26上线、混元API提价、AI算力需求释放\n- 4月将上线混元3.0大模型，建议关注Agent赛道的潜在拐点\n- 《洛克王国：世界》稳居iOS畅销榜前列\n- 26年营收预测8410亿（+12%），经调整净利2830亿（+9%）\n- 目标价716港元（基于SOTP），调整后PE 14.2x\n\n## 关联\n- [申万宏源腾讯深度之三：AI时代核心受益者](entries/申万宏源腾讯深度之三-AI时代核心受益者-超级入口与生态壁垒的再进化.md) — 申万宏源同样深入分析腾讯AI战略\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 后续业绩验证了基本面\n\n## 引用\n- [华泰证券-腾讯控股AI布局和云业务迎来拐点](res/腾讯控股/20260410-华泰证券-腾讯控股-0700.HK-AI布局和云业务迎来拐点.pdf)\n- [腾讯控股JPM 1Q26：转向更积极，双P&L披露化解AI稀释担忧](entries/腾讯控股JPM-1Q26-转向更积极-双P-L披露化解AI稀释担忧.md) — 共享标签: tencent, 2026-Q1, profit-trend; 同标的: tencent; 共同关键词(8): q2, ai, pdf, 1q", "n149": "# 华泰证券资产配置月报：AI链行情进入新阶段\n\n**来源**: 策略研究 | **机构**: huatai-securities\n\n## 摘要\n\n华泰证券认为AI链行情已从第一阶段进入第二阶段。\n第一阶段以算力硬件为代表的估值修复基本完成。\n第二阶段AI应用和生态建设将成为投资主线。\n\n## 关键要点\n\n\n- AI行情从算力硬件扩散到应用和平台的趋势确认\n- 建议超配AI应用、云计算和智能驾驶方向\n- 低配传统周期板块，关注AI对传统行业的赋能机会\n- 大类资产配置上，权益优于债券，A股优于港股\n- 2026年下半年A股市场有望迎来AI应用商业化催化\n\n## 关联\n\n- 行业: strategy\n- 机构: huati-securities\n- 主题: asset-allocation-april-2026\n- 相关: ai-chain, a-share\n\n- [华泰证券科技行业深度：AI Agent加速有望驱动算力通胀持续](entries/华泰证券科技行业深度-AI-Agent加速有望驱动算力通胀持续.md) — 同机构华泰证券AI/科技研究系列\n- [JPMorgan中国AI应用调研：从模型竞赛到应用落地的转折点](entries/JPMorgan中国AI应用调研-从模型竞赛到应用落地的转折点.md) — 同主题：中国AI产业链投资\n- [Morgan Stanley互联网周报：AI硬件vs软件投资轮动分析](entries/Morgan-Stanley互联网周报-AI硬件vs软件投资轮动分析.md) — 同主题：AI产业链投资轮动", "n150": "# 摩根大通：台积电2026年7月营收符合进度，N3需求与N2爬坡支撑三季度指引\n\n## 摘要\n台积电2026年7月营收达到4,676亿元新台币，同比增长45%、环比增长6%，相当于摩根大通和彭博一致预期三季度收入的约32%，首月进度支持季度收入落在446亿-458亿美元指引的中高端。摩根大通认为数据中心AI需求、先进节点高产能利用率、N3的强劲订单以及N2加速爬坡，是增长延续的主要驱动，而非一次性出货波动。尽管N2量产初期会令三季度毛利率环比下降约1.2个百分点至66.5%，持续提价、先进节点高利用率和良率成熟有望使未来数年毛利率保持在60%中高段。报告维持“增持”评级和3,200元新台币目标价，并预计台积电2026年美元收入增长低40%、2027年再增长30%以上，表明AI算力投资周期仍是核心投资主线。\n\n## 关键要点\n- **月度营收继续高增**：7月收入4,676亿元新台币，同比增加45%、环比增加6%；在高基数下仍录得双位数以上年增，说明AI加速器、CPU及相关先进制程需求没有出现明显降温。\n- **三季度完成度健康**：单月收入已覆盖摩根大通及彭博一致预期三季度收入约32%；若后两个月维持相近节奏，季度收入可达到公司446亿-458亿美元指引的中高端，摩根大通自身预测为455亿美元。\n- **增长由N3与N2接力**：N3受新一代AI加速器和高性能CPU拉动，N2则进入更快爬坡阶段；先进节点持续高利用率，令收入增长具备产品与产能的双重支撑，而不是仅靠汇率或低基数。\n- **AI资本开支可见度延长**：美国云服务商继续表达强劲资本开支意愿，摩根大通判断AI计算基础设施投资周期至少延续至2027年，台积电数据中心AI收入在2024-2029年的复合增速预计约69%，需求可见度延伸至2029-2030年。\n- **短期毛利率受N2稀释**：随着N2初期量产成本与折旧进入损益表，三季度毛利率预计约66.5%，环比下降1.2个百分点；这属于新节点爬坡的阶段性影响，并不代表定价权或先进制程竞争力转弱。\n- **中期利润率仍有韧性**：未来数年毛利率有望维持在60%中高段，支撑来自后续晶圆价格上调、先进节点高利用率，以及N2工艺成熟度和良率逐步改善；N2稀释消退后，利润率趋势仍将缓慢向上。\n- **供给侧投资更积极**：在先进制程和先进封装供需仍显著偏紧的背景下，摩根大通预计台积电2027年、2028年资本开支分别达到810亿、900亿美元，用于加快N2、N3及先进后段产能建设，主动缩小供需缺口。\n- **技术与封装份额稳固**：报告预计台积电在N2/A16节点取得95%以上市场份额；CoWoS产能2026年、2027年分别同比扩张85%和65%，Intel EMIB-T暂不足以构成实质威胁，先进封装仍是AI收入兑现的重要瓶颈与护城河。\n- **全年与次年增长判断积极**：摩根大通预计2026年美元收入增长处于40%低段，2027年仍可增长30%以上；关键催化剂包括云厂商资本开支预期改善、2027年价格谈判进一步上行，以及2027-2028年资本支出计划继续提高。\n- **风险观察点清晰**：需跟踪AI资本开支周期持续时间、2026年下半年PC和智能手机需求，以及N2爬坡造成的毛利率压力；熊本地震虽影响部分苹果影像传感器生产，但台中备援产能预计可补位，对iPhone 18发布时间无实质影响。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析：上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 连接7月营收兑现情况与公司三季度指引、全年40%以上美元收入增长及资本开支上调背景。\n- [BofA：台积电先进节点需求强劲——2026-27资本支出展望上调](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 用于交叉验证先进节点供需、扩产强度和海外产能盈利改善对长期增长的影响。\n- [UBS：台积电US技术研讨会——A13/A12/N2U路线图与AI护城河](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md) — 补充N2后续衍生节点、先进封装和AI技术路线图，解释本次月度营收背后的长期产品基础。\n\n## 引用\n- [J.P. Morgan - TSMC July sales on track; 3Q26 to reach mid-high-end of guidance](res/台积电/2026-08-10-2330.TW-JPMorgan-TSMC July sales on track; 3Q26 to reach mid-high-end of the ...-123739165.pdf)", "n151": "# 瑞银：台积电2026年7月营收完成三季度预估32%，N3增长与N2加速驱动全年高增\n\n## 摘要\n台积电2026年7月营收约4,680亿元新台币，同比增长44.7%、环比增长5.6%，已完成瑞银三季度收入预测的32%，与季度正常线性进度基本一致。瑞银预计三季度收入环比增长15%，并将2026年美元收入增速估计维持在41%，主要动力来自新AI加速器与CPU带动的N3强劲增长，以及N2更快进入量产爬坡。其2026年收入、净利润和摊薄EPS预测分别为5.466万亿元、2.825万亿元新台币和108.96元，显示收入高增同时伴随显著经营杠杆。瑞银维持“买入”评级和3,650元新台币目标价，相对8月10日2,380元股价隐含53.4%价格上行空间，月度数据强化而非改变其长期AI成长判断。\n\n## 关键要点\n- **7月收入符合高增长轨迹**：月营收约4,680亿元新台币，同比增长44.7%、环比增长5.6%；同比增速显著高于成熟半导体周期，反映先进制程需求和AI相关出货仍处于扩张阶段。\n- **季度进度没有缺口**：7月收入相当于瑞银三季度预测的32%，接近一个季度首月应有的完成度；瑞银因此判断三季度环比增长15%的预测仍在轨道上，暂未看到订单延迟或产能利用率转弱的信号。\n- **N3是当期核心增量**：新一代AI加速器和CPU放量推动N3收入强劲增长，高性能计算客户对先进制程的需求继续占据主导；月度营收表现说明AI芯片设计进展正在转化为晶圆代工收入，而非只停留在资本开支预期。\n- **N2提供下一阶段接力**：瑞银将更快的N2爬坡列为2026年增长驱动，意味着先进节点收入组合可从N3平滑延伸至N2；虽然新节点初期可能带来折旧和良率压力，但更快放量有利于扩大收入规模并巩固技术领先。\n- **全年收入预测强劲**：瑞银预计2026年美元收入同比增长41%，新台币口径收入达到5.466万亿元；相较2025年3.809万亿元，预测体现AI需求、先进制程升级与产能扩张共同推动的结构性增长。\n- **盈利增速快于收入**：2026年EBIT、净利润分别预计为3.231万亿元和2.825万亿元新台币，摊薄EPS为108.96元；EBIT利润率预计从2025年的50.8%升至59.1%，显示高利用率和高价值制程组合释放经营杠杆。\n- **中期预测延续上修空间**：瑞银预计2027年、2028年收入分别达到7.677万亿元和10.045万亿元新台币，EPS分别为149.14元和198.23元；两年预测均高于同期市场一致EPS 141.11元和179.70元，体现其更乐观的AI与先进节点判断。\n- **估值仍基于成长兑现**：以8月10日股价2,380元计算，2026年预期市盈率为21.8倍、2027年降至16.0倍；目标价3,650元对应53.4%价格升幅，加预计1.3%股息率后，预期总回报为54.7%，评级维持买入。\n- **资产负债表支持扩产**：瑞银预计2026年末净现金2.736万亿元新台币，并在2028年增至5.712万亿元；强劲现金创造能力可支撑先进节点及海外晶圆厂投资，降低高资本开支周期对财务安全性的约束。\n- **数据边界与风险**：本报告是月度快评，7月单月只验证收入进度，不能独立证明全年利润率；后续需观察N2良率、技术竞争、资本开支效率、终端需求周期及汇率变化，避免把单月同比高增机械外推。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析：上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 提供三季度收入与毛利率指引、全年收入增速及资本开支背景，用于判断7月32%完成度是否合理。\n- [UBS：台积电US技术研讨会——A13/A12/N2U路线图与AI护城河](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md) — 解释瑞银对N2及后续先进节点、CoWoS和AI长期收入增长保持乐观的技术依据。\n- [BofA：台积电先进节点需求强劲——2026-27资本支出展望上调](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 从供需与资本开支角度交叉检验瑞银关于先进节点加速放量及中期收入扩张的预测。\n\n## 引用\n- [UBS Fast Take - Taiwan Semiconductor Manufacturing July sales](res/台积电/2026-08-10-2330.TW-UBS Equities-UBS Fast Take Taiwan Semiconductor Manufacturing _July sal...-123733389.pdf)", "n152": "# 台积电2Q26业绩与展望综合分析：上调资本支出与营收指引\n\n## 摘要\n\n台积电2Q26业绩超预期，营收达指引上限，毛利率升至67.7%。管理层将2026年资本支出指引上调至600亿-640亿美元（此前为540亿-560亿，BNP预测2026-28E累计支出2400亿美元），并将2026年美元营收同比增速指引上调至40%以上（此前为30%+）。尽管2H26受海外建厂及2nm初期量产拖累毛利率将稀释3-4个百分点（3Q26 GPM指引65%-67%），但得益于2027年起先进制程涨价（5%-10%）和产品组合优化，各机构预计毛利率将在2027-28年回升至67%以上。大摩、小摩、美银、瑞银一致重申买入/超配评级，目标价区间上调至3,100-3,650新台币。\n\n## 关键要点\n\n\n- **上调资本支出与营收指引**: 台积电将2026年资本支出由540亿-560亿美元上调至600亿-640亿美元以加速先进制程及CoWoS扩产；同时宣布在亚利桑那州追加1000亿美元投资（总投资达2650亿美元）。2026年美元营收增速指引从30%+上调至40%+。\n- **AI需求高可见度与制程领先**: 伴随大模型迭代，大容量Datacenter AI与Agentic AI CPU需求强劲，AI可见度已延至2029-2030年。台积电N2制程2025底量产，A14制程预计2027年风险量产、2028年量产，预计将维持N2/A16制程95%以上份额。\n- **短期毛利率承压与中长期涨价补偿**: 3Q26营收指引环比增长12%，毛利率指引降至65%-67%（中值低于预期的66.5%），主因2nm陡峭爬坡带来3-4%稀释及折旧增加。但预计2027年初逻辑制程将提价5%-10%，成熟制程提价约5%，可将中长期毛利率平稳维持在67%以上。\n- **估值与评级变动**: 瑞银上调目标价至NT$3,650（21x 2027-28E PE），小摩升至NT$3,200（20x 12m fwd PE），美银维持NT$3,100（20x 2027E PE），法巴升至NT$2,890（22x 2027E PE）。\n- **行业负面扰动因子**: ASML拟对EUV及ArFi光刻机提价约10%，若落地可能给台积电带来约1%毛利率稀释；同时美国CSP资本支出增长中有较大比例被高企的内存价格占据，可能对非内存芯片投资产生挤出效应。\n\n## 关联\n- [BofA：台积电先进节点需求强劲——2026-27资本支出展望上调](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 此前BofA已预判台积电2027年Capex将上调至750亿美元，本次指引上调验证了这一上行趋势。\n- [BofA：台积电产能与技术爬坡斜率更陡——缓解竞争担忧](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md) — 报告中关于N2及3nm产能的领先优势构成了台积电能顺利转嫁成本并实施涨价的核心护城河。\n- [ASML深度分析-High-NA-EUV采用时间线调整](entries/ASML深度分析-High-NA-EUV采用时间线调整.md) — 台积电由于其优异的Low-NA产能和定价权，在High-NA采用上比英特尔、三星更晚，从而有效控制了资本支出初期的折旧压力。\n\n## 引用\n\n- res/台积电/2026-07-16-2330.TW-UBS Equities-Taiwan Semiconductor Manufacturing _Raising capex and US exp...-123208279.pdf\n- res/台积电/2026-07-16-2330.TW-BNP Paribas-TSMC  Higher capex to drive faster growth while SPEMemory ...-123207769.pdf\n- res/台积电/2026-07-16-2330.TW-JPMorgan-TSMC Rising confidence in AI demand, matched by increasing c...-123213157.pdf\n- res/台积电/2026-07-16-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. Benign competitive l...-123212595.pdf", "n153": "# 台积电BNP-2026年Q2业绩点评与资本支出展望\n\n## 摘要\n法巴对台积电2Q26业绩超预期持肯定态度，营收达到指引上限，毛利率实现67.7%。3Q26营收指引环比增长12%，由于2nm初期量产陡峭爬坡及折旧上升，毛利率指引降至65-67%。法巴认为台积电2026-28年将步入涨价补偿期，复合提价率达高双位数。预计2026-28E累计资本支出将加速至2400亿美元（N2与A14制程至2027年达140k与210k wpm，CoWoS达113k与175k wpm），维持Outperform评级，上调目标价至NT$2,890。\n\n## 关键要点\n\n- **业绩与资本支出加速**：2Q26营收402亿美元，毛利率67.7%超预期。法巴预计2026-28E累计资本支出将达到约2400亿美元，加速先进制程及CoWoS在台美的产能布局。\n- **技术成熟度与定价权**：到2027年，3nm及以下先进制程产能将达47% CAGR，CoWoS产能达175k wpm。N2/A14量产推进将驱动2026-28E售价高双位数CAGR上升。\n- **GPM稀释担忧受控**：2H26毛利率受2nm及海外厂爬坡拖累，折旧摊销大幅增长，但提价策略将把2027-28年GPM环比稀释控制在1%左右。\n- **ASML与供应链潜在摩擦**：ASML拟对EUV和ArFi光刻机提价10%将使台积电面临约1%的额外毛利率稀释压力。\n- **高内存价格挤出效应**：法巴估算2026年AI存储TAM将达5000亿美元，若高内存价格持续可能对非内存AI芯片需求产生挤出效应。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析-上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 综合对比法巴与其他三家大行对2Q26业绩指引及资本支出的看法。\n- [台积电BNP-技术路线图-A13更新-重申Outperform](entries/台积电BNP-技术路线图-A13更新-重申Outperform.md) — 法巴前期对台积电A13/A12技术节点推进的底座分析。\n\n## 引用\n- [BNP Paribas - TSMC Higher capex to drive faster growth](res/台积电/2026-07-16-2330.TW-BNP Paribas-TSMC  Higher capex to drive faster growth while SPEMemory ...-123207769.pdf)", "n154": "# BNP Paribas：台积电推出A13并更新技术路线图\n\n## 摘要\nBNP Paribas（分析师Alex Chang）在台积电2026年北美技术研讨会后发布快评。关键发布包括A13制程（2029年HVM，A14光学缩小版，面积节省6%，完全向后兼容）、A12预览（Super Power Rail背面供电，针对AI/HPC）、N2U（2028年HVM，相比N2P速度提升3-4%或功耗降低8-10%，逻辑密度提升1.02-1.03x）。先进封装方面，CoWoS扩展至14-reticle尺寸（可容纳10个大型计算芯片+20个HBM堆栈），A14-to-A14 SoIC 3D堆叠（IO密度提升1.8x），COUPE硅光子（2x能效提升，10倍延迟降低）。维持Outperform评级，目标价TWD2,520/USD478。\n\n## 关键要点\n\n- A13（2029年HVM）：A14光学缩小，面积节省6%，完全向后兼容，降低客户tape-out成本，支持快速迁移\n- A12（2029年HVM）：A14平台增强版，Super Power Rail背面供电，针对AI/HPC应用，实现高端市场细分\n- N2U（2028年HVM）：2nm平台进一步演进，相比N2P速度+3-4%或功耗-8-10%，逻辑密度提升1.02-1.03x，为AI/HPC/移动应用提供成熟选择\n- CoWoS扩展：14-reticle尺寸（2028年），可集成10个大型计算芯片+20个HBM堆栈，解决AI集群瓶颈\n- SoIC 3D堆叠（2029年HVM）：A14-to-A14堆叠，die-to-die IO密度相比N2-to-N2提升1.8倍\n- COUPE硅光子：2倍能效提升，10倍延迟降低（机架间数据传输）\n- N2A汽车级：首次将纳米片带入汽车领域，2028年完成认证，比N3A速度提升15-20%\n- 投资观点：Foundry 2.0下TAM翻倍以上，支持约24%的2025-28E营收CAGR；美国投资US$165b缓解关税风险但长期稀释利润率\n\n## 关联\n- [UBS US技术研讨会（2026-04-23）](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md)\n- [BofA产能与技术爬坡（2026-05-15）](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md)\n\n## 引用\n- [BNP Paribas - TSMC debuts A13](res/台积电/2026-04-24-2330.TW-BNP Paribas-TSMC  TSMC debuts A13 and updates tech roadmap-121610129.pdf)\n- [UBS：台积电US技术研讨会——A13/A12/N2U路线图与AI护城河](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md) — 共享标签: A12, technology-roadmap, advanced-packaging; 同标的: A12, technology-roadmap; 共同关键词(11): 积电, 2026, 路线, to", "n155": "# 台积电BofA-2026年Q2业绩与供需景气度评估\n\n## 摘要\n美银评台积电2026年Q2业绩，指出极佳的竞争格局和前沿制程持续供不应求是其长期增长的基石。美银预计台积电美元营收在2026年同比增速将超40%，4Q26受Apple和AMD陡峭的2nm订单以及GPU/ASIC的3nm更新需求拉动，环比将增超11%。为支持AI算力扩张，台积电将2026年资本支出上调至600亿-640亿美元。美银重申买入评级，维持NT$3,100目标价，认为目前17x 2027E PE仍极具性价比。\n\n## 关键要点\n\n- **极其良性的竞争格局**：即使英特尔和三星提供部分替代方案以填补市场先进封测及制程的供需缺口，台积电依然保有超90%的先进制程市场份额和绝对定价权。\n- **2nm与3nm需求强劲**：随着大模型迭代和AI加速器升级，美银预计台积电3nm及以下制程前沿产能从2025-28年将以47% CAGR的增速增长。\n- **三季度及下半年毛利率指引**：3Q26毛利率指引中值为66%±1%，虽受2nm初期爬坡及海外厂折旧的压制，但其在产能利用率和议价上的优势对冲了折旧风险。\n- **中长期盈利预测上调**：美银上调2026/27/28年EPS预测至NT$110.2/153.2/182.0，认为2024-29年营收将以33% CAGR快速成长，高于管理层指引的25%。\n- **海外盈利与估值重构**：亚利桑那州新承诺的100亿美元（累计2650亿美元）投资有利于巩固其与美国核心 hyperscaler 的长期合作关系。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析-上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 分析美银观点与台积电综合财务指引的一致性。\n- [台积电BofA-先进节点资本支出-Arizona盈利改善](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 美银在此前研报中对台积电先进制程在美设厂毛利走势的分析。\n- [台积电BofA-产能与技术爬坡-缓解竞争担忧](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md) — 补充美银前期针对技术节点量产良率和市场竞争的评估。\n\n## 引用\n- [BofA Global Research - TSMC Benign competitive landscape & industry short supply](res/台积电/2026-07-16-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. Benign competitive l...-123212595.pdf)", "n156": "# BofA：台积电产能与技术爬坡斜率更陡——缓解竞争担忧\n\n## 摘要\nBofA（分析师Haas Liu）在台积电台湾技术研讨会后发布报告，强调5nm和3nm的大规模产能（3nm 4Q26达190k WPM、2027年达230k WPM，远高于三星SF3或Intel 18A的20-25k WPM）限制了客户流失风险。N2作为首个纳米片节点，缺陷密度已达目标水平，比3nm同阶段领先2个季度。CoWoS良率已达98%+（5.5x reticle）。维持买入评级，目标价NT$2,560（20x 2027E PE），当前股价NT$2,270。\n\n## 关键要点\n\n- 5nm/3nm产能优势：台积电目标2022-2027年5nm和3nm产能CAGR达25%，设备共通性和AI驱动的生产力提升使产能高效转换\n- 3nm产能规模：预计4Q26达190k WPM，2027年达230k WPM；对比三星SF3或Intel 18A仅20-25k WPM且良率低\n- N2首次采用纳米片：缺陷密度已达目标水平，比3nm同阶段领先2个季度；N2家族2026-2028产能CAGR达70%\n- N2首年爬坡：比3nm多45%产能，同时推出5座晶圆厂，技术转移时间减少20%\n- N2/A16利润率：良率曲线优于3nm，预计享有更好的利润率（3nm约11个季度才到公司平均GM）\n- CoWoS产能：2022-2027年CoWoS产能CAGR达80%，SoIC达90%；技术升级时间减少30%（CoWoS）和75%（SoIC）\n- CoWoS良率：5.5x reticle良率已达98%+，2029年将推出14x+ reticle方案\n- 财务预测：2026E营收NT$5.24兆，净利润NT$2.57兆；2027E营收NT$6.68兆，净利润NT$3.32兆\n\n## 关联\n- [UBS US技术研讨会（2026-04-23）](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md)\n- [BofA资本支出报告（2026-05-17）](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md)\n\n## 引用\n- [BofA - Strong capacity and tech ramp](res/台积电/2026-05-15-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. Strong capacity and ...-122056887.undefined.pdf)", "n157": "# BofA：台积电先进节点需求管道强劲——2026-27资本支出展望上调\n\n## 摘要\nBofA在台积电董事会批准US$31bn资本拨款后发布报告，指出资本支出正加速向先进制程前端倾斜（LTM 53% vs 2024-25年的37%）。基于对GPU、ASIC、x86/ARM服务器CPU和网络交换机的WPY需求测算，2026年资本支出有望达到公司指引的US$56bn，2027年更可能升至US$75bn（vs BofA/市场预估US$63bn/US$65bn）。亚利桑那州晶圆厂1Q26实现NT$39bn营收和NT$19bn净利润，剔除政府补贴后营业利润率约45%，远超预期。维持买入评级，目标价NT$2,560（20x 2027E PE）。\n\n## 关键要点\n\n- 资本拨款规模：台积电董事会批准US$31bn资本拨款，重点用于先进制程前端产能和晶圆厂建设\n- 资本支出结构变化：前端扩产占比升至53%（LTM，vs 2024-25年的37%），设施/洁净室占比降至39%（vs 50%）\n- 2026-27资本支出预测：2026年US$56bn（符合指引），2027年可能达US$75bn（vs BofA预估US$63bn/市场US$65bn）\n- 亚利桑那州运营显著改善：1Q26营收NT$39bn，净利润NT$19bn（vs 2025全年NT$67bn营收/NT$16bn净利润）\n- 亚利桑那利润率：剔除政府补贴后1Q26营业利润率约45%，虽低于公司OpMs 58%，但稀释程度好于预期\n- 毛利率扩张逻辑：HPC应用强劲需求+高端移动芯片组，使台积电能更好反映技术领先价值\n- 财务预测：2026E营收NT$5.24兆，资本支出NT$1.78兆；2027E营收NT$6.68兆，资本支出NT$1.98兆\n\n## 关联\n- [BofA产能与技术爬坡（2026-05-15）](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md)\n- [BofA AGM更新（2026-06-04）](entries/台积电BofA-股东大会AI需求与技术执行.md)\n\n## 引用\n- [BofA - Strong advanced node demand pipeline](res/台积电/2026-05-17-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. Strong advanced node...-122084481.undefined.pdf)", "n158": "# BofA：股东大会更新——AI驱动的强劲需求与技术执行支撑营收/毛利率展望\n\n## 摘要\nBofA在台积电2026年6月4日年度股东大会后发布报告，重申买入评级和NT$2,560目标价（20x 2027E PE）。管理层在股东会上表达了高度信心：1）对2030年前的营收可见度高度乐观，AI、EV和机器人应用持续扩展；2）56%+长期毛利率指引保持不变；3）N2结构性利润率将优于N3，且N3利润率仍在改善中。会议还讨论了竞争格局，Intel位列台积电前十大客户，合作关系将继续。台积电未考虑股票分割或回购。\n\n## 关键要点\n\n- AI需求高度乐观：管理层对2030年前增长可见度充满信心，AI、EV和机器人应用推动需求扩张\n- AI瓶颈：AI导致的瓶颈贯穿电力、芯片、设备和上游供应链，台积电正全力以赴满足需求\n- 资本支出展望：未来数年资本支出将持续增长，台湾仍为主要生产基地，同时推进海外扩张\n- 定价策略：反映更高效的产出价值，同时与客户保持可持续合作关系，而非机会主义定价\n- 毛利率指引：56%+长期GM指引不变；N2结构性利润率将优于N3，N3利润率仍在改善中\n- 竞争格局：先进制程路线图和先进封装规模控制竞争风险；Intel是台积电前十大客户，合作继续\n- CoPoS进展：目前试产中，2-3年内准备就绪量产\n- 出售VIS股份：因产业布局考虑出售世界先进（VIS）股份，但技术合作关系不变\n- 股票回购/分割：目前不考虑股票分割或回购\n- R&D承诺：持续推进先进制程路线图，保持对三星、Intel乃至Terafab的竞争优势\n\n## 关联\n- [BofA资本支出报告（2026-05-17）](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md)\n- [BofA产能与技术爬坡（2026-05-15）](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md)\n- [UBS五月销售额（2026-06-10）](entries/台积电UBS-5月营收4170亿-Q2稳步推进-目标价上调至3000.md)\n\n## 引用\n- [BofA - AGM update solid AI-centered demand](res/台积电/2026-06-04-2330.TW-BofA Global Research-Taiwan Semiconductor Manufacturing Co. AGM update solid AI...-122413976.undefined.pdf)", "n159": "# 台积电JPMorgan-2026年Q2业绩与AI算力需求能见度\n\n## 摘要\n小摩对台积电2Q26业绩公布后的中长期前景表达了强烈信心，指出数据中心AI需求可见度已延伸至2029-30年（基于客户部署大模型及硬件路线图），并预计台积电在先进制程上的护城河（产能、生态、IP准备度）将继续对英特尔和三星保持碾压。小摩上调2026/27/28年资本支出至620亿/810亿/900亿美元以应对供应短缺。重申Overweight评级，上调目标价至NT$3,200（20x 12m Fwd PE）。\n\n## 关键要点\n\n- **AI可见度提升至2029-30年**：数据中心加速器和新型 agentic AI CPU 需求极为强劲。小摩预测2024-29E台积电数据中心AI相关营收复合增速将达69%以上。\n- **大幅调高资本支出预测**：为抢占N2、N3以及先进封装技术（CoWoS）高地并巩固竞争优势，小摩调高2027年和2028年Capex预测至810亿美元和900亿美元。\n- **GPM稳步上升趋势未改**：尽管短期毛利率因折旧摊销增加和2nm爬坡短期承压（3Q26指引65-67%），但先进制程（5%-10%）提价和运营效率改善将推动GPM在中长期逐季走高。\n- **先进制程出货量CAGR高达24%**：预计台积电N5及以下先进制程产能将在2026-28E实现24% CAGR扩张，成长性大幅超越此前预测。\n- **对竞争对手态势的清晰传递**：对于前沿逻辑制程，管理层强调长合伙伙伴关系和技术壁垒将有效隔绝三星、英特尔的竞争；对于成熟制程，仍将维持扩产以强化市占率。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析-上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 分析小摩对AI中长期需求可见度提升及Capex上调的判断背景。\n- [台积电BofA-先进节点资本支出-Arizona盈利改善](entries/台积电BofA-先进节点资本支出-Arizona盈利改善.md) — 综合研判小摩提早预测2027/28年Capex将超过800/900亿美元的激进观点。\n\n## 引用\n- [JPMorgan - TSMC Rising confidence in AI demand](res/台积电/2026-07-16-2330.TW-JPMorgan-TSMC Rising confidence in AI demand, matched by increasing c...-123213157.pdf)", "n160": "# 台积电UBS-2026年Q2业绩及后市毛利率展望\n\n## 摘要\n瑞银对台积电2Q26业绩表现发表快评，上调2026-28年EPS预测9%/7%/9%，重申Buy评级并将目标价由NT$3,400上调至NT$3,650（基于21x 2027-28E PE）。瑞银指出，台积电2026年资本支出指引提升至600亿-640亿美元（瑞银预测2026E实际支出为630亿，2027/28E为800/950亿），此战略行动有利于加速前沿N3/N2制程产能扩张，以确保全球领先地位。瑞银预计2027年逻辑制程提价5%-10%可平抑海外建厂折旧上升。\n\n## 关键要点\n\n- **逻辑制程提价消化折旧风险**：瑞银预测台积电将在2027年初对先进制程产品调价5%-10%，成熟制程调价约5%。这将使2H26和2027E的毛利率保持在67.1%和67.5%的强韧水平，冲抵2nm初期量产陡峭爬坡所带来的3-4%稀释及海外投资折旧。\n- **2026年美元营收增速指引调高**：得益于云端AI投资持续强劲，台积电将2026年美元营收增速指引从30%+调高至40%+以上，瑞银预测2026/27/28年营收将分别增长41%/40%/31%。\n- **高端先进制程提早锁定设备**：上调2026年资本支出中包含拉前N3/N2设备交付以及应对设备成本通胀，这将为确保2026-28年核心 hyperscaler 供给充足提供巨大保障。\n- **与AI其他板块估值错配**：目前台积电估值仅为16.6x 2027E PE，显著低于日月光（ASE 23.3x）和信骅（Aspeed 41.8x）等AI供应链个股，展现了其卓越的安全边际。\n- **亚利桑那美金投资再加码**：新增1000亿美元（累计2650亿美元）长期承诺将强化其在美国先进制程供给主渠道的政治与供应链话语权。\n\n## 关联\n- [台积电2Q26业绩与展望综合分析-上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 了解瑞银判断在各家大行中的共识定位。\n- [台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md) — 对比瑞银前期针对N2U及未来技术节点的商业化时限预测。\n- [台积电UBS-5月营收4170亿-Q2稳步推进-目标价上调至3000](entries/台积电UBS-5月营收4170亿-Q2稳步推进-目标价上调至3000.md) — 比较台积电Q2内月度营收表现及估值调升历史。\n\n## 引用\n- [UBS Equities - TSMC Raising capex and US expansion plans](res/台积电/2026-07-16-2330.TW-UBS Equities-Taiwan Semiconductor Manufacturing _Raising capex and US exp...-123208279.pdf)", "n161": "# UBS快速解读：台积电4月营收NT$4,107亿——Q2开局符合预期\n\n## 摘要\nUBS在台积电4月营收数据发布后发布快评。4月营收NT$4,107亿（-1.1% MoM，+17.5% YoY），Q2累计营收完成UBSe预测的32.3%，QoQ增长约12%的预测在轨道上。N3强劲增长（新AI加速器）和N2更快爬坡将成为2026年主要增长动力。维持买入评级，目标价NT$2,650（21x 2027E PE）。股价NT$2,290（2026年5月8日）。\n\n## 关键要点\n\n- 4月营收NT$4,107亿（-1.1% MoM，+17.5% YoY），符合季节性模式\n- Q2追踪完成UBSe预测的32.3%，QoQ增长约12%的预测稳步推进\n- 2026年美元营收增长预测35%，受N3 AI加速器和N2更快爬坡驱动\n- 强大的云AI机会提升领先制程产能利用率、混合ASP和结构性毛利率\n- 维持买入评级，目标价NT$2,650（21x 2027E PE）\n- UBS EPS预测高于共识：2026E NT$97.98（vs 市场NT$96.59），2027E NT$126.05（vs NT$123.21）\n\n## 关联\n- [UBS五月销售额（2026-06-10）](entries/台积电UBS-5月营收4170亿-Q2稳步推进-目标价上调至3000.md)\n- [UBS US技术研讨会（2026-04-23）](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md)\n\n## 引用\n- [UBS - TSMC April Sales Fast Take](res/台积电/2026-05-08-2330.TW-UBS Equities-UBS Fast Take Taiwan Semiconductor Manufacturing _Apr sale...-121916347.pdf)\n- [UBS快速解读：台积电5月营收NT$4,170亿——Q2稳步推进，目标价上调至NT$3,000](entries/台积电UBS-5月营收4170亿-Q2稳步推进-目标价上调至3000.md) — 共享标签: N2, monthly-sales, tsmc; 同标的: N2, monthly-sales; 共同关键词(18): 2027e, 积电, bs, q2", "n162": "# UBS快速解读：台积电5月营收NT$4,170亿——Q2稳健增长，目标价上调至NT$3,000\n\n## 摘要\nUBS在台积电5月营收数据发布后发布快评。5月营收NT$4,170亿（+1.5% MoM，+30.1% YoY），Q2累计营收已完成UBSe预测的65%，QoQ增长约12%的预测仍在轨道上。UBS将2026年营收增长预测上调至36%（美元计），主要受AI加速器和CPU的N3强劲增长及N2更快爬坡驱动。值得注意的是，UBS将目标价从NT$2,650大幅上调至NT$3,000（基于23x 2027E PE），为所有覆盖报告中最高目标价，反映出对台积电增长前景的强烈信心。但UBS也指出H2毛利率可能从H1的66.8%降至65%，受N2爬坡和海外扩张的稀释影响。\n\n## 关键要点\n\n- 5月营收数据：NT$4,170亿（+1.5% MoM，+30.1% YoY），增速较4月的+17.5% YoY明显加快\n- Q2追踪进度：Q2累计营收已达UBS预估的65%，QoQ增长约12%的预测稳步推进\n- 2026年营收预测上调：预计2026年营收增长36%（美元计），较此前预测的35%小幅上调\n- H2毛利率压力：预计H2毛利率从H1的66.8%降至65%，因N2爬坡初期稀释和海外扩张成本\n- EPS预测上调：2026E EPS NT$98.86（此前NT$97.98），2027E EPS NT$130.54（此前NT$126.05）\n- 长期增长可见度扩展至2030年：首次加入2029-30E财务预测，2029E EPS NT$204.08，2030E EPS NT$243.45\n- 目标价大幅上调：从NT$2,650上调至NT$3,000（+13.2%），基于23x 2027E PE（此前21x），估值倍数扩张反映增长可见度提升\n- UBS vs 市场共识：2026E EPS NT$98.86 vs 市场NT$97.04；2027E EPS NT$130.54 vs 市场NT$124.04\n\n## 关联\n- [UBS四月销售额（2026-05-08）](entries/台积电UBS-4月营收4107亿-符合Q2预期.md)\n- [UBS US技术研讨会（2026-04-23）](entries/台积电UBS-US技术研讨会-A13-A12-N2U路线图与AI护城河.md)\n- [BofA AGM更新（2026-06-04）](entries/台积电BofA-股东大会AI需求与技术执行.md)\n\n## 引用\n- [UBS - TSMC May Sales Fast Take](res/台积电/2026-06-10-2330.TW-UBS Equities-UBS Fast Take Taiwan Semiconductor Manufacturing _May sale...-122508216.pdf)\n- [UBS快速解读：台积电4月营收NT$4,107亿——Q2开局符合预期](entries/台积电UBS-4月营收4107亿-符合Q2预期.md) — 共享标签: N2, monthly-sales, tsmc; 同标的: N2, monthly-sales; 共同关键词(18): 2027e, 积电, bs, q2", "n163": "# UBS：台积电US技术研讨会——通过技术堆栈扩展云AI护城河\n\n## 摘要\nUBS在台积电2026年北美技术研讨会后发布深度报告，维持买入评级与NT$2,650目标价（基于21x 2027E PE）。报告详细分析了台积电在先进制程、先进封装和硅光子领域的扩展路线图，强调其持续的技术领先地位。A13/A12作为A14系列的衍生节点引入，N2U作为N2平台的进一步演进，以及CoWoS扩展至14-reticle尺寸，均显示出台积电在AI时代的全面技术布局。UBS预计2026年营收达NT$5.21兆（+36.8% YoY），EPS NT$97.98（+47.9% YoY）。\n\n## 关键要点\n\n- A13节点：A14的衍生直接缩小版，面积节省6%，与A14设计规则完全兼容，客户可快速迁移，计划2029年量产\n- A12预览：A14的另一衍生节点，采用Super Power Rail背面供电技术，针对AI/HPC优化，计划2029年量产\n- N2U节点：N2新衍生版本，相比N2P速度提升3-4%或功耗降低8-10%，2028年量产，是成本/性能平衡方案\n- CoWoS扩展：14-reticle尺寸CoWoS，可集成约10个大型计算芯片和20个HBM堆栈，2028年量产，2029年扩展至14+ reticle\n- SoIC 3D堆叠：A14-to-A14 SoIC将于2029年量产，die-to-die IO密度相比N2-to-N2提高1.8倍\n- 硅光子COUPE：2026年达到关键量产里程碑，从CPO交换机开始\n- 财务预测：预计2026年营收NT$5.21兆（+36.8%），EBIT利润率57.2%，EPS NT$97.98\n- 高NA EUV：台积电路线图尚未采用高NA光刻，略落后于UBS对ASML的预期，但分析师认可台积电务实的技术升级策略\n\n## 关联\n- [BNP Paribas TSMC技术路线图（2026-04-24）](entries/台积电BNP-技术路线图-A13更新-重申Outperform.md)\n- [BofA产能与技术爬坡（2026-05-15）](entries/台积电BofA-产能与技术爬坡-缓解竞争担忧.md)\n\n## 引用\n- [UBS - TSMC US Tech Symposium](res/台积电/2026-04-23-2330.TW-UBS Equities-Taiwan Semiconductor Manufacturing _US Tech Symposium Scali...-121597085.pdf)\n- [BNP Paribas：台积电推出A13并更新技术路线图——重申Outperform](entries/台积电BNP-技术路线图-A13更新-重申Outperform.md) — 共享标签: A12, technology-roadmap, advanced-packaging; 同标的: A12, technology-roadmap; 共同关键词(11): 积电, 2026, 路线, to", "n164": "# 国信证券传媒行业4月投资策略：持续看好游戏、IP潮玩业绩表现，关注AI应用底部机会\n\n**来源**: 行业研究-传媒 | **机构**: 国信证券\n\n## 摘要\n\n国信证券发布传媒行业4月投资策略报告。报告认为传媒板块当前估值处于历史低位，游戏和IP潮玩赛道基本面强劲，持续推荐超配。游戏板块受新游大作上线周期驱动，2026年二季度多家公司Pipeline充裕；IP潮玩赛道受益于Z世代消费力释放和IP矩阵扩充。同时关注AI应用板块调整后的底部布局机会，认为随着模型能力迭代和推理成本下降，AI应用渗透率有望加速提升，建议关注在AI+内容、AI+营销方向有布局的标的。\n\n## 关键要点\n\n\n- 游戏板块：多家上市公司新游Pipeline密集，二季度有望迎来业绩催化\n- IP潮玩赛道：泡泡玛特等龙头海外扩张加速，IP矩阵持续扩充驱动增长\n- AI应用：板块调整充分，底部布局时机显现，关注AI+内容/营销落地\n- 估值层面：传媒板块整体估值处于历史低位，具备安全边际\n- 推荐标的：腾讯控股、网易、泡泡玛特、三七互娱、昆仑万维\n- 风险提示：宏观经济复苏不及预期，行业监管政策变化，AI商业化进度低于预期\n\n## 关联\n\n- 行业: 传媒, 游戏\n- 机构: 国信证券\n- 相关: 腾讯控股, 网易, 泡泡玛特, 三七互娱\n\n- [JPMorgan 2026 Global China Summit - 中国互联网行业关键洞察](entries/JPMorgan-2026-Global-China-Summit-中国互联网行业关键洞察.md) — 同主题：中国互联网/传媒行业投资\n- [阿里巴巴CY1Q26(4QFY26)预览：AI投资加大，电商CMR增长承压(JPMorgan/UBS)](entries/Alibaba-CY1Q26-Preview-AI-Investment-20260408.md) — 同主题：中国互联网平台投资\n- [腾讯控股2026Q1正式业绩：营收1965亿(+9%)，Non-IFRS净利+11%](entries/腾讯控股2026Q1正式业绩-营收1965亿-9-Non-IFRS净利-11.md) — 同主题：中国互联网龙头业绩", "n165": "# 地平线机器人：Starry舱驾融合方案重塑汽车AI\n\n## 摘要\n地平线机器人在2026 Tech Day发布三款重磅产品：Starry 6P/H舱驾融合SoC(5nm/650 TOPS)、HSD V1.6、以及KaKaClaw自动驾驶OS。MS维持Overweight/TP 10港元，UBS维持Buy/TP 13.2港元。Starry方案相比传统Nvidia+Qualcomm分立方案节省Rmb5,000/车，通过减少线束、壳体和内存(Rmb2-3k DDR节省)实现，首发奇瑞iCar(3Q26 SOP)。比亚迪、奇瑞、长安、北汽、一汽、大众、博世、电装等表达合作意向。\n\n## 关键要点\n\n- Starry 6P: 5nm制程(国内座舱芯片首家)，650 TOPS BPU算力，座舱性能1.4x，AD性能10-19x\n- 经济版Starry 6H: 500 TOPS，针对中低端车型\n- 集成方案节省50%空间和元器件数量，交付时间缩短56%\n- KaKaClaw OS平台兼容非地平线SoC，对标\"FSD+Grok\"，推动公司向AI Agent供应商转型\n- MS预测FY26/27营收63.3亿/93.8亿元，净亏损逐步收窄至FY27转正\n\n## 关联\n- [澜起科技AI互联分析](entries/澜起科技AI互联分析.md)", "n166": "# 大摩科技硬件月报：应用商店转弱但云资本开支再上修\n\n## 摘要\n\nMorgan Stanley的科技硬件月度跟踪显示，消费电子与云基础设施出现显著分化：截至8月17日，App Store净收入月内同比下降0.6%，是四年来首次同比转负，三季度累计仅增长0.5%；7月笔记本ODM产量同比下降24%，三季度预测被下调至2730万台。与之相反，大摩将2027年云资本开支增速预测上调9个百分点至38%，此前2026年预计增长104%，微软、谷歌、Meta、亚马逊等预测均被上调。报告把腾讯、微软等列入云资本开支跟踪池，并覆盖台积电等半导体公司，因此对用户持有的微软、腾讯、台积电和科创50ETF均有映射：消费端偏弱，但AI云基础设施资本开支仍在强化。\n\n## 关键要点\n\n- 截至2026年8月17日，App Store净收入月内同比下降0.6%，为过去四年首次同比负增长；三季度累计同比仅增长0.5%。\n- 美国App Store收入月内同比下降10%，中国增长8%但较7月的9%放缓，日本则同比下降4%。\n- 若趋势延续，苹果9月季度服务收入增速预测存在约20bp、约4500万美元下行风险。\n- 三季度iPhone产量计划基本不变，但iPad产量小幅削减，体现涨价后的需求弹性压力。\n- 7月笔记本ODM产量同比下降24%，为40个月来最差；三季度ODM产量预测降至2730万台，同比下降20%。\n- 大摩预计三季度PC出货量同比下降22%，Windows 11升级需求退坡、消费需求弱和零部件向服务器分配共同构成压力。\n- 云资本开支方向相反：2026年云资本开支预计同比增长104%，2027年预计增长38%，后者较月初预测上调9个百分点。\n- 2027年资本开支预测主要上修来自Google约178亿美元、Meta约88亿美元、微软约75亿美元、亚马逊约60亿美元。\n- 前15大云厂商资本强度预计由2026年的33.2%进一步升至2027年的38.6%，均处十年以上高位。\n- 大摩预计美国四大超大规模云厂商云收入在2027年加速至40%-50%，表明资本开支上升仍有收入增长支撑，但自由现金流和折旧压力同步增大。\n- 对微软是Azure需求和AI基础设施投入的正面验证；对台积电及科创50半导体链是先进芯片需求支撑；对腾讯则同时存在云投入受益与消费互联网需求放缓的分化信号。\n\n## 研判\n\n这份报告强化了组合中的“AI基础设施强、传统消费硬件弱”主线。微软和台积电受益于云资本开支上修，但资本强度攀升到38.6%也意味着必须继续检验AI收入、Azure增速和自由现金流能否覆盖折旧。腾讯在报告中属于资本开支跟踪对象，但App Store疲弱主要是苹果生态和全球游戏消费指标，不能机械外推为腾讯游戏收入下降；应结合腾讯自身流水、递延收入和广告趋势复核。\n\n## 关联\n\n- [微软FQ4/26财报后分析：Azure上修与利润率韧性](entries/微软FQ4-26财报后分析-Azure上修与利润率韧性-UBS.md) — 检验微软资本开支增加是否转化为Azure增长和利润率韧性。\n- [微软FQ4/26财报后分析：Azure超预期与资本开支上限](entries/微软FQ4-26财报后分析-Azure超预期与资本开支上限-BNP-Paribas.md) — 对照AI投入、折旧及自由现金流约束。\n- [台积电2Q26业绩与展望综合分析：上调资本支出与营收指引](entries/台积电2Q26业绩与展望综合分析-上调资本支出与营收指引.md) — 将超大规模云资本开支映射至先进制程与AI芯片需求。\n- [云计算经济性基准显示微软云兼具回报韧性与估值吸引力](entries/云计算经济性基准显示微软云兼具回报韧性与估值吸引力.md) — 评估高资本强度下云业务回报率的可持续性。\n\n## 引用\n\n- [Morgan Stanley — IT Hardware Monthly Data Tracker: C3Q App Store Weakness; Minor iPad Build Cuts; Incremental Cloud Capex Upside](res/行业研究-科技硬件/2026-08-20-Morgan Stanley-IT Hardware Monthly Data Tracker C3Q App Store Weakness; M...-123955081.pdf)\n- 报告日期：2026年8月20日；分析师：Erik W. Woodring、Dylan Liu、Maya C. Neuman、Rauf Ural。", "n167": "# 太空探索技术公司扩产揭示二〇二七年图形处理器短缺与新云机会\n\n## 摘要\n法国巴黎银行依据太空探索技术公司二季度披露的算力路线图，判断二〇二七年人工智能基础设施雄心可能再次超过英伟达系统供给。八家主要云与算力商的英伟达相关新增需求估算超过22吉瓦，而当前市场收入预期仅对应约19吉瓦交付，形成约17%的方向性缺口。短缺将抬高新云厂商的硬件获取门槛，却也可能把单位算力收入维持在每吉瓦300亿至500亿美元，并使新建算力资本回收期缩短至一年以内。对微软而言，Azure需求仍强，但能否获得足够图形处理器将同时决定增长兑现程度与资本效率，报告维持跑赢大市评级及549美元目标价。\n\n## 关键要点\n- 太空探索技术公司计划将人工智能算力从二〇二六年末约2吉瓦提升至二〇二七年末约8吉瓦，即一年新增约6吉瓦；其电力与冷却准备目标更高，达到15至20吉瓦，说明设备供给而非园区规划可能成为主要瓶颈。\n- 法国巴黎银行假设微软与甲骨文各自每季度增加约1吉瓦，亚马逊和谷歌至少以相近速度部署；叠加元宇宙平台公司约14吉瓦规划、两家新云各约1吉瓦新增后，八家机构二〇二七年总新增人工智能容量超过30吉瓦。\n- 对亚马逊、谷歌及元宇宙平台公司的新增容量按50%英伟达份额折算后，八家机构仍需英伟达系统支持逾22吉瓦；这一估计尚未纳入一线人工智能实验室、推理专业商及其他新云，实际需求可能更高。\n- 以每吉瓦约300亿美元收入换算，英伟达二〇二七财年市场收入预期仅隐含约19吉瓦交付，比测算需求低约17%；下一代系统售价更高还会令收入反推的物理交付能力更少，而非更多。\n- 供需增速极不对称：报告引述内存产出年增约20%，而底层人工智能需求增速超过200%，因此二〇二七年前租赁价格快速正常化的概率较低。\n- 太空探索技术公司认为下一代系统每吉瓦可货币化300亿至500亿美元，显著高于行业早期约150亿美元假设；若需求和利用率成立，新算力投资回收期可短于一年，显著改善优质新云的资本回报。\n- 模型效率提升不必然压低算力价格。单块图形处理器能完成更高价值工作，会提升客户对单位算力的支付意愿；报告援引行业观点认为下一年算力甚至可能贵十倍，这与传统商品降价逻辑相反。\n- 竞争风险来自太空探索技术公司与英伟达的排他性表态及其争取较高比例下一代系统的意图；若英伟达优先满足这一战略客户，微软、甲骨文及新云的部署时间表都可能被配额挤压。\n- 新供给并非全部进入通用租赁市场：约10%的太空探索技术公司容量或用于训练下一代大模型，更多容量还将服务企业推理需求，因此名义扩产不等于可出租纯算力同步增加。\n- 获得英伟达战略配额的公司将形成稀缺性优势。报告认为核心编织、星云集团和甲骨文的合作关系使其相对受益，但同一关系也可能因太空探索技术公司加入竞争而被削弱，结论具有明显双向性。\n- 微软的核心风险不是终端需求不足，而是无法取得图形处理器导致Azure不能满足订单；其自研芯片及多供应商能力可部分缓冲，但在高端训练需求上短期仍难完全替代英伟达。\n- 估值上，法国巴黎银行给予微软跑赢大市评级和549美元目标价，采用基于二〇二八财年盈利的25倍未来十二个月市盈率，并单独计入其开放人工智能公司持股价值；短缺若延迟收入确认，也会压缩这一估值兑现的确定性。\n\n## 关联\n- [微软人工智能基础设施深度系列：模型实验室需求与代币优化周期](entries/MSFT-AI基础设施深度系列-OpenAI与Anthropic效应-Token优化周期来临-BNP-Paribas-6-2.md) — 提供模型实验室需求、推理扩张与算力效率变化的前序框架。\n- [微软人工智能基础设施货币化仍处周期早期](entries/MSFT-AI基础设施货币化-仍处AI周期早期阶段-Morgan-Stanley-5-27.md) — 补充微软资本开支转化为Azure收入和长期回报的逻辑。\n- [微软三季度资本开支、Azure加速与定价转型](entries/MSFT-FQ3-26-深度分析-Capex飙升-Azure加速与定价模式转型-UBS.md) — 对照微软最新资本开支压力、云增长及供给约束。\n\n## 引用\n- [法国巴黎银行：新云与太空探索技术公司的算力稀缺启示](res/微软/2026-08-05-MSFT.OQ-BNP Paribas-SOFTWARE  Neoclouds SpaceX read-across. Compute (and GPU) ...-123634801.pdf)", "n168": "---\ntype: Analysis\ntitle: 宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick\ndescription: 宁波银行2026Q1营收+10.2% YoY，净利润+10.3% YoY，NIM环比回升5bps至1.73%，贷款+15.7% YoY持续市占率提升，资产质量稳定(NPL 0.76%)，MS目标价45元对应0.87x 2026E P/B\ntimestamp: 2026-06-24T10:00:00+08:00\nresource: res/宁波银行/2026-04-26-002142.SZ-Morgan Stanley-Bank of Ningbo Co. Ltd 1Q26 Revenue, PPOP and profit growt...-121638787.undefined.pdf\nsource_type: pdf\ntags: [bank-of-ningbo, profit-trend, valuation, 2026-Q1]\n---\n\n# 宁波银行2026Q1：营收和利润重回双位数增长\n\n## 摘要\n宁波银行2026Q1营收和净利润重回双位数增长（+10.2%/+10.3% YoY），主要由NII强劲增长（+14.4% YoY）和手续费收入反弹（+81.7% YoY）驱动。NIM环比回升5bps至1.73%，贷款余额同比+15.7%，持续市占率提升（对公贷款+16.6% QoQ）。资产质量稳定，NPL比率持平于0.76%，拨备覆盖率369.4%。Morgan Stanley维持Overweight评级和Top Pick，目标价45元，当前估值0.87x 2026E P/B具吸引力。\n\n## 关键要点\n\n- 2026Q1营收同比+10.2%（vs 2025全年+8.0%），净利润同比+10.3%（vs 2025全年+8.1%），增速明显加速\n- NII同比+14.4%，NIM环比回升5bps至1.73%，受益于贷款收益率提升（对公贷款+16.6% QoQ，票据-12.1%）\n- 手续费收入同比+81.7%，由财富管理和资管业务驱动\n- 贷款同比+15.7%，存款同比+10.6%，均大幅高于行业均值（行业贷款+3.2% QoQ，存款+4.2% QoQ）\n- 资产质量稳定：NPL比率0.76%持平QoQ，关注类贷款比率-8bps至1.06%，逾期90天以上贷款比率-2bps至0.58%\n- MS目标价45元（+39%上行空间），当前估值0.87x 2026E P/B\n- 2026E/2027E EPS预测4.80/5.55元，ROE 14.3%/14.8%\n\n## 引用\n- [Morgan Stanley - Bank of Ningbo 1Q26 Update](res/宁波银行/2026-04-26-002142.SZ-Morgan Stanley-Bank of Ningbo Co. Ltd 1Q26 Revenue, PPOP and profit growt...-121638787.undefined.pdf)\n- [宁波银行UBS 1Q26快评：超预期+分红率大幅提升至27%](entries/宁波银行UBS-1Q26快评-超预期-分红率大幅提升至27.md) — 共享标签: valuation, profit-trend, bank-of-ningbo; 同标的: bank-of-ningbo; 共同关键词(15): 银行, bank, yoy, 2026\n- [福耀玻璃BofA 1Q26：EBIT超预期10%，ASP增长11%驱动](entries/福耀玻璃BofA-1Q26-EBIT超预期10-ASP增长11-驱动.md) — 共享标签: valuation, profit-trend, 2026-Q1; 共同关键词(10): yoy, 2026, pdf, 增长\n- [福耀玻璃BNP 1Q26：运营和利润率保持稳健，重申Outperform](entries/福耀玻璃BNP-1Q26-运营和利润率保持稳健-重申Outperform.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(9): 和利, yoy, or, 2026\n- [福耀玻璃MS 1Q26电话会：ASP超指引，市占率持续提升](entries/福耀玻璃MS-1Q26电话会-ASP超指引-市占率持续提升.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(8): yoy, 2026, pdf, 00\n- [福耀玻璃UBS 1Q26快评：毛利率超预期，剔除汇兑利润+10% YoY](entries/福耀玻璃UBS-1Q26快评-毛利率超预期-剔除汇兑利润-10-YoY.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(7): yoy, 2026, pdf, 利润\n- [福耀玻璃JPM 1Q26：管理层看好2Q26订单动能，ASP增长可持续](entries/福耀玻璃JPM-1Q26-管理层看好2Q26订单动能-ASP增长可持续.md) — 共享标签: profit-trend, 2026-Q1; 共同关键词(6): 2026, pdf, 增长, 00", "n169": "# 宁波银行2026年半年报：营收利润双位数增长，中收增长54%\n\n## 摘要\n宁波银行2026年上半年实现营业收入414.50亿元，同比增长11.54%；归属于母公司股东的净利润165.62亿元，同比增长12.12%，基本每股收益2.51元，年化加权平均ROE为14.24%。盈利增长由净利息收入和手续费收入共同推动：净利息收入同比增长14.26%，手续费及佣金净收入同比增长53.90%，但净息差仍受资产收益率下行影响，同比下降6个基点至1.70%。截至2026年6月末，不良贷款率保持0.76%，拨备覆盖率373.35%，核心一级资本充足率升至9.53%，整体资产质量与资本安全垫保持稳定。\n\n## 关键要点\n\n1. **营收利润双位数增长**：2026H1营业收入414.50亿元，同比增长11.54%；归母净利润165.62亿元，同比增长12.12%；扣非归母净利润165.93亿元，同比增长12.38%。\n2. **ROE与每股指标改善**：基本及稀释每股收益均为2.51元，同比增长12.05%；年化加权平均ROE为14.24%，同比提高0.44个百分点；每股净资产36.76元，较年初增长9.11%。\n3. **净利息收入保持强劲**：净利息收入293.94亿元，同比增长14.26%；生息资产平均余额同比扩张，贷款日均规模同比增长16.23%，其中对公贷款日均规模同比增长25.69%。\n4. **净息差仍然承压**：2026H1净息差1.70%，同比下降6bp；生息资产收益率同比下降45bp、贷款平均收息率下降52bp至3.86%，存款付息率下降39bp至1.32%，负债降本部分抵消资产端重定价压力。\n5. **中间业务成为突出亮点**：手续费及佣金净收入43.17亿元，同比增长53.90%，占营业收入10.41%、同比提高2.87个百分点；增长主要来自财富代销及资产管理费收入。\n6. **扩表速度领先**：总资产3.948万亿元，较年初增长8.81%；客户贷款及垫款本金1.950万亿元，较年初增长12.50%；客户存款本金2.295万亿元，较年初增长13.33%。\n7. **贷款结构向对公倾斜**：公司贷款较年初增长19.32%至1.280万亿元，个人贷款仅增长0.47%至5370.04亿元；个人贷款在贷款总额中的占比降至27.55%。\n8. **低成本存款结构改善**：活期存款占比35.57%，较年初提高1.14个百分点；对公活期存款平均付息率由0.71%降至0.38%，对私活期存款平均付息率由0.07%降至0.05%。\n9. **资产质量保持稳定**：不良贷款余额147.94亿元，不良率0.76%与年初持平；逾期贷款167.99亿元，占贷款总额0.86%；拨备覆盖率373.35%，贷款拨备率2.83%。\n10. **零售信贷风险仍需跟踪**：个人贷款不良率约2.00%，其中个人消费贷1.78%、个体经营贷3.81%、住房贷款1.20%，明显高于公司贷款整体约0.29%的不良水平。\n11. **拨备计提较为审慎**：信用及资产减值损失115.77亿元，同比增长23.79%，主要因贷款规模扩张带动贷款减值损失同比增加26.35%。\n12. **资本指标改善但需持续观察**：资本充足率14.64%、一级资本充足率11.16%、核心一级资本充足率9.53%，分别较年初提高0.34、0.76和0.19个百分点。\n13. **运营效率明显提升**：业务及管理费用112.61亿元，同比下降0.19%；成本收入比27.17%，较年初口径下降5.55个百分点，较上年同期下降约3.19个百分点。\n14. **中期分红落地**：公司拟以66.04亿股为基数，每10股派发现金红利4元（含税），方案尚需股东会批准。\n15. **子公司利润中心继续贡献**：永赢基金H1净利润5.22亿元、永赢金租16.69亿元、宁银理财6.14亿元、宁银消金2.64亿元，支持多元盈利模式。\n\n## 核心判断\n\n本期财报验证了宁波银行依靠客户经营、规模扩张、负债降本和多元利润中心实现双位数增长的能力。最大正向变化是手续费收入与成本效率改善，最大约束仍是贷款收益率下行导致的净息差压力。资产质量尚未出现系统性恶化，但个人经营贷和消费贷不良率高于对公业务，需在后续季度持续跟踪关注类、逾期90天以上贷款和不良生成率。\n\n## 后续跟踪指标\n\n- 净息差能否稳定在1.65%-1.70%附近，存款重定价红利能否继续覆盖贷款收益率下行。\n- 手续费净收入高增长能否延续，财富代销、永赢基金和宁银理财规模增长是否转化为可持续收入。\n- 个人贷款增速能否恢复，以及个体经营贷3.81%的不良率是否继续上升。\n- 不良率是否维持0.80%以内、关注率及逾期90天以上贷款是否恶化。\n- 核心一级资本充足率能否维持9.5%左右，快速扩表是否带来资本补充压力。\n\n## 关联\n\n- [宁波银行2026Q1：营收和利润重回双位数增长，Morgan Stanley维持Top Pick](entries/宁波银行2026Q1-营收和利润重回双位数增长-Morgan-Stanley维持Top-Pick.md) — 对照Q1净息差、手续费收入、贷款增长和资产质量趋势，判断半年报是否兑现卖方预期。\n- [宁波银行UBS 1Q26快评：超预期+分红率大幅提升至27%](entries/宁波银行UBS-1Q26快评-超预期-分红率大幅提升至27.md) — 对照UBS对负债降本、中收增长及分红改善的判断，并跟踪Q2变化。\n- [宁波银行
